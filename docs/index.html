class Quiz{
  constructor(root,opt={}){this.root=root;this.tags=opt.tags||null;this.start()}
  start(){
    const keep=q=>!this.tags||this.tags.includes(q.tag.replace(/^สุ่ม · /,""));
    const fixed=FIXED.filter(keep).map(q=>{const idx=shuf(q.o.map((t,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
    this.qs=[...fixed,...randomQs().filter(keep)];this.ans={};this.draw();
  }
  draw(){
    this.root.innerHTML=`<div class="card score"><div><span class="muted">ตอบแล้ว</span> <span class="num" id="qz-done">0</span><span class="muted"> / ${this.qs.length}</span> · <span class="muted">ถูก</span> <span class="num" id="qz-ok">0</span></div><div class="bar" aria-hidden="true"><i id="qz-bar" style="width:0"></i></div><button class="btn" type="button" id="qz-reset">↺ ทำใหม่ (สุ่มโจทย์ใหม่)</button></div>
      <div class="qlist">${this.qs.map((q,i)=>`<article class="card q" id="q${i}"><div class="q-head"><span class="q-no">${String(i+1).padStart(2,'0')}</span><span class="q-text">${q.q}</span><span class="q-tag">${q.tag}</span></div>${q.graph?`<svg class="qsvg" data-g="${i}" role="img" aria-label="กราฟประกอบคำถาม"></svg>`:''}<div class="opts">${q.o.map((t,k)=>`<button class="opt" type="button" data-q="${i}" data-o="${k}">${esc(String(t))}</button>`).join('')}</div><div class="q-exp" hidden></div></article>`).join('')}</div>`;
    $$('.qsvg',this.root).forEach(s=>{const v=new GraphView(s,this.qs[+s.dataset.g].graph,{});v.update({nodes:{},edges:{}},false)});
    $('#qz-reset').addEventListener('click',()=>{this.start();window.scrollTo({top:this.root.getBoundingClientRect().top+scrollY-120})});
    if(!this.bound){this.bound=1;this.root.addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)this.answer(+b.dataset.q,+b.dataset.o)})}
  }
  answer(i,k){
    if(i in this.ans)return;
    this.ans[i]=k;const q=this.qs[i],card=$('#q'+i);
    $$('.opt',card).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
    const ex=$('.q-exp',card);ex.hidden=false;ex.innerHTML=(k===q.a?'✅ <b>ถูกต้อง</b> ':'❌ <b>ยังไม่ถูก</b> ')+esc(q.e);
    const done=Object.keys(this.ans).length,ok=Object.entries(this.ans).filter(([a,b])=>this.qs[a].a===b).length;
    if(done===this.qs.length&&this.onDone)this.onDone(ok,done);
    $('#qz-done').textContent=done;$('#qz-ok').textContent=ok;$('#qz-bar').style.width=(done/this.qs.length*100)+'%';
  }

// แล็บเดิมหา element ด้วย id คงที่ จึงสร้างไว้ครั้งเดียวในที่จอด (#ap-park) แล้วย้ายทั้งก้อนเข้าหน้าเมื่อเปิดดู
const PARK_IDS=['coin','prim','kruskal','dijkstra','huffman'];
const MODS={};let cur=null;
function section(id){
  let s=document.getElementById('tab-'+id);
  if(!s){s=document.createElement('section');s.id='tab-'+id;s.className='m-gr gr-lab';document.getElementById('ap-park').appendChild(s)}
  return s;
}
function ensure(id){
  if(MODS[id])return MODS[id];
  section(id);
  if(id==='coin')MODS.coin=new CoinLab();
  else if(id==='huffman')MODS.huffman=new HuffLab();
  else{if(!LABS.prim)PARK_IDS.slice(1,4).forEach(section),initLabs();MODS.prim=LABS.prim;MODS.kruskal=LABS.kruskal;MODS.dijkstra=LABS.dijkstra}
  return MODS[id];
}
function mountLab(id,host){
  const m=ensure(id),s=section(id);
  host.appendChild(s);cur=m;
  if(m.player)m.player.go(m.player.i,0);
  return m;
}
function unmount(){
  if(cur&&cur.player)cur.player.pause();cur=null;
  const park=document.getElementById('ap-park');
  PARK_IDS.forEach(id=>{const s=document.getElementById('tab-'+id);if(s&&s.parentNode!==park)park.appendChild(s)});
}
document.addEventListener('keydown',e=>{
  if(!cur||!cur.root||!cur.root.isConnected||cur.root.closest('[hidden]'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const p=cur.player;if(!p)return;
  if(e.key==='ArrowRight'){e.preventDefault();p.next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();p.prev()}
  else if(e.key===' '&&!t.closest('button,a')){e.preventDefault();p.toggle()}
  else if(e.key==='r'||e.key==='R'){p.reset()}
});

  "title": "ข้อ 6: ขโมยของในพิพิธภัณฑ์แบบแบ่งส่วนได้ (Fractional Knapsack)",
  "html": "<p><strong>โจทย์:</strong> มีของ <code>items</code> เป็นคู่ (value, weight) กระเป๋ารับน้ำหนักได้สูงสุด W สามารถแบ่งส่วนของได้ จงหามูลค่ารวมสูงสุด</p>\n<pre><code>def max_value_knapsack(items, W):\n    # เขียนโค้ด Greedy ตรงนี้ (คำใบ้: คิดมูลค่าต่อหน่วยน้ำหนักก่อน)\n    pass\n\nprint(max_value_knapsack([(60, 10), (100, 20), (120, 30)], 50)) # ผลลัพธ์: 240.0</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>คำนวณความคุ้มค่า หรือ <strong>มูลค่าต่อหน่วยน้ำหนัก (value / weight)</strong> ของแต่ละชิ้น</li>\n    <li>เรียงลำดับของจากชิ้นที่มีมูลค่าต่อหน่วยน้ำหนัก \"มากที่สุด\" ไปยัง \"น้อยที่สุด\"</li>\n    <li>วนลูปหยิบของใส่กระเป๋า ถ้ากระเป๋ายังรับน้ำหนักของชิ้นนั้นได้ทั้งหมด ให้หยิบไปทั้งชิ้น</li>\n    <li>ถ้าพื้นที่กระเป๋าเหลือไม่พอสำหรับทั้งชิ้น ให้ตัดแบ่งเฉพาะส่วนที่เหลือพอใส่กระเป๋า แล้วจบการทำงาน</li>\n  </ol>\n  <pre><code>def max_value_knapsack(items, W):\n    # เรียงตาม value/weight จากมากไปน้อย\n    sorted_items = sorted(items, key=lambda x: x[0] / x[1], reverse=True)\n    \n    total_value = 0.0\n    current_capacity = W\n    \n    for value, weight in sorted_items:\n        if current_capacity >= weight:\n            total_value += value\n            current_capacity -= weight\n        else:\n            # ตัดแบ่งของชิ้นสุดท้ายตามความจุที่เหลือ\n            total_value += (value / weight) * current_capacity\n            break\n            \n    return total_value\n\n# Test Cases เพิ่มเติม\nprint(max_value_knapsack([(60, 10), (100, 20), (120, 30)], 50)) # 240.0\nprint(max_value_knapsack([(50, 10)], 5))                         # 25.0\nprint(max_value_knapsack([(10, 10), (20, 20)], 100))             # 30.0</code></pre>\n</details>"

  "title": "ข้อ 7: จับคู่พนักงานทำความสะอาดชิ้นงาน (Minimize Maximum Pair Sum)",
  "html": "<p><strong>โจทย์:</strong> จับคู่พนักงาน N คน (ความเร็วใน <code>skills</code>) ออกเป็นคู่ๆ โดยให้ผลรวมความเร็วของคู่ที่ช้าที่สุด มีค่าน้อยที่สุดเท่าที่เป็นไปได้</p>\n<pre><code>def minimize_max_pair(skills):\n    # เขียนโค้ด Greedy ตรงนี้\n    pass\n\nprint(minimize_max_pair([3, 5, 2, 3, 4, 6])) # ผลลัพธ์: 8</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>เรียงลำดับทักษะ/ความเร็วของพนักงานจากน้อยไปมาก</li>\n    <li>เพื่อไม่ให้เกิดคู่ที่มีค่ารวมสูงเกินไป ให้กระจายความเสี่ยงโดยการ <strong>จับคู่คนเก่งที่สุดกับคนอ่อนที่สุด</strong> เสมอ</li>\n    <li>ใช้ Two-Pointers (ซ้ายสุด + ขวาสุด) ในการจับคู่ แล้วหาค่าผลรวมคู่ที่สูงที่สุดในบรรดาทุกคู่</li>\n  </ol>\n  <pre><code>def minimize_max_pair(skills):\n    skills.sort()\n    max_pair_sum = 0\n    left = 0\n    right = len(skills) - 1\n    \n    while left < right:\n        current_pair_sum = skills[left] + skills[right]\n        max_pair_sum = max(max_pair_sum, current_pair_sum)\n        left += 1\n        right -= 1\n        \n    return max_pair_sum\n\n# Test Cases เพิ่มเติม\nprint(minimize_max_pair([3, 5, 2, 3, 4, 6])) # 8 ((2,6), (3,5), (3,4))\nprint(minimize_max_pair([3, 5, 4, 5, 2, 6])) # 8\nprint(minimize_max_pair([1, 1, 1, 8, 9, 10])) # 11 ((1,10), (1,9), (1,8))</code></pre>\n</details>"

  "html": "<p><strong>โจทย์:</strong> ต่อเชือกใน <code>ropes</code> ทั้งหมดเข้าด้วยกันเป็นเส้นเดียว โดยค่าใช้จ่ายในการต่อแต่ละครั้งเท่ากับผลรวมความยาวเชือก 2 เส้น จงหาค่าใช้จ่ายรวมที่น้อยที่สุด</p>\n<pre><code>def min_cost_connect(ropes):\n    # เขียนโค้ด Greedy ตรงนี้ (คำใบ้: เลือกต่อเส้นที่สั้นที่สุดสองเส้นเสมอ)\n    pass\n\nprint(min_cost_connect([4, 3, 2, 6])) # ผลลัพธ์: 29</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>การต่อเชือกจะทำให้ความยาวรวมถูกนำไปบวกรวมในรอบถัดๆ ไปด้วย ดังนั้น <strong>เชือกเส้นที่สั้นควรถูกต่อก่อน</strong> เพื่อให้ถูกนำไปบวกซ้ำน้อยที่สุด</li>\n    <li>แปลง List ของเชือกให้เป็น <strong>Min-Heap (Priority Queue)</strong> เพื่อให้หาเชือก 2 เส้นที่สั้นที่สุดได้เร็วที่สุด (<i>O(log N)</i>)</li>\n    <li>ดึงเชือกที่สั้นที่สุด 2 เส้นออกมาต่อกัน คำนวณค่าใช้จ่าย แล้วใส่เชือกเส้นใหม่ที่ต่อแล้วกลับเข้าไปใน Heap</li>\n    <li>ทำซ้ำจนกว่าจะเหลือเชือกเพียงเส้นเดียว</li>\n  </ol>\n  <pre><code>import heapq\n\ndef min_cost_connect(ropes):\n    if len(ropes) <= 1:\n        return 0\n        \n    heapq.heapify(ropes)\n    total_cost = 0\n    \n    while len(ropes) > 1:\n        first = heapq.heappop(ropes)\n        second = heapq.heappop(ropes)\n        \n        cost = first + second\n        total_cost += cost\n        \n        heapq.heappush(ropes, cost)\n        \n    return total_cost\n\n# Test Cases เพิ่มเติม\nprint(min_cost_connect([4, 3, 2, 6])) # 29 ((2+3=5), (5+4=9), (9+6=15) -> 5+9+15=29)\nprint(min_cost_connect([1, 2, 5, 10, 35])) # 85\nprint(min_cost_connect([8])) # 0 (ไม่ต้องต่อ)</code></pre>\n</details>"

  "html": "<p><strong>โจทย์:</strong> มีงาน <code>jobs = [(Job_ID, Deadline, Profit), ...]</code> แต่ละงานใช้เวลา 1 หน่วย จัดลำดับงานให้ได้กำไรสูงสุด</p>\n<pre><code>def job_scheduling(jobs):\n    # เขียนโค้ด Greedy ตรงนี้\n    pass\n\nprint(job_scheduling([('A', 2, 100), ('B', 1, 19), ('C', 2, 27), ('D', 1, 25), ('E', 3, 15)])) \n# ผลลัพธ์: ['C', 'A', 'E'] (กำไร 142)</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>เรียงลำดับงานตาม <strong>กำไร (Profit)</strong> จากมากไปน้อย เพื่อให้ความสำคัญกับงานทำเงินก่อน</li>\n    <li>สร้างตารางช่วงเวลา (Slots) ตาม Deadline สูงสุดที่มี</li>\n    <li>สำหรับแต่ละงาน ให้พยายามจัดลงช่วงเวลาที่ <strong>เลทที่สุดเท่าที่เป็นไปได้</strong> แต่ไม่เกิน Deadline ของงานนั้น (เพื่อให้ช่วงเวลาแรกๆ ว่างไว้รองรับงานอื่นที่มี Deadline กระชั้นชิดกว่า)</li>\n  </ol>\n  <pre><code>def job_scheduling(jobs):\n    # เรียงตาม Profit จากมากไปน้อย\n    sorted_jobs = sorted(jobs, key=lambda x: x[2], reverse=True)\n    \n    max_deadline = max(job[1] for job in jobs) if jobs else 0\n    # สร้าง slot เก็บผลลัพธ์ (index 1 ถึง max_deadline)\n    slots = [None] * (max_deadline + 1)\n    \n    for job_id, deadline, profit in sorted_jobs:\n        # หาสล็อตว่างย้อนหลังจาก deadline\n        for t in range(deadline, 0, -1):\n            if slots[t] is None:\n                slots[t] = job_id\n                break\n                \n    # กรองเอาเฉพาะสล็อตที่มีการจัดงาน\n    return [job for job in slots if job is not None]\n\n# Test Cases เพิ่มเติม\nprint(job_scheduling([('A', 2, 100), ('B', 1, 19), ('C', 2, 27), ('D', 1, 25), ('E', 3, 15)])) \n# ['C', 'A', 'E'] (สล็อต 1: C, สล็อต 2: A, สล็อต 3: E)\nprint(job_scheduling([('X', 1, 50), ('Y', 1, 60)])) # ['Y']</code></pre>\n</details>"

  "title": "ข้อ 10: สถานีฐานกระจายสัญญาณน้อยที่สุด (Minimum Storage Server / Partitioning)",
  "html": "<p><strong>โจทย์:</strong> บ้านบนเส้นตรงในตำแหน่ง <code>houses</code> ตั้งเสาสัญญาณที่มีรัศมีครอบคลุม R เมตร (ครอบคลุม [X-R, X+R]) หาจำนวนเสาน้อยที่สุดที่คลุมบ้านทุกหลัง</p>\n<pre><code>def min_stations(houses, R):\n    # เขียนโค้ด Greedy ตรงนี้\n    pass\n\nprint(min_stations([1, 2, 3, 10, 14, 17], 3)) # ผลลัพธ์: 2</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>เรียงลำดับตำแหน่งบ้านจากน้อยไปมาก</li>\n    <li>พิจารณาบ้านหลังแรกที่ยังไม่ถูกครอบคลุมโดยสัญญาณ</li>\n    <li>วางเสาสัญญาณในตำแหน่งที่ <strong>ไกลออกไปทางขวามากที่สุดเท่าที่จะยังคลุมบ้านหลังนี้ได้</strong> (นั่นคือ ตำแหน่ง <code>ตำแหน่งบ้าน + R</code>)</li>\n    <li>ข้ามบ้านหลังถัดๆ ไปทั้งหมดที่อยู่ในรัศมีครอบคลุมของเสานี้ (รัศมีไปถึง <code>ตำแหน่งเสา + R</code>) แล้วเริ่มกระบวนการใหม่กับบ้านหลังแรกที่หลุดขอบสัญญาณ</li>\n  </ol>\n  <pre><code>def min_stations(houses, R):\n    if not houses:\n        return 0\n        \n    houses.sort()\n    stations = 0\n    i = 0\n    n = len(houses)\n    \n    while i < n:\n        # บ้านหลังแรกที่ยังไม่ได้รับการครอบคลุม\n        loc = houses[i]\n        \n        # ขยับไปหาบ้านที่ไกลที่สุดทางขวาที่ยังห่างจาก loc ไม่เกิน R (เพื่อวางเสา)\n        while i < n and houses[i] - loc <= R:\n            i += 1\n            \n        # วางเสาที่บ้านหลังก่อนหน้า\n        station_pos = houses[i - 1]\n        stations += 1\n        \n        # ข้ามบ้านทั้งหมดที่อยู่ในรัศมีกระจายสัญญาณฝั่งขวาของเสานี้\n        while i < n and houses[i] - station_pos <= R:\n            i += 1\n            \n    return stations\n\n# Test Cases เพิ่มเติม\nprint(min_stations([1, 2, 3, 10, 14, 17], 3)) # 2 (เสาที่ 3 คลุม 1,2,3 และ เสาที่ 13 คลุม 10,14)\nprint(min_stations([1, 5, 9], 2))            # 3 (ห่างเกินรัศมี ต้องตั้งแยกทุกหลัง)</code></pre>\n</details>"

  "title": "ข้อ 11: การจองตั๋วรถไฟและหาจำนวนชานชาลา (Minimum Platforms)",
  "html": "<p><strong>โจทย์:</strong> มีเวลารถไฟเข้า <code>arrival</code> และออกจากสถานี <code>departure</code> จงหาจำนวนชานชาลาน้อยที่สุดที่ต้องมีเพื่อรองรับรถไฟพร้อมกันได้พอดี</p>\n<pre><code>def find_min_platforms(arrival, departure):\n    # เขียนโค้ด Greedy ตรงนี้\n    pass\n\narr = [900, 940, 950, 1100, 1500, 1800]\ndep = [910, 1200, 1120, 1130, 1900, 2000]\nprint(find_min_platforms(arr, dep)) # ผลลัพธ์: 3</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>เรียงลำดับเวลาเข้า (arrival) และเวลาออก (departure) แยกกันจากน้อยไปมาก</li>\n    <li>ใช้ Two-Pointers จำลองเหตุการณ์ตามแกนเวลา:\n      <ul>\n        <li>ถ้ารถไฟเข้าจอดก่อนรถไฟอีกขบวนออก (<i>arr[i] ≤ dep[j]</i>) ต้อง <strong>เพิ่มชานชาลา</strong> 1 ที่ แล้วขยับ pointer <i>i</i></li>\n        <li>ถ้ารถไฟออกก่อนรถไฟเข้า (<i>arr[i] > dep[j]</i>) สามารถ <strong>คืนชานชาลา</strong> ได้ 1 ที่ แล้วขยับ pointer <i>j</i></li>\n      </ul>\n    </li>\n    <li>บันทึกค่าชานชาลาที่ถูกใช้งานพร้อมกันมากที่สุด (Maximum Concurrent Platforms)</li>\n  </ol>\n  <pre><code>def find_min_platforms(arrival, departure):\n    arrival.sort()\n    departure.sort()\n    \n    platforms_needed = 0\n    max_platforms = 0\n    \n    i = 0  # pointer สำหรับ arrival\n    j = 0  # pointer สำหรับ departure\n    n = len(arrival)\n    \n    while i < n and j < n:\n        if arrival[i] <= departure[j]:\n            platforms_needed += 1\n            max_platforms = max(max_platforms, platforms_needed)\n            i += 1\n        else:\n            platforms_needed -= 1\n            j += 1\n            \n    return max_platforms\n\n# Test Cases เพิ่มเติม\narr = [900, 940, 950, 1100, 1500, 1800]\ndep = [910, 1200, 1120, 1130, 1900, 2000]\nprint(find_min_platforms(arr, dep)) # 3\n\narr2 = [900, 1100, 1200]\ndep2 = [1000, 1130, 1300]\nprint(find_min_platforms(arr2, dep2)) # 1 (ไม่ชนเวลากันเลย)</code></pre>\n</details>"

  "title": "ข้อ 12: การสร้างรหัสประหยัดพื้นที่ Huffman Coding (Huffman Tree Basis)",
  "html": "<p><strong>โจทย์:</strong> รับ Dictionary ความถี่ตัวอักษร รวมโหนดที่มีความถี่น้อยสุด 2 โหนดเข้าด้วยกันเป็นโหนดใหม่ ทำซ้ำจนเหลือโหนดเดียว คืนค่าผลรวมน้ำหนักของกระบวนการรวมทั้งหมด (Sum of combined frequencies)</p>\n<pre><code>def huffman_base_cost(freq_dict):\n    # เขียนโค้ด Greedy ตรงนี้\n    pass\n\nprint(huffman_base_cost({'a': 5, 'b': 9, 'c': 12, 'd': 13, 'e': 16, 'f': 45})) # ผลลัพธ์: 224</code></pre>\n<details class=\"gp-sol\"><summary>ดูเฉลยและแนวคิด</summary>\n  <h4>แนวคิด Greedy (Step-by-Step):</h4>\n  <ol>\n    <li>สร้าง <strong>Min-Heap</strong> จากค่าความถี่ทั้งหมดใน Dictionary</li>\n    <li>ดึงโหนดที่มีค่าความถี่น้อยที่สุด 2 โหนดออกมาจาก Heap</li>\n    <li>นำความถี่ของทั้งสองมารวมกัน บันทึกค่าน้ำหนักการรวมนี้สะสมไว้ในผลรวมทั้งหมด</li>\n    <li>นำความถี่ผลรวมใหม่ใส่กลับเข้าไปใน Min-Heap</li>\n    <li>ทำซ้ำจนกระทั่งเหลือโหนดใน Heap เพียงโหนดเดียว</li>\n  </ol>\n  <pre><code>import heapq\n\ndef huffman_base_cost(freq_dict):\n    if len(freq_dict) <= 1:\n        return 0\n        \n    heap = list(freq_dict.values())\n    heapq.heapify(heap)\n    \n    total_cost = 0\n    \n    while len(heap) > 1:\n        first = heapq.heappop(heap)\n        second = heapq.heappop(heap)\n        \n        combined = first + second\n        total_cost += combined\n        \n        heapq.heappush(heap, combined)\n        \n    return total_cost\n\n# Test Cases เพิ่มเติม\nprint(huffman_base_cost({'a': 5, 'b': 9, 'c': 12, 'd': 13, 'e': 16, 'f': 45})) # 224\nprint(huffman_base_cost({'a': 1, 'b': 2, 'c': 3}))                             # 9 ((1+2=3), (3+3=6) -> 3+6=9)</code></pre>\n</details>"

  U.table = (head, rows, cls) => `<div class="ap-tscroll"><table class="ap-t ${cls || ''}"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => (i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>`;
  // ตาราง DP: cells[r][c] = ข้อความ หรือ {t, c: class}
  U.dpt = (corner, cols, rows, cells) => `<div class="ap-tscroll"><table class="ap-dpt"><thead><tr><th>${corner}</th>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr><th>${r}</th>${cells[i].map((c) => (typeof c === 'object' ? `<td class="${c.c || ''}">${c.t}</td>` : `<td>${c}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>`;
  U.link = (id, label) => `<a href="#t/${id}/learn">${label || AP.topic(id).no + ' ' + AP.topic(id).short}</a>`;
  U.cx = (rows) => U.table(['', 'เวลา', 'พื้นที่'], rows);

  /* ---------- อัลกอริทึมช่วยคำนวณตารางตัวอย่าง ---------- */
  function unbounded(w, v, cap) {
    const F = [0];
    for (let j = 1; j <= cap; j++) { let b = 0; w.forEach((wi, i) => { if (wi <= j) b = Math.max(b, F[j - wi] + v[i]); }); F[j] = b; }
    return F;
  }
  function subsetTable(S, T) {
    const t = [Array.from({ length: T + 1 }, (_, j) => j === 0)];
    S.forEach((s, i) => t.push(t[i].map((x, j) => x || (j >= s && t[i][j - s]))));
    return t;
  }
  function lcsTable(X, Y) {
    const L = Array.from({ length: X.length + 1 }, () => Array(Y.length + 1).fill(0));
    for (let i = 1; i <= X.length; i++) for (let j = 1; j <= Y.length; j++) L[i][j] = X[i - 1] === Y[j - 1] ? L[i - 1][j - 1] + 1 : Math.max(L[i - 1][j], L[i][j - 1]);
    // ย้อนรอย: ถ้าเท่ากันเลือกขึ้นบนก่อน
    let i = X.length, j = Y.length, s = ''; const path = new Set();
    while (i > 0 && j > 0) {
      if (X[i - 1] === Y[j - 1]) { s = X[i - 1] + s; path.add(i + ',' + j); i--; j--; }
      else if (L[i - 1][j] >= L[i][j - 1]) i--; else j--;
    }
    return { L, s, path };
  }
  function mcm(p) {
    const n = p.length - 1, m = Array.from({ length: n + 1 }, () => Array(n + 1).fill(0)), s = Array.from({ length: n + 1 }, () => Array(n + 1).fill(0));
    for (let l = 2; l <= n; l++) for (let i = 1; i + l - 1 <= n; i++) { const j = i + l - 1; m[i][j] = INF; for (let k = i; k < j; k++) { const c = m[i][k] + m[k + 1][j] + p[i - 1] * p[k] * p[j]; if (c < m[i][j]) { m[i][j] = c; s[i][j] = k; } } }
    return { m, s, n };
  }
  const paren = (s, i, j) => (i === j ? 'A' + i : `(${paren(s, i, s[i][j])} ${paren(s, s[i][j] + 1, j)})`);
  U.calc = { unbounded, subsetTable, lcsTable, mcm, paren };

  const L = {};

  /* ============ 1.6 Knapsack ขยาย ============ */
  L.knapx = () => {
    const W = [2, 3], V = [10, 20], cap = 6, F = unbounded(W, V, cap);
    const S = [3, 34, 4, 12, 5, 2], T = 9, st = subsetTable(S, T);
    const sub = st.map((row, i) => row.map((x, j) => ({ t: x ? 'T' : 'F', c: x ? 'pick' : '' })));
    const nums = [1, 5, 11, 5], tot = nums.reduce((a, b) => a + b, 0), half = tot / 2;
    let reach = new Set([0]); const steps = [`เริ่ม: {0}`];
    nums.forEach((x) => { const nx = new Set(reach); reach.forEach((r) => { if (r + x <= half) nx.add(r + x); }); reach = nx; steps.push(`เพิ่ม ${x}: {${[...reach].sort((a, b) => a - b).join(', ')}}`); });
    return `<div class="ap-learn">
    <p class="ap-lede">ทั้งหมดนี้คือ "ตระกูล Knapsack": ตารางเดียวกับบท ${U.link('knap', '1.5')} แต่เปลี่ยนเงื่อนไขว่าหยิบซ้ำได้ไหม หรือถามแค่ว่า "ทำได้ / ทำไม่ได้" — ต้นฉบับใน dp-week8 ไม่มีหน้าสอนของบทนี้ จึงเขียนเพิ่มโดยอิงข้อ 8–10 ของ DP Lab</p>
    ${U.sec('เปรียบเทียบ 4 แบบให้เห็นความต่าง', U.table(['ปัญหา', 'สถานะ', 'Recurrence', 'เวลา / พื้นที่'], [
      ['0/1 Knapsack (บท 1.5)', 'F(i, j)', 'max{F(i−1, j), vᵢ + F(i−1, j−wᵢ)}', 'Θ(nW) / Θ(nW)'],
      ['Unbounded Knapsack (ข้อ 8)', 'F(j)', 'max{F(j−wᵢ) + vᵢ} ทุก i ที่ wᵢ ≤ j', 'Θ(nW) / Θ(W)'],
      ['Subset Sum (ข้อ 9)', 'F(i, j) จริง/เท็จ', 'F(i−1, j) ∨ F(i−1, j−sᵢ)', 'Θ(nT) / Θ(nT)'],
      ['Partition (ข้อ 10)', '= Subset Sum', 'T = sum/2 (sum ต้องเป็นเลขคู่)', 'Θ(n·sum/2)'],
    ]), 1)}
    ${U.sec('Unbounded Knapsack: หยิบชนิดเดิมซ้ำได้', `<p>ตัวอย่าง (ข้อ 8): น้ำหนัก <code>w = [2, 3]</code> มูลค่า <code>v = [10, 20]</code> ถุงจุ <code>${cap}</code></p>
      ${U.rec('F(j) = max<sub>i : wᵢ ≤ j</sub> { F(j − wᵢ) + vᵢ } · F(0) = 0')}
      ${U.dpt('j', [0, 1, 2, 3, 4, 5, 6], ['F(j)'], [F.map((x, j) => ({ t: x, c: j === cap ? 'pick' : '' }))])}
      <p>อ่านตาราง: F(6) = F(3) + 20 = 40 คือหยิบชิ้นน้ำหนัก 3 สองชิ้น (ได้ 40) ดีกว่าหยิบชิ้นน้ำหนัก 2 สามชิ้น (ได้ 30) เพราะ <b>หยิบชนิดเดิมซ้ำได้</b> จึงไม่ต้องจำว่า "ใช้ชนิดไหนไปแล้ว" — ลดจากตาราง 2 มิติเหลือแถวเดียว</p>
      ${U.note('ต่างจาก 0/1 อย่างไร', '<p>0/1 ต้องดูแถว <b>i−1</b> (ชิ้น i ใช้ได้ครั้งเดียว) แต่ Unbounded ดูช่องเดิมที่คำนวณแล้ว (<code>F(j−wᵢ)</code>) ซึ่งอาจรวมชิ้น i อยู่แล้ว. ถ้าใช้อาร์เรย์ 1 มิติกับ 0/1 ต้องวน j จาก <b>มากไปน้อย</b>; ถ้าวนจากน้อยไปมากจะกลายเป็น Unbounded โดยไม่รู้ตัว</p>')}`, 2)}
    ${U.sec('Subset Sum: มีเซตย่อยที่รวมได้ target ไหม', `<p>ตัวอย่าง (ข้อ 9): <code>S = [${S.join(', ')}]</code> target = <code>${T}</code></p>
      ${U.rec('F(i, j) = F(i−1, j) ∨ F(i−1, j − sᵢ) (ตัวหลังใช้เมื่อ j ≥ sᵢ) · F(i, 0) = จริง')}
      ${U.dpt('i \\ j', Array.from({ length: T + 1 }, (_, j) => j), ['∅', ...S.map((s, i) => `เพิ่ม ${s}`)], sub)}
      <p>คำตอบคือช่องสุดท้ายของคอลัมน์ ${T}: <b>${st[S.length][T] ? 'จริง (มีเซตย่อยที่รวมได้ ' + T + ', เช่น 4 + 5)' : 'เท็จ'}</b>. ตารางเป็นแบบ boolean จึงใช้ ∨ แทน max</p>`, 3)}
    ${U.sec('Partition Equal Subset Sum: แบ่งสองส่วนเท่ากัน', `<p>ตัวอย่าง (ข้อ 10): <code>nums = [${nums.join(', ')}]</code> ผลรวม = ${tot} → ต้องหา subset ที่รวมได้ <b>${half}</b></p>
      <ol><li>ถ้า sum เป็นเลขคี่ → ตอบเท็จทันที (แบ่งครึ่งเป็นจำนวนเต็มไม่ได้)</li><li>ไม่เช่นนั้นถาม Subset Sum ด้วย target = sum/2</li></ol>
      <p>ผลรวมที่ทำได้หลังใส่ทีละตัว (ตัดที่ ≤ ${half}):</p><div class="ap-rec">${steps.join('<br>')}</div>
      <p>${reach.has(half) ? `มี ${half} อยู่ในเซต → <b>แบ่งได้</b> (เช่น {11} กับ {1, 5, 5})` : 'ไม่มี → แบ่งไม่ได้'}</p>`, 4)}
    ${U.sec('ทำไม Θ(nT) ยังไม่ใช่ polynomial จริง (pseudo-polynomial)', `<p>เวลา Θ(n·T) ขึ้นกับ <b>ค่า</b> ของ T ไม่ใช่ <b>จำนวนบิต</b> ที่ใช้เขียน T. ถ้า T มี k บิต ค่าของ T ได้ถึง 2<sup>k</sup> เวลาจึงเป็นเลขชี้กำลังเมื่อเทียบกับขนาดอินพุต — Subset Sum และ Knapsack จึงเป็น NP-complete แต่ยังแก้ได้เร็วเมื่อ T หรือ W ไม่ใหญ่ (ดูต่อที่ ${U.link('pnp', '3.2 P vs NP')})</p>`, 5)}
    ${U.exam(['เขียน recurrence ของ Unbounded และบอกว่าต่างจาก 0/1 ที่ "ดูแถว i−1 หรือช่องเดิม"', 'Subset Sum ใช้ ∨ ไม่ใช่ max และเริ่มด้วย F(i,0) = จริง', 'Partition: sum เป็นเลขคี่ตอบเท็จ ไม่ต้องคำนวณต่อ', 'เหตุผลที่ Θ(nT) เรียกว่า pseudo-polynomial'])}
    </div>`;
  };

  /* ============ 1.10 Matrix Chain + LCS ============ */
  L.lcsmcm = () => {
    const p = [10, 20, 30, 40], M = mcm(p), n = M.n;
    const mrows = [], mcols = [];
    for (let j = 1; j <= n; j++) mcols.push('A' + j);
    for (let i = 1; i <= n; i++) mrows.push('A' + i);
    const mcells = mrows.map((_, i) => mcols.map((_, j) => (j < i ? '' : j === i ? '0' : { t: M.m[i + 1][j + 1].toLocaleString('en-US'), c: i === 0 && j === n - 1 ? 'pick' : '' })));
    const X = 'ABCBDAB', Y = 'BDCABA', R = lcsTable(X, Y);
    const lcells = R.L.map((row, i) => row.map((v, j) => ({ t: v, c: R.path.has(i + ',' + j) ? 'pick' : '' })));
    return `<div class="ap-learn">
    <p class="ap-lede">ปัญหา DP ที่มักออกสอบคู่กัน: แบ่งช่วง (Matrix Chain) และเทียบสองสายอักขระ (LCS) — ต้นฉบับมีแค่แบบฝึกข้อ 14–15 ใน DP Lab หน้านี้เพิ่มส่วนอธิบาย</p>
    ${U.sec('Matrix Chain Multiplication', `<p>จะคูณ A₁ × A₂ × … × Aₙ ให้ใช้ <b>จำนวนการคูณสเกลาร์น้อยที่สุด</b> ผลลัพธ์เหมือนกันไม่ว่าจัดวงเล็บแบบใด แต่ต้นทุนต่างกันมาก. เมทริกซ์ Aᵢ มีขนาด pᵢ₋₁ × pᵢ คูณ (a×b)(b×c) ใช้ a·b·c ครั้ง</p>
      <p>ตัวอย่าง (ข้อ 14): p = [${p.join(', ')}] คือ A₁ 10×20, A₂ 20×30, A₃ 30×40</p>
      ${U.table(['วงเล็บ', 'การคูณ', 'รวม'], [['(A₁A₂)A₃', '10·20·30 + 10·30·40', (10 * 20 * 30 + 10 * 30 * 40).toLocaleString('en-US')], ['A₁(A₂A₃)', '20·30·40 + 10·20·40', (20 * 30 * 40 + 10 * 20 * 40).toLocaleString('en-US')]])}
      ${U.rec('m[i][j] = min<sub>i ≤ k &lt; j</sub> { m[i][k] + m[k+1][j] + p<sub>i−1</sub>·p<sub>k</sub>·p<sub>j</sub> } · m[i][i] = 0')}
      <p>เติมตามความยาวห่วงโซ่ l = 2, 3, … (แนวทแยงขนานเส้นหลัก) คำตอบคือ m[1][n]</p>
      ${U.dpt('m[i][j]', mcols, mrows, mcells)}
      <p>ผลลัพธ์ m[1][${n}] = <b>${M.m[1][n].toLocaleString('en-US')}</b> ด้วยวงเล็บ <b>${paren(M.s, 1, n)}</b> (เก็บจุดตัด k ไว้ในตาราง s เพื่อย้อนรอย)</p>
      <p>ความซับซ้อน: Θ(n²) ช่อง × ลอง k ได้ถึง n ค่า = <b>Θ(n³)</b> เวลา, <b>Θ(n²)</b> พื้นที่. จำนวนวิธีวงเล็บทั้งหมดเป็นเลข Catalan (โตแบบเลขชี้กำลัง) จึงลองทุกแบบไม่ไหว</p>
      ${U.note('เชื่อมกับ Optimal BST', `โครงเดียวกับ ${U.link('obst', '1.7')} คือ "ลองทุกจุดตัด/ราก k แล้วบวกต้นทุนซ้าย + ขวา + ต้นทุนรวมช่วง" เติมตามความยาวช่วงเหมือนกัน`)}`, 1)}
    ${U.sec('Longest Common Subsequence (LCS)', `<p>หาลำดับย่อยร่วมที่ยาวที่สุดของ X และ Y — ตัวอักษรต้อง <b>เรียงตามลำดับเดิมแต่ไม่ต้องติดกัน</b>. ตัวอย่าง (ข้อ 15): X = <code>${X}</code>, Y = <code>${Y}</code></p>
      ${U.rec('L[i][j] = L[i−1][j−1] + 1 ถ้า Xᵢ = Yⱼ<br>L[i][j] = max(L[i−1][j], L[i][j−1]) ถ้า Xᵢ ≠ Yⱼ · L[0][j] = L[i][0] = 0')}
      ${U.dpt('X \\ Y', ['∅', ...Y.split('')], ['∅', ...X.split('')], lcells)}
      <p>L[${X.length}][${Y.length}] = <b>${R.L[X.length][Y.length]}</b> ย้อนรอยจากมุมขวาล่าง (ช่องที่ไฮไลต์: เมื่อตัวอักษรตรงกันไปทางเฉียง ไม่ตรงไปทางที่ค่ามากกว่า) ได้ตัวอย่างหนึ่งคำตอบคือ <b>${R.s}</b> (LCS มีได้หลายคำตอบ ความยาวเท่ากัน)</p>
      <p>ความซับซ้อน: <b>Θ(m·n)</b> เวลาและพื้นที่ (ลดเหลือ Θ(min(m, n)) ได้ถ้าต้องการแค่ความยาว)</p>
      ${U.note('ระวังสับสน', 'Longest Common <b>Subsequence</b> ไม่ต้องติดกัน ส่วน Longest Common <b>Substring</b> ต้องติดกัน (สูตรต่างกัน: ถ้าไม่ตรงให้ใส่ 0)', 'warn')}`, 2)}
    ${U.exam(['ระบุ pᵢ₋₁·pₖ·pⱼ ให้ถูก (ดัชนีสลับง่าย) และเติมตามความยาวห่วงโซ่', 'LCS: กรณีตรงกันใช้เส้นทแยง +1, ไม่ตรงใช้ max ของบนกับซ้าย', 'เวลา MCM Θ(n³) แต่ LCS Θ(mn)'])}
    </div>`;
  };

  /* ============ 2.0 หลักการ Greedy ============ */
  L.gprin = () => `<div class="ap-learn">
    <p class="ap-lede">Greedy (โลภ) คือกลยุทธ์ "เลือกตัวเลือกที่ดีที่สุดในตอนนั้นทันที โดยไม่ย้อนกลับมาแก้" หวังว่า local optimum ทีละจุดจะรวมกันเป็น global optimum — สรุปจาก notebook ภาค 1 และสไลด์ Week 9</p>
    ${U.sec('อัลกอริทึม Greedy ทำงาน 4 ขั้น', `<div class="ap-steps4"><div><b>1</b>เรียง / จัดลำดับตาม "เกณฑ์" เช่น เวลาจบ, ค่าต่อหน่วย, ตัวเล็กสุด</div><div><b>2</b>เลือกตัวแรกสุดที่ยังใช้ได้ (feasible)</div><div><b>3</b>ตัดสินใจแล้ว <u>ไม่ย้อน</u> อัปเดตสถานะ</div><div><b>4</b>ทำซ้ำจนหมดตัวเลือก</div></div>`, 1)}
    ${U.sec('เมื่อไหร่ Greedy ถึงถูกต้อง: 2 คุณสมบัติ', U.table(['คุณสมบัติ', 'ความหมาย', 'ตัวอย่าง'], [
      ['Greedy-choice property', 'มีคำตอบที่ดีที่สุดอย่างน้อยหนึ่งคำตอบที่ <i>เริ่มด้วยการเลือกแบบ greedy</i>', 'Activity Selection: เลือกงานที่จบเร็วสุดก่อนไม่เสียโอกาส'],
      ['Optimal substructure', 'หลังเลือกแล้วเหลือ "ปัญหาเดิมที่เล็กลง" และคำตอบย่อยที่ดีที่สุดรวมกับที่เลือก = ดีที่สุดรวม', 'หลังเลือกงานแรก เหลือเลือกงานที่เริ่มหลังเวลานั้น'],
    ]) + `<h3 class="ap-h3" style="margin-top:16px">เทคนิคพิสูจน์: Exchange Argument</h3><ol><li>สมมติมีคำตอบดีที่สุด OPT ที่ไม่ได้เลือกแบบ greedy</li><li>นำตัวเลือกแรกของ OPT มา <b>สลับ</b> กับตัวเลือกของ greedy</li><li>แสดงว่าคำตอบหลังสลับ <b>ไม่แย่ลง</b> และยังใช้ได้ → greedy ก็ดีที่สุดเช่นกัน</li></ol>`, 2)}
    ${U.sec('Greedy ไม่ได้ถูกต้องเสมอไป', `<div class="ap-grid">
      <div class="ap-card"><h3 class="ap-h3">ทอนเหรียญ {1, 3, 4} ยอด 6</h3><p>Greedy: 4 + 1 + 1 = <b>3 เหรียญ</b><br>ที่ดีที่สุด: 3 + 3 = <b>2 เหรียญ</b> → Greedy ผิด ต้องใช้ DP (บท ${U.link('change', '1.2')})</p></div>
      <div class="ap-card"><h3 class="ap-h3">Knapsack 0/1 (W = 50)</h3><p>ของ (มูลค่า, น้ำหนัก): (60,10) (100,20) (120,30). เรียงตามค่า/น้ำหนัก ได้ 60 + 100 = <b>160</b> แต่ที่ดีที่สุดคือ 100 + 120 = <b>220</b>. ถ้า <u>แบ่งของได้</u> Greedy ได้ 240 และดีที่สุดจริง</p></div>

        ['นับทรัพยากรที่ใช้พร้อมกัน', 'เรียงเหตุการณ์แยกกัน + two pointers'], ['รวม/ต่อของโดยต้นทุนขึ้นกับผลรวม', '<b>Min-Heap</b> รวมตัวเล็กสุดก่อน'],
        ['เลือกของที่แบ่งได้', 'เรียงตาม <b>value/weight</b>'], ['มีเดดไลน์ + กำไร', 'เรียงตามกำไร + วางช่อง <b>ท้ายสุดที่ทัน</b>'],

  /* ============ 2.1 ทอนเหรียญ ============ */

      ['หลักคิด', 'ใช้เหรียญใหญ่สุดที่ไม่เกินยอดคงเหลือ ซ้ำจนครบ', 'F(n) = min{F(n − dⱼ)} + 1 เติมตารางตั้งแต่ 0 ถึง n'],
      ['เวลา', 'O(k) หลังเรียงเหรียญ (k = จำนวนชนิด)', 'Θ(n·k)'], ['ถูกต้องเมื่อไหร่', 'เฉพาะระบบเหรียญที่ Greedy ให้ optimal (canonical)', 'ทุกชุดเหรียญ (ที่มีเหรียญ 1 หรือทอนได้)'],

      ['{1, 2, 5, 10}', '28', '10 + 10 + 5 + 2 + 1 = 5 เหรียญ', '5 เหรียญ (เท่ากัน ✓)'], ['{1, 3, 4}', '6', '4 + 1 + 1 = 3 เหรียญ', '3 + 3 = 2 เหรียญ (Greedy พลาด ✗)'],

    ${U.extra('<p><b>ตรวจว่า Greedy ใช้ได้ไหม:</b> ลองเทียบ Greedy กับ DP ทุกยอดจนถึงเหรียญใหญ่สุด + เหรียญรองใหญ่สุด (มีทฤษฎีบทว่าพอ) หรือลองเล่นเกม "Greedy ได้ optimal ไหม?" ที่แท็บเกม เพื่อฝึกจับ counter-example. ระบบเหรียญที่ Greedy ใช้ได้เรียกว่า <i>canonical coin system</i></p>')}

  /* ============ 2.2 Prim / MST ============ */
  L.prim = () => `<div class="ap-learn">
    ${U.sec('Spanning tree และ Minimum spanning tree', `<div class="ap-grid"><div class="ap-card"><b>spanning tree</b><p>sub graph ที่ไม่มีวงจร (acyclic) และเชื่อมทุกโหนดของกราฟไว้ด้วยกัน</p></div><div class="ap-card"><b>minimum spanning tree (MST)</b><p>spanning tree ที่มี weight รวมน้อยที่สุด</p></div></div>
      <div class="m-gr"><div class="def-grid" data-defs></div></div><p class="ap-small ap-muted">กราฟตั้งต้น 4 โหนดมี spanning tree หลายต้น (น้ำหนัก 6, 8, 9) — ต้นที่เบาที่สุดคือ MST. กราฟที่มี |V| โหนด MST มี <b>|V| − 1</b> เส้นเสมอ</p>`, 1)}
    ${U.sec('Prim: ขยายต้นไม้จากโหนดเดียวทีละโหนด', `${U.rec('VT ← {v₀}; ET ← ∅<br>for i ← 1 to |V| − 1 do<br>&nbsp;&nbsp;หาเส้น e* = (v*, u*) น้ำหนักน้อยสุด โดย v* ∈ VT และ u* ∈ V − VT<br>&nbsp;&nbsp;VT ← VT ∪ {u*}; ET ← ET ∪ {e*}<br>return ET')}
      <ul><li>ทุกรอบเลือกเส้นที่เบาที่สุดที่ <b>ข้ามจากต้นไม้ไปโหนดนอกต้นไม้</b></li><li>ระหว่างทำงานเป็นต้นไม้ต้นเดียวที่ต่อกันเสมอ</li><li>ทำไมถูก: เส้นเบาสุดที่ข้ามรอยตัด (cut) ใด ๆ อยู่ใน MST บางต้นเสมอ (ทำ exchange argument ได้)</li></ul>
      ${U.cx([['ใช้ weight matrix + array ธรรมดา', 'Θ(|V|²)', 'Θ(|V|²)'], ['ใช้ adjacency list + min-heap', 'O(|E| log |V|)', 'Θ(|V| + |E|)']])}`, 2)}
    ${U.note('ค่าที่เก็บในตาราง', 'Prim เก็บ <b>น้ำหนักของเส้นเดียว</b> ที่ดีที่สุดเข้าโหนดนั้น (ตาราง v(p, w)); Dijkstra เก็บ <b>ระยะสะสม</b> จากต้นทาง — สับสนสองอย่างนี้บ่อย ดูตารางเปรียบเทียบที่บท 2.4', 'warn')}
    ${U.exam(['เขียนลำดับโหนด/เส้นที่ Prim เลือกทีละรอบบนกราฟที่กำหนด (เริ่มที่ a)', 'น้ำหนักรวมของ MST และจำนวนเส้น |V| − 1', 'ความซับซ้อนแบบ heap: O(|E| log |V|)'])}
  </div>`;

  /* ============ 2.3 Kruskal ============ */
  L.kruskal = () => `<div class="ap-learn">
    ${U.sec('Kruskal: เรียงเส้นแล้วรับทีละเส้นถ้าไม่เกิดวงจร', `${U.rec('เรียงเส้นตามน้ำหนัก (น้อย → มาก) · ET ← ∅ · ecounter ← 0<br>for แต่ละเส้น (u, v) ตามลำดับ do<br>&nbsp;&nbsp;if ET ∪ {(u, v)} ไม่เกิดวงจร then ET ← ET ∪ {(u, v)}; ecounter ← ecounter + 1<br>&nbsp;&nbsp;if ecounter = |V| − 1 then หยุด')}
      <ul><li>ระหว่างทำงานเป็น <b>ป่า</b> (หลายต้น) แล้วค่อยรวมเป็นต้นเดียว ต่างจาก Prim</li><li>ตรวจวงจรด้วย <b>Union-Find</b>: ถ้า u กับ v อยู่กลุ่มเดียวกันอยู่แล้ว รับเส้นนี้จะเกิดวงจร → ปฏิเสธ; ไม่เช่นนั้นรับและรวมสองกลุ่ม</li><li>เส้นที่น้ำหนักเท่ากันเลือกลำดับใดก็ได้ MST อาจต่างกันแต่น้ำหนักรวมเท่ากัน</li></ul>
      ${U.cx([['เรียงเส้น + Union-Find', 'O(|E| log |E|) = O(|E| log |V|)', 'Θ(|V| + |E|)']])}`, 1)}
    ${U.extra('<p><b>เลือก Prim หรือ Kruskal:</b> กราฟหนาแน่น (|E| ≈ |V|²) Prim แบบ array Θ(|V|²) มักเหมาะ ส่วนกราฟบาง Kruskal ตรงไปตรงมาเพราะเรียงเส้นครั้งเดียว. ทั้งสองให้น้ำหนัก MST เท่ากัน</p>')}
    ${U.exam(['ไล่ sorted list ของเส้นและบอกว่าเส้นไหนถูกปฏิเสธเพราะวงจร', 'Kruskal ใช้ Union-Find; Prim ใช้ priority queue', 'ทำไมหยุดเมื่อ ecounter = |V| − 1'])}
  </div>`;

  /* ============ 2.4 Dijkstra ============ */
  L.dijkstra = () => `<div class="ap-learn">
    ${U.sec('Dijkstra: เส้นทางสั้นที่สุดจากต้นทางเดียว', `${U.rec('d[s] ← 0; d[v] ← ∞ ทุกโหนดอื่น; Q ← ทุกโหนด; VT ← ∅<br>while Q ไม่ว่าง do<br>&nbsp;&nbsp;u ← DeleteMin(Q) (โหนดที่ d น้อยสุด) → ย้ายเข้า VT<br>&nbsp;&nbsp;for แต่ละเพื่อนบ้าน v ของ u ที่ยังอยู่ใน Q: if d[u] + w(u,v) &lt; d[v] then d[v] ← d[u] + w(u,v); p[v] ← u')}
      <ul><li>เมื่อโหนดเข้า VT แล้ว ค่า d ถือว่า <b>สุดท้าย</b> (Greedy: ไม่ย้อนแก้)</li><li>ใช้ได้เมื่อ <b>ไม่มีเส้นน้ำหนักติดลบ</b> — ถ้ามี ค่า d ที่ถือว่าสุดท้ายแล้วอาจต้องแก้ทีหลัง</li><li>ผลคือ shortest-path tree จากต้นทาง อ่านเส้นทางย้อนด้วย p[·]</li></ul>
      ${U.cx([['weight matrix + unordered array', 'Θ(|V|²)', 'Θ(|V|²)'], ['adjacency list + min-heap', 'O(|E| log |V|)', 'Θ(|V| + |E|)']])}`, 1)}
    ${U.sec('เทียบ Prim / Kruskal / Dijkstra', AP.gr.SUMMARY.match(/<div class="table-scroll">[\s\S]*?<\/table><\/div>/)[0].replace('table-scroll', 'ap-tscroll').replace('class="cmp"', 'class="ap-t"'), 2)}
    ${U.sec('Floyd vs Dijkstra (ข้อ 20 ของ DP Lab)', `<p>ทุกคู่โหนด: Floyd รันครั้งเดียว Θ(V³) เทียบกับ Dijkstra ซ้ำ V ครั้ง — กราฟหนาแน่น (E ≈ V²) ทั้งสองเป็น V³ (Dijkstra แบบ array) ส่วนกราฟบาง Dijkstra + heap เร็วกว่ามาก แต่ Floyd ทนน้ำหนักติดลบ (ห้ามมีวงจรลบ) และโค้ดสั้น — ดูแบบฝึกที่แท็บ "แบบฝึก"</p>`, 3)}
    ${U.exam(['เขียนตาราง d และโหนดถัดไปที่ถูกเลือกในแต่ละรอบ', 'ข้อใดทำให้ Dijkstra ใช้ไม่ได้: น้ำหนักติดลบ (ไม่ใช่วงจร)', 'ต่างจาก Prim: ระยะสะสมจากต้นทาง vs น้ำหนักเส้นเดียว'])}
  </div>`;

  /* ============ 2.5 Huffman ============ */
  L.huffman = () => `<div class="ap-learn">
    ${U.sec('Huffman coding: รหัสความยาวแปรผันแบบ prefix-free', `<p>ให้ตัวอักษรที่ถี่ได้รหัสสั้น ตัวที่ไม่ถี่ได้รหัสยาว โดยไม่มีรหัสใดเป็น <b>prefix</b> ของรหัสอื่น จึงถอดรหัสได้ไม่กำกวม</p>
      ${U.rec('ใส่ตัวอักษรแต่ละตัวเป็นต้นไม้โหนดเดียว (น้ำหนัก = ความถี่) ลง priority queue<br>repeat: ดึง 2 ต้นที่น้ำหนักน้อยสุด → ต่อเป็นลูกซ้าย/ขวาของโหนดใหม่ น้ำหนัก = ผลรวม → ใส่กลับ<br>until เหลือต้นเดียว · อ่านรหัส: เดินจากรากลงใบ ซ้าย = 0, ขวา = 1')}
      <p>ตัวอย่างสไลด์: A 0.35, B 0.1, C 0.2, D 0.2, _ 0.15 → A = 11, B = 100, C = 00, D = 01, _ = 101</p>`, 1)}
    ${U.sec('คำนวณ', `<ul><li>จำนวนบิตเฉลี่ยต่อตัวอักษร = Σ (ความยาวรหัส × ความถี่) = 2·0.35 + 3·0.1 + 2·0.2 + 2·0.2 + 3·0.15 = <b>2.25</b></li><li>รหัสความยาวคงที่ของ 5 ตัวอักษรต้องใช้ 3 บิต → บีบอัดได้ (3 − 2.25)/3 = <b>25%</b></li><li>ถอดรหัส <code>011101</code> = 01 | 11 | 01 = <b>DAD</b> (อ่านบิตทีละตัวจนถึงใบ แล้วกลับไปที่ราก)</li></ul>${U.cx([['ใช้ min-heap (n ตัวอักษร)', 'O(n log n)', 'Θ(n)']])}`, 2)}
    ${U.extra('<p><b>เชื่อมกับโจทย์ต่อเชือก (ข้อ 8):</b> ต้นทุนรวมของการรวมทุกครั้ง = Σ (ความถี่ × ความลึก) เท่ากับจำนวนบิตรวมของข้อความที่เข้ารหัส เหตุผลเดียวกับที่ต้องรวมตัวเล็กสุดก่อน (ตัวเล็กควรลึก). ถ้ามีความถี่เท่ากันหลายตัว ต้นไม้/รหัสอาจต่างกันได้แต่ความยาวเฉลี่ยเท่ากัน</p>')}
    ${U.exam(['สร้างต้น Huffman จากตารางความถี่และอ่านรหัสของแต่ละตัว', 'คำนวณจำนวนบิตเฉลี่ยและเปอร์เซ็นต์การบีบอัด', 'ถอดรหัสสายบิตที่ให้มา'])}
  </div>`;

    ${U.sec('แผนที่รูปแบบ Greedy ของ 12 ข้อ', U.table(['ข้อ', 'ปัญหา', 'กลยุทธ์ Greedy', 'เกณฑ์เรียง', 'เวลา'], AP.LABGREEDY.map((p) => {

(function () {

  let steps=[],i=0,timer=null;const stage=$('.stage',root),msg=$('.msg',root),cnt=$('.cnt',root),play=$('[data-a=play]',root);
  function draw(){const s=steps[i];stage.innerHTML='';render(stage,s,i);msg.innerHTML=s.msg||'';cnt.textContent=`ขั้นที่ ${i+1}/${steps.length}`;
    if(i===steps.length-1){stop();}}
  function stop(){clearInterval(timer);timer=null;play.textContent='⏵ อัตโนมัติ'}
  root.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==='next'){if(i<steps.length-1){i++;draw()}}
    else if(a==='prev'){if(i>0){i--;draw()}}
    else if(a==='reset'){stop();i=0;draw()}
    else if(a==='play'){if(timer){stop();return}if(i>=steps.length-1)i=0;draw();play.textContent='⏸ หยุด';timer=setInterval(()=>{if(i<steps.length-1){i++;draw()}else stop()},1100)}});
  const api={set(s){stop();steps=s;i=0;draw()},stop};ACTIVE.push(api);return api;
}

DEMOS.dist=function(host){
 const root=host;
 root.innerHTML='<div class="inp"><label>ชุดตัวเลข (ช่วงแคบๆ, ซ้ำได้)</label><input type="text" id="disin" value="13,11,12,13,12,12" size="24"><button class="b" id="disgo">ใช้ชุดนี้</button></div><div id="disst"></div>';
 const S=Stepper($('#disst'),(st,s)=>{
   st.innerHTML='<div class="lab">A</div>'+cells(s.A,(k)=>k===s.ai?'i':'')+
   `<div class="lab">D[] (ค่า ${s.l}..${s.u})</div>`+`<div class="row">${s.D.map((v,k)=>`<div class="cellw"><div class="cell ${k===s.dj?'j pop':''}">${v}</div><div class="idx">${s.l+k}</div></div>`).join('')}</div>`+
   '<div class="lab">S</div>'+cells(s.S,(k)=>s.S[k]===null?'empty':k===s.ps?'ok pop':'ok');
 },'dist');
 function gen(A){const n=A.length,l=Math.min(...A),u=Math.max(...A),D=Array(u-l+1).fill(0),st=[],S=Array(n).fill(null);
  const push=(o,m)=>st.push({A,l,u,D:[...D],S:[...S],msg:m,...o});
  push({},`เริ่มต้น D[] = 0 ทุกช่อง (ช่วง ${l}..${u})`);
  for(let i=0;i<n;i++){D[A[i]-l]++;push({ai:i,dj:A[i]-l},`<b>① นับความถี่:</b> เจอ ${A[i]} → D[${A[i]}−${l}]++ เป็น ${D[A[i]-l]}`)}
  for(let j=1;j<D.length;j++){D[j]+=D[j-1];push({dj:j},`<b>② สะสม:</b> D[${j}] ← D[${j-1}] + D[${j}] = ${D[j]} (ค่า ${l+j} เรียงจบที่ตำแหน่ง ${D[j]})`)}
  for(let i=n-1;i>=0;i--){const j=A[i]-l,p=D[j]-1;S[p]=A[i];D[j]--;push({ai:i,dj:j,ps:p},`<b>③ วางจากขวา:</b> A[${i}]=${A[i]} → S[D[${j}]−1] = S[${p}] ← ${A[i]}, แล้ว D[${j}]−− เป็น ${D[j]}`)}
  st[st.length-1].msg+=' 🎉 เสร็จ! เวลา Θ(n) แต่ต้องใช้พื้นที่เพิ่ม';return st}
 const go=()=>{let A=$('#disin').value.split(',').map(x=>parseInt(x)).filter(x=>!isNaN(x)).slice(0,12);if(A.length<2||Math.max(...A)-Math.min(...A)>15){toast('ใส่เลข 2-12 ตัว ช่วงห่างไม่เกิน 15');return}S.set(gen(A))};
 $('#disgo').onclick=go;go();
};
/* ---------- 3/4 Horspool & Boyer-Moore ---------- */
function shiftTable(P){const m=P.length,t={};for(let j=0;j<m-1;j++)t[P[j]]=m-1-j;return t}
function goodSuffix(P){const m=P.length,d2=[];for(let k=1;k<m;k++){for(let d=1;d<=m;d++){let ok=true;for(let j=0;j<k;j++){const x=m-1-j-d;if(x>=0&&P[x]!==P[m-1-j]){ok=false;break}}
  if(ok){const b=m-k-1-d;if(b>=0&&P[b]===P[m-1-k])ok=false}if(ok){d2[k]=d;break}}}return d2}
function strSteps(T,P,bm){const n=T.length,m=P.length,t=shiftTable(P),d2=goodSuffix(P),st=[];let i=m-1;
 st.push({T,P,off:0,i:null,k:0,msg:`เริ่มวาง pattern ชิดซ้ายของข้อความ (m = ${m}) แล้วเทียบจาก<b>ตัวท้าย</b>ย้อนมาทางซ้าย`});
 while(i<=n-1){let k=0;while(k<m&&P[m-1-k]===T[i-k])k++;const off=i-m+1;
  if(k===m){st.push({T,P,off,i,k,found:1,msg:`✅ ตรงทั้ง ${m} ตัว! พบ pattern ที่ตำแหน่ง ${off}`});return st}
  const c=T[i-k];let d,ex;
  if(!bm){d=t[T[i]]||m;ex=`Horspool: ตัวในข้อความใต้ท้าย pattern = "<b>${T[i]}</b>" → Table = <b>${d}</b> → เลื่อน ${d}${t[T[i]]?'':' (ไม่อยู่ใน pattern → เลื่อนทั้ง pattern)'}`}
  else{const t1=t[c]||m,d1=Math.max(t1-k,1);if(k===0){d=d1;ex=`k=0, c="<b>${c}</b>", t₁(c)=${t1} → d = d₁ = max{${t1}−0,1} = <b>${d}</b>`}else{d=Math.max(d1,d2[k]);ex=`k=${k}, c="<b>${c}</b>", t₁(c)=${t1} → d₁=max{${t1}−${k},1}=${d1}; d₂[${k}]=${d2[k]} → d = max{${d1},${d2[k]}} = <b>${d}</b>`}}
  st.push({T,P,off,i,k,mis:i-k,d,msg:`ตรง ${k} ตัว แล้ว "${c}"≠"${P[m-1-k]}" ✗ &nbsp;→&nbsp; ${ex}`});i+=d}
 st.push({T,P,off:null,msg:'❌ เลื่อนจนสุดข้อความ ไม่พบ pattern'});return st}
function renderStr(stage,s){const{T,P,off}=s;
 const tc=[...T].map((ch,x)=>{let c='';if(off!==null&&x>=off&&x<off+P.length)c='win';if(s.i!=null&&x>s.i-s.k&&x<=s.i)c='ok';if(s.mis===x)c='bad';if(s.found&&x>=off&&x<off+P.length)c='ok';return`<div class="cellw"><div class="cell sm ${c}">${ch}</div><div class="idx">${x}</div></div>`}).join('');
 const pc=off===null?'':`<div class="row" style="padding-left:${Math.max(off,0)*32}px">${[...P].map((ch,x)=>{const fromR=P.length-1-x;let c='pat';if(s.i!=null&&fromR<s.k)c='ok';if(s.mis!=null&&fromR===s.k)c='bad';if(s.found)c='ok';return`<div class="cell sm ${c}">${ch}</div>`}).join('')}</div>`;
 stage.innerHTML=`<div class="scr" style="scroll-behavior:smooth"><div class="row" style="gap:4px;flex-wrap:nowrap">${tc}</div>${pc}</div>`;
 const sc=stage.firstChild;if(off!==null)sc.scrollLeft=Math.max(0,off*32-120);}
function tablesHTML(P,bm){const m=P.length,t=shiftTable(P),ks=[...new Set([...P])];
 let h=`<div class="chips"><span class="chip">Shift Table:</span>${ks.map(c=>`<span class="chip">${c} = <b>${t[c]||m}</b></span>`).join('')}<span class="chip">อื่นๆ = <b>${m}</b></span></div>`;
 if(bm){const d2=goodSuffix(P);h+=`<div class="chips"><span class="chip">Good-suffix d₂:</span>${d2.slice(1).map((v,k)=>`<span class="chip">k=${k+1} → <b>${v}</b></span>`).join('')}</div>`}return h}
function strDemo(root,pid,bm,T0,P0){

DEMOS.hash=function(host){
 const K=[['A',1],['FOOL',9],['AND',6],['HIS',10],['MONEY',7],['ARE',11],['SOON',11],['PARTED',12]],M=13;
 const root=host;
 root.innerHTML=`<div class="inp"><div class="seg" id="hseg"><button data-m="open" class="on">Open (Chaining)</button><button data-m="closed">Closed (Probing)</button></div></div><div class="chips">${K.map(([k,h])=>`<span class="chip">${k} → <b>${h}</b></span>`).join('')}</div><div id="hst"></div>`;
 const S=Stepper($('#hst'),(st,s)=>{
   st.innerHTML=`<div class="scr"><div class="hash">${s.T.map((v,k)=>`<div class="hcol"><div class="idx" style="font-size:12px">${k}</div>${
     s.mode==='open'?(v.length?v.map((x,q)=>`<div class="cell ${k===s.hl&&q===v.length-1?(v.length>1?'bad pop':'ok pop'):'ok'}">${x}</div>`).join(''):'<div class="cell empty"></div>'):
     `<div class="cell ${v===null?'empty':(k===s.hl?(s.coll?'bad pop':'ok pop'):'ok')}">${v||''}</div>`}</div>`).join('')}</div></div>`;
 },'hash');
 let mode='open';
 function gen(){const st=[];const T=mode==='open'?Array.from({length:M},()=>[]):Array(M).fill(null);
  st.push({mode,T:JSON.parse(JSON.stringify(T)),msg:`ตารางขนาด ${M} ช่อง (0–12) กด "ถัดไป" เพื่อใส่ key ทีละตัว`});
  for(const[k,h]of K){let pos=h,coll=false,note=`ใส่ <b>${k}</b> → hash = ${h}`;
   if(mode==='open'){if(T[h].length){coll=true;note+=` ⚠ ชนกับ <b>${T[h][0]}</b> → ต่อท้ายโซ่ในช่อง ${h}`}else note+=` ช่องว่าง วางได้เลย`;T[h].push(k)}
   else{while(T[pos]!==null){coll=true;note+=` ⚠ ช่อง ${pos} ถูกจอง (${T[pos]}) → ลองช่อง ${(pos+1)%M}`;pos=(pos+1)%M}T[pos]=k;if(!coll)note+=' ช่องว่าง วางได้เลย';else if(pos<h)note+=' (วนกลับมาต้นตาราง)'}
   st.push({mode,T:JSON.parse(JSON.stringify(T)),hl:pos,coll,msg:note})}
  st[st.length-1].msg+=' 🎉 ค้นหาเฉลี่ย Θ(1)';return st}
 $('#hseg').onclick=e=>{if(!e.target.dataset.m)return;mode=e.target.dataset.m;[...$('#hseg').children].forEach(b=>b.classList.toggle('on',b===e.target));S.set(gen())};
 S.set(gen());
};

/* quiz.js — ควิซกลาง + โหมดสอบจำลอง
 * ทุกแหล่งถูกแปลงเป็นรูปแบบเดียว: {src, q(html), type:'mc'|'num', opts[](html), a(index) | ans(string), why(html), graph?}
 *   dp-week8: ch.quiz (บางข้อสุ่มโจทย์ใหม่ทุกครั้งด้วย gen)   dp-lab: p.quiz 3 ข้อ/ข้อ
 *   greedy-tutor: FIXED + สุ่มกราฟ   โจทย์ Greedy: AP.GP.QUIZ   เนื้อหาใหม่: AP.EXTRAQ[topicId] */
(function () {
  'use strict';
  const { esc, shuffle } = AP;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ---------- adapters ---------- */
  // ข้อเลือกตอบ: สลับตัวเลือกแล้วจำตำแหน่งข้อถูก (opts เป็น HTML แล้ว)
  function mc(o) {
    const idx = shuffle(o.opts.map((_, i) => i));
    return { src: o.src, q: o.q, type: 'mc', opts: idx.map((i) => o.opts[i]), a: idx.indexOf(o.a), why: o.why || '', graph: o.graph };
  }
  function fromDp8(id) {
    const ch = AP.dp8.byId(id); if (!ch) return [];
    return ch.quiz.map((q) => {
      const src = `Week 8 · ${ch.title}`;
      if (q.gen) {
        const g = q.gen();
        const vals = AP.dp8.makeChoices(g.answer, g.hints, 4);
        return { src, q: g.q, type: 'mc', opts: vals.map((v) => esc(AP.dp8.fmtV(v))), a: vals.findIndex((v) => AP.dp8.same(v, g.answer)), why: g.why || '' };
      }
      return mc({ src, q: q.q, opts: q.opts.map(esc), a: q.ans, why: q.why });
    });
  }
  function fromLab(n) {
    const p = AP.lab.byId(n); if (!p) return [];
    return p.quiz.map((q) => {
      const src = `DP Lab ข้อ ${n} · ${p.title}`;
      if (q.t === 'num') return { src, q: esc(q.q), type: 'num', ans: String(q.a), why: esc(q.why || '') };
      return mc({ src, q: esc(q.q), opts: q.o.map(esc), a: q.a, why: esc(q.why || '') });
    });
  }
  const grQ = (q, src) => mc({ src, q: q.q, opts: q.o.map((x) => esc(x)), a: q.a, why: esc(q.e || ''), graph: q.graph });
  function fromGr(tags) {
    if (!tags || !tags.length) return [];
    const keep = (q) => tags.includes(String(q.tag).replace(/^สุ่ม · /, ''));
    const fixed = AP.gr.FIXED.filter(keep).map((q) => grQ(q, `Greedy Tutor · ${q.tag}`));
    const rnd = AP.gr.randomQs().filter(keep).map((q) => Object.assign(grQ(q, `Greedy Tutor · ${q.tag}`), { fresh: true }));
    return fixed.concat(rnd);
  }
  function fromGp(n) {
    return AP.GP.QUIZ.filter((q) => q.n === n).map((q) => mc({ src: q.src, q: esc(q.q), opts: q.opts.map(esc), a: q.ans, why: esc(q.why) }));
  }
  const fromExtra = (id) => (AP.EXTRAQ && AP.EXTRAQ[id] || []).map((q) => (q.type === 'num' ? { src: q.src, q: q.q, type: 'num', ans: String(q.ans), why: q.why || '' } : mc({ src: q.src, q: q.q, opts: q.opts, a: q.a, why: q.why })));
  // ข้อสอบจริง (AP.REALEXAM): opts เป็นข้อความล้วน จึง escape ก่อนแสดง
  const realQ = (q) => (q.type === 'num'
    ? { src: q.src, q: esc(q.q), type: 'num', ans: q.ans, alt: q.alt, set: q.set, why: esc(q.why || ''), real: true }
    : Object.assign(mc({ src: q.src, q: esc(q.q), opts: q.opts.map(esc), a: q.a, why: esc(q.why || '') }), { real: true }));
  const fromReal = (id) => (AP.REALEXAM || []).filter((q) => q.topic === id).map(realQ);

  function forTopic(t) {
    const out = [];
    if (t.dp8) out.push(...fromDp8(t.dp8));
    t.lab.forEach((n) => out.push(...fromLab(n)));
    out.push(...fromGr(t.tags));
    t.gp.forEach((n) => out.push(...fromGp(n)));
    out.push(...fromExtra(t.id));
    out.push(...fromReal(t.id));
    out.forEach((q) => { q.topic = t.id; });
    return out;
  }
  const dedupe = (qs) => { const seen = new Set(); return qs.filter((q) => { const k = q.src + '|' + q.q.slice(0, 80); if (seen.has(k)) return false; seen.add(k); return true; }); };

  /* ---------- UI ---------- */
  const norm = (s) => String(s).trim().replace(/[,\s]/g, '').replace(/−/g, '-').replace(/infinity|inf/i, '∞');
  const toks = (s) => String(s).trim().toLowerCase().split(/\s+/).filter(Boolean).sort().join('|');
  const isRight = (q, v) => {
    if (q.type === 'mc') return v === q.a;
    const accepted = [q.ans].concat(q.alt || []);
    if (q.set) return accepted.some((x) => toks(x) === toks(v));
    return accepted.some((x) => {
      const a = norm(v).toLowerCase(), b = norm(x).toLowerCase(); if (a === b) return true;
      const p = parseFloat(a), r = parseFloat(b); return /^-?[\d.]+$/.test(a) && !isNaN(p) && !isNaN(r) && Math.abs(p - r) < 1e-9;
    });
  };
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  /* cfg: {qs, key?, mode:'topic'|'exam', seconds?, onFinish?(score,total), again?()} */
  function mount(host, cfg) {
    const qs = cfg.qs, exam = cfg.mode === 'exam';
    let i = 0, score = 0, answered = false, t0 = Date.now(), timer = null, left = cfg.seconds || 0;
    const log = [];
    host.classList.add('ap-qz');
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
    function tick() {
      left = Math.max(0, cfg.seconds - Math.round((Date.now() - t0) / 1000));
      const el = $('.ap-qz-time', host); if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left <= 60); }
      if (!left) { stopTimer(); finish(true); }
    }
    function draw() {
      if (!qs.length) { host.innerHTML = '<div class="ap-note warn"><b class="h">ยังไม่มีข้อสอบในบทนี้</b></div>'; return; }
      const q = qs[i]; answered = false;
      host.innerHTML = `<div class="ap-qz-top"><span>ข้อ ${i + 1} / ${qs.length}</span><div class="ap-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${i}"><i style="width:${i / qs.length * 100}%"></i></div>${cfg.seconds ? `<span class="ap-qz-time">⏱ ${fmtTime(left)}</span>` : `<span>ถูก ${score}</span>`}</div>
        <div class="ap-card"><div class="ap-qz-src">${esc(q.src)}</div><div class="ap-qz-q">${q.q}</div>${q.graph ? '<svg class="ap-qz-graph" viewBox="0 0 520 340" role="img" aria-label="กราฟประกอบโจทย์"></svg>' : ''}
        ${q.type === 'mc' ? `<div class="ap-opts">${q.opts.map((o, k) => `<button type="button" class="ap-opt" data-k="${k}">${o}</button>`).join('')}</div>`
          : '<form class="ap-num"><input inputmode="decimal" autocomplete="off" placeholder="พิมพ์คำตอบ (ตามรูปแบบในโจทย์)" aria-label="คำตอบ"><button class="ap-btn pri" type="submit">ตรวจ</button></form>'}
        <div class="ap-fb-slot" aria-live="polite"></div></div>`;
      if (q.graph) { const v = new AP.gr.GraphView($('.ap-qz-graph', host), q.graph, {}); v.update({ nodes: {}, edges: {} }, false); }
      const inp = $('.ap-num input', host); if (inp) inp.focus();
    }
    function answer(v) {
      if (answered) return; const q = qs[i];
      if (q.type === 'num' && !String(v).trim()) return;
      answered = true; const ok = isRight(q, v); if (ok) score++;
      log.push({ q, v, ok });
      if (exam) {
        $$('.ap-opt', host).forEach((b, k) => { b.disabled = true; if (k === v) b.classList.add('picked'); });
        const inp = $('.ap-num input', host); if (inp) inp.disabled = true;
        next(); return;
      }
      $$('.ap-opt', host).forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add('right'); else if (k === v) b.classList.add('wrong'); });
      const inp = $('.ap-num input', host); if (inp) { inp.disabled = true; $('.ap-num button', host).disabled = true; }
      const last = i + 1 >= qs.length;
      $('.ap-fb-slot', host).innerHTML = `<div class="ap-fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✓ ถูกต้อง' : '✗ ยังไม่ถูก'}</b>${q.type === 'num' && !ok ? ` คำตอบที่ถูกคือ <b>${esc(q.ans)}</b>` : ''}${q.why ? `<div class="ap-why">${q.why}</div>` : ''}</div>
        <div class="ap-row" style="margin-top:12px"><button type="button" class="ap-btn pri" data-next>${last ? 'ดูผลคะแนน' : 'ข้อต่อไป →'}</button></div>`;
      const nb = $('[data-next]', host); if (nb) nb.focus();
    }
    function next() { i++; if (i >= qs.length) finish(false); else draw(); }
    function finish(timeout) {
      stopTimer(); const total = qs.length, ratio = total ? score / total : 0, passed = ratio >= 0.6;
      const wrong = log.filter((x) => !x.ok);
      const unanswered = total - log.length;
      if (cfg.key && !cfg.noSave) { AP.prog.quiz(cfg.key, ratio); AP.progress(); }
      if (cfg.onFinish) cfg.onFinish(score, total, Math.round((Date.now() - t0) / 1000));
      host.innerHTML = `<div class="ap-card" style="text-align:center"><div class="ap-score ${passed ? 'ok' : ''}">${score}<small> / ${total}</small></div>
        <p style="margin:8px 0 4px"><b>${Math.round(ratio * 100)}%</b> · ${passed ? '🎉 ผ่านเกณฑ์ 60%' : 'ยังไม่ถึงเกณฑ์ 60% ลองทำซ้ำได้เลย'}${timeout ? ' · หมดเวลา' : ''}${unanswered > 0 ? ` · ไม่ได้ตอบ ${unanswered} ข้อ` : ''}</p>
        <div class="ap-row" style="justify-content:center;margin-top:12px"><button type="button" class="ap-btn pri" data-again>↻ ทำใหม่${exam ? '' : ' (สุ่มข้อใหม่)'}</button>${cfg.extra ? cfg.extra() : ''}</div></div>
        ${wrong.length ? `<h3 class="ap-h3" style="margin-top:22px">ทบทวนข้อที่พลาด (${wrong.length})</h3><div class="ap-review">${wrong.map((x) => `<div class="ap-card"><div class="ap-qz-src">${esc(x.q.src)}</div><div>${x.q.q}</div><div class="ap-small" style="margin-top:6px">คำตอบที่ถูก: <b>${x.q.type === 'mc' ? x.q.opts[x.q.a] : esc(x.q.ans)}</b>${x.q.why ? `<br><span class="ap-muted">${x.q.why}</span>` : ''}</div></div>`).join('')}</div>` : ''}`;
    }
    host.onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.k !== undefined && b.classList.contains('ap-opt')) answer(+b.dataset.k);
      else if (b.hasAttribute('data-next')) next();
      else if (b.hasAttribute('data-again')) { if (cfg.again) cfg.again(); }
    };
    host.onsubmit = (e) => { e.preventDefault(); const inp = $('.ap-num input', host); if (inp) answer(inp.value); };
    if (cfg.seconds) { timer = setInterval(tick, 1000); }
    AP.hooks.disposeQuiz = stopTimer;
    draw();
    return { stop: stopTimer };
  }

  // ควิซประจำบท (หน้า "ควิซ")
  function mountTopic(host, t) {
    const run = () => {
      const qs = shuffle(dedupe(forTopic(t)));
      mount(host, { qs, key: t.id, mode: 'topic', again: run });
    };
    run();
  }

  /* ---------- สอบจำลอง ---------- */
  const EXAM_KEY = 'exam';
  function mountExam(host) {
    const sel = new Set(AP.store.get('examSel', AP.TOPICS.map((t) => t.id)));
    let count = AP.store.get('examN', 20), timed = AP.store.get('examTimed', true);
    const hist = () => AP.store.get(EXAM_KEY, []);
    function setup() {
      const parts = AP.PARTS.filter((p) => p.id < 4);
      const h = hist();
      host.innerHTML = `<div class="ap-thead"><span class="ap-eyebrow">ฝึกและทบทวน</span><h1 class="ap-h1">⏱ สอบจำลอง</h1><p class="ap-lede">สุ่มข้อสอบจากบทที่เลือก ตอบทุกข้อก่อนแล้วค่อยดูเฉลยและทบทวนข้อที่พลาดตอนจบ (ข้อ Week 8 บางข้อสุ่มตัวเลขใหม่ทุกครั้ง)</p></div>
        <div class="ap-card" style="max-width:860px"><h3 class="ap-h3">เลือกบทที่จะสอบ</h3>
        <div class="ap-row" style="margin-bottom:10px"><button class="ap-btn sm" data-all="1">เลือกทั้งหมด</button><button class="ap-btn sm" data-all="0">ล้าง</button>${parts.map((p) => `<button class="ap-btn sm" data-part="${p.id}">เฉพาะ Part ${p.id}</button>`).join('')}</div>
        ${parts.map((p) => `<fieldset class="ap-fs"><legend style="color:${p.color}">${p.title}</legend><div class="ap-checks">${AP.TOPICS.filter((t) => t.part === p.id).map((t) => `<label><input type="checkbox" data-t="${t.id}" ${sel.has(t.id) ? 'checked' : ''}> ${t.no} ${esc(t.short)}</label>`).join('')}</div></fieldset>`).join('')}
        <div class="ap-row" style="margin:16px 0;gap:18px"><label class="ap-field">จำนวนข้อ<select id="ex-n">${[10, 20, 30, 50].map((n) => `<option ${n === count ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
          <label class="ap-checks"><span><input type="checkbox" id="ex-timed" ${timed ? 'checked' : ''}> จับเวลา (ข้อละ ~1.2 นาที)</span></label></div>
        <button class="ap-btn pri" id="ex-go">▶ เริ่มสอบ</button> <span class="ap-muted ap-small" id="ex-avail"></span></div>
        ${h.length ? `<h3 class="ap-h3" style="margin-top:26px">ผลสอบล่าสุด</h3><div class="ap-tscroll" style="max-width:860px"><table class="ap-t"><thead><tr><th>ครั้งที่</th><th>คะแนน</th><th>จำนวนข้อ</th><th>เวลาที่ใช้</th></tr></thead><tbody>${h.slice().reverse().map((x, k) => `<tr><td>${h.length - k}</td><td><b>${x.s}</b> / ${x.t} (${Math.round(x.s / x.t * 100)}%)</td><td>${x.t}</td><td class="ap-mono">${fmtTime(x.sec)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
      const avail = () => { const n = dedupe(AP.TOPICS.filter((t) => sel.has(t.id)).flatMap(forTopic)).length; $('#ex-avail', host).textContent = `ข้อที่ใช้ได้ในบทที่เลือก ≈ ${n} ข้อ`; $('#ex-go', host).disabled = !n; };
      avail();
      host.onchange = (e) => {
        const t = e.target;
        if (t.dataset.t) { t.checked ? sel.add(t.dataset.t) : sel.delete(t.dataset.t); AP.store.set('examSel', [...sel]); avail(); }
        else if (t.id === 'ex-n') { count = +t.value; AP.store.set('examN', count); }
        else if (t.id === 'ex-timed') { timed = t.checked; AP.store.set('examTimed', timed); }
      };
      host.onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.all !== undefined) { sel.clear(); if (b.dataset.all === '1') AP.TOPICS.forEach((t) => sel.add(t.id)); AP.store.set('examSel', [...sel]); setup(); }
        else if (b.dataset.part) { sel.clear(); AP.TOPICS.filter((t) => t.part === +b.dataset.part).forEach((t) => sel.add(t.id)); AP.store.set('examSel', [...sel]); setup(); }
        else if (b.id === 'ex-go') start();
      };

      ${U.table(['บท', 'สถานะ', 'ควิซดีที่สุด', 'ทำแล้ว (ครั้ง)'], AP.TOPICS.map((t) => { const p = pr[t.id] || {}; return [`<a href="#t/${t.id}/learn">${t.no} ${esc(t.short)}</a>`, chip(AP.prog.status(t.id)), p.n ? pct(p.q) : '–', p.n || 0]; }))}

  /* ============ โจทย์ Greedy 12 ข้อ (หน้าโจทย์ต่อข้อ) ============ */
  P.gproblem = (host, n) => {

      ${nb.fix ? U.note('แก้จากต้นฉบับ', `<p>ค่าตัวอย่างในโจทย์เดิมไม่ตรงกับที่โค้ดคำนวณได้จริง: ${nb.fix}</p>${nb.code ? `<p>โค้ดที่แก้แล้ว:</p><pre class="ap-pre"><code>${esc(nb.code)}</code></pre>` : ''}`, 'bad') : ''}

  /* ============ เดโม: เกณฑ์ Greedy ของ Activity Selection ============ */
  P.criteria = (host) => {
    const acts = [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11]];
    const CR = {

    const best = run('finish').ch.length;

      <div class="ap-sub" role="group" aria-label="เกณฑ์">${Object.entries(CR).map(([k, v], i) => `<button type="button" data-k="${k}" aria-pressed="${i === 0}">${v[0]}</button>`).join('')}</div>
      <div class="ap-card"><svg class="ap-crit" viewBox="0 0 600 260" role="img" aria-label="ไทม์ไลน์งาน"></svg><p class="ap-crit-out" aria-live="polite"></p><div class="m-gr"><div class="pl"></div></div></div>`;
    const svg = host.querySelector('.ap-crit'), out = host.querySelector('.ap-crit-out');
    let cur = 'finish', player;
    const sx = (v) => 30 + v / 12 * 540;
    function draw(st) {
      const rows = st.ord; let g = '';
      for (let t = 0; t <= 11; t++) g += `<line class="ga-axis" x1="${sx(t)}" y1="10" x2="${sx(t)}" y2="236" style="stroke-dasharray:2 4"/><text class="ga-tick" x="${sx(t)}" y="252">${t}</text>`;
      rows.forEach((a, i) => { const y = 14 + i * 27, cls = st.pick.some((c) => c === a) ? 'ok' : st.cur === a ? 'cand' : st.rej.includes(a) ? 'bad' : ''; g += `<rect class="ga-bar ${cls}" x="${sx(a[0])}" y="${y}" width="${sx(a[1]) - sx(a[0])}" height="20" rx="4"/><text class="ga-lab" x="${sx(a[0]) + 6}" y="${y + 14}">(${a[0]},${a[1]})</text>`; });

      ord.forEach((a) => { const ok = pick.every((c) => a[1] <= c[0] || a[0] >= c[1]); steps.push({ ord, pick: pick.slice(), rej: rej.slice(), cur: a, text: `พิจารณา (${a}) — ${ok ? 'ไม่ชนงานที่เลือกไว้ → <b>เลือก</b>' : 'ชนกับงานที่เลือกไว้ → ข้าม'}` }); if (ok) pick.push(a); else rej.push(a); });
      steps.push({ ord, pick: pick.slice(), rej: rej.slice(), cur: null, text: `<b>เสร็จ:</b> ได้ ${pick.length} งาน — ${pick.length === best ? '✓ เท่ากับคำตอบที่ดีที่สุด (' + best + ' งาน)' : `✗ น้อยกว่าคำตอบที่ดีที่สุด (${best} งาน) เกณฑ์นี้ไม่ถูกต้อง`}` });
      player.setSteps(steps, 0);

    player = new AP.gr.StepPlayer(host.querySelector('.pl'), draw);
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (!b) return; cur = b.dataset.k; host.querySelectorAll('[data-k]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); build(); });
    build();

  };

  P.games = (host) => {

      <div class="ap-grid ap-games">${AP.GAMES.map((g) => { const s = gs[g.id] || {}; return `<a class="ap-card ap-tool" href="#game/${g.id}"><b class="ap-gt">${g.icon} ${g.title}</b><span class="ap-small ap-muted">${g.desc}</span><span class="ap-small ap-mono">คะแนนสูงสุด ${s.best || 0} · streak ${s.streak || 0}</span></a>`; }).join('')}</div></div>`;
  };

  /* ============ กล่องเสริมท้ายหน้าเรียนของบท DP (จาก dp-week8 + DP Lab) ============ */
  P.dpExtras = (t) => {

    t.lab.forEach((n) => { const p = AP.lab.byId(n); if (p && p.pdfFix) out.push(`<div class="ap-note bad"><b class="h">⚠ จุดที่โจทย์/PDF พิมพ์ผิด (DP Lab ข้อ ${n})</b>${p.pdfFix}</div>`); });
    return out.join('');
  };

  AP.pages = P;
})();

/* games.js — เกม 4 แบบ (สุ่มโจทย์ใหม่ทุกรอบ, เก็บคะแนนสูงสุด/streak ใน AP.store)
 *  dpfill  เติมตาราง DP แข่งเวลา       (ตรวจด้วย Engines จาก dp-week8)
 *  algo    เล่นเป็น Prim/Kruskal/Dijkstra (ตรวจตามกฎของอัลกอริทึม ไม่ผูกกับลำดับตายตัว)
 *  match   จับคู่ Flashcard
 *  greedy  Greedy ได้ optimal ไหม?     (เทียบกับ DP / ลองทุกแบบ)                        */
(function () {
  'use strict';
  const { esc, shuffle, rnd } = AP;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const E = () => window.Engines;
  const INF = Infinity;
  const NS = 'http://www.w3.org/2000/svg';
  const pick = (a) => a[rnd(0, a.length - 1)];
  const svgEl = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

  /* ---------- กรอบเกมร่วม: HUD, คะแนน, สรุปผล ---------- */
  function Session(host, meta, rounds, startRound) {
    const S = { score: 0, streak: 0, best: 0, ok: 0, round: 0, rounds, t0: 0, timer: null };
    host.innerHTML = `<div class="ap-wrap ap-game"><div class="ap-thead"><a class="ap-small" href="#games">← เกมทั้งหมด</a><h1 class="ap-h1">${meta.icon} ${meta.title}</h1><p class="ap-lede">${meta.how}</p></div>
      <div class="ap-hud" aria-live="polite"><span>รอบ <b class="h-r">1</b>/${rounds}</span><span>คะแนน <b class="h-s">0</b></span><span>Streak 🔥 <b class="h-k">0</b></span><span class="h-t">⏱ 0</span></div><div class="ap-gstage"></div></div>`;
    const stage = $('.ap-gstage', host);
    const hud = () => { $('.h-r', host).textContent = Math.min(S.round + 1, rounds); $('.h-s', host).textContent = S.score; $('.h-k', host).textContent = S.streak; };
    S.stage = stage;
    S.startTimer = () => { S.t0 = Date.now(); clearInterval(S.timer); S.timer = setInterval(() => { const el = $('.h-t', host); if (el) el.textContent = '⏱ ' + Math.round((Date.now() - S.t0) / 1000); }, 500); };
    S.elapsed = () => (Date.now() - S.t0) / 1000;
    S.stopTimer = () => clearInterval(S.timer);
    // เพิ่มคะแนนรอบ: ถูกครบ → โบนัสความเร็ว + streak
    S.award = (base, allOk, quick) => {
      let pts = Math.round(base);
      if (allOk) { S.streak++; S.best = Math.max(S.best, S.streak); S.ok++; pts += Math.max(0, Math.round(quick)) + Math.min(50, (S.streak - 1) * 10); } else S.streak = 0;
      S.score += pts; hud(); return pts;
    };
    S.next = () => { S.round++; hud(); if (S.round >= rounds) S.finish(); else startRound(S); };
    S.finish = () => {
      S.stopTimer(); const all = AP.store.get('games', {}), g = all[meta.id] || { best: 0, ok: 0, streak: 0, plays: 0 };
      const newBest = S.score > g.best; g.best = Math.max(g.best, S.score); g.ok += S.ok; g.streak = Math.max(g.streak, S.best); g.plays = (g.plays || 0) + 1; all[meta.id] = g; AP.store.set('games', all); AP.progress();
      stage.innerHTML = `<div class="ap-card" style="text-align:center;max-width:560px;margin:20px auto"><div class="ap-score">${S.score}<small> คะแนน</small></div><p>ถูกครบ <b>${S.ok}</b> / ${rounds} รอบ · streak สูงสุด <b>${S.best}</b>${newBest ? ' · 🏆 คะแนนสูงสุดใหม่!' : ` · สูงสุดเดิม ${g.best}`}</p>
        <div class="ap-row" style="justify-content:center"><button class="ap-btn pri" data-again>↻ เล่นอีกครั้ง</button><a class="ap-btn" href="#games">เลือกเกมอื่น</a></div></div>`;
      $('[data-again]', stage).onclick = () => AP.games.mount(meta.id, host);
    };
    AP.hooks.disposeGame = S.stopTimer;
    hud(); startRound(S);
    return S;
  }
  const fb = (el, ok, html) => { el.innerHTML = `<div class="ap-fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✓' : '✗'}</b> ${html}</div>`; };

  /* ============ 1) เติมตาราง DP ============ */
  const isNum = (s) => /^-?\d+(\.\d+)?$/.test(s);
  const normAns = (s) => String(s).trim().replace(/−/g, '-').replace(/infinity|inf|∞/i, '∞');
  const dpTypes = {
    coinrow: () => { const C = Array.from({ length: 6 }, () => rnd(1, 9)); const r = E().coinRow(C); return { title: 'Coin-row', input: `เหรียญ C = [${C.join(', ')}] (เลือกได้ แต่ห้ามติดกัน)`, rec: 'F(i) = max{Cᵢ + F(i−2), F(i−1)}', ch: 'coinrow', steps: r.steps, row: 1, minC: 2 }; },
    change: () => { const D = pick([[1, 3, 4], [1, 5, 7], [1, 2, 5], [1, 4, 6], [1, 3, 5]]); const n = rnd(7, 11); const r = E().changeMaking(D, n); return { title: 'Change-making', input: `ชนิดเหรียญ D = {${D.join(', ')}} · ยอดที่ต้องแลก n = ${n} (F = จำนวนเหรียญน้อยสุด)`, rec: 'F(i) = min{F(i − dⱼ)} + 1', ch: 'change', steps: r.steps, row: 0, minC: 2 }; },
    knap: () => { const n = 4, w = [], v = []; for (let i = 0; i < n; i++) { w.push(rnd(1, 4)); v.push(rnd(2, 9) * 5); } const W = rnd(5, 7); const r = E().knapsack(w, v, W); return { title: 'Knapsack 0/1', input: `น้ำหนัก w = [${w}] · มูลค่า v = [${v}] · ความจุ W = ${W}`, rec: 'F(i, j) = max{F(i−1, j), vᵢ + F(i−1, j−wᵢ)} (ถ้า j ≥ wᵢ)', ch: 'knap', steps: r.steps, minR: 1, minC: 1, all: true }; },
    collect: () => { const n = 4, m = 5, C = Array.from({ length: n }, () => Array.from({ length: m }, () => (Math.random() < 0.45 ? 1 : 0))); const r = E().coinCollect(C); return { title: 'Coin-collection', input: `กระดาน (● = มีเหรียญ):<div class="ap-mini-grid">${C.map((row) => `<div>${row.map((x) => `<i class="${x ? 'c' : ''}"></i>`).join('')}</div>`).join('')}</div>เดินได้เฉพาะขวา/ลง จากมุมซ้ายบน`, rec: 'F(i, j) = max{F(i−1, j), F(i, j−1)} + Cᵢⱼ', ch: 'collect', steps: r.steps, minR: 0, minC: 0, all: true }; },
    floyd: () => { const n = 4, L = 'abcd', W = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : (Math.random() < 0.6 ? rnd(1, 9) : INF)))); for (let i = 0; i < n; i++) W[i][(i + 1) % n] = W[i][(i + 1) % n] === INF ? rnd(1, 9) : W[i][(i + 1) % n]; const r = E().floyd(W); return { title: 'Floyd', input: `เมทริกซ์น้ำหนัก W (แถว → คอลัมน์, ∞ = ไม่มีเส้น):<div class="ap-mini-tab">${W.map((row, i) => `${L[i]}: ` + row.map((x) => (x === INF ? '∞' : x)).join('  ')).join('<br>')}</div>`, rec: 'D(k)[i,j] = min{D(k−1)[i,j], D(k−1)[i,k] + D(k−1)[k,j]}', ch: 'floyd', steps: r.steps, offDiag: true, finiteOnly: true }; },
    warshall: () => { const n = 4, L = 'abcd', A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i !== j && Math.random() < 0.3 ? 1 : 0))); const r = E().warshall(A); return { title: 'Warshall', input: `เมทริกซ์ความสัมพันธ์ A (1 = มีเส้นตรง):<div class="ap-mini-tab">${A.map((row, i) => `${L[i]}: ` + row.join('  ')).join('<br>')}</div>`, rec: 'R(k)[i,j] = R(k−1)[i,j] หรือ (R(k−1)[i,k] และ R(k−1)[k,j])', ch: 'warshall', steps: r.steps, offDiag: true }; },
  };
  function gameDpFill(host) {
    Session(host, { id: 'dpfill', icon: '🧮', title: 'เติมตาราง DP แข่งเวลา', how: 'สุ่มโจทย์จาก Week 8 แล้วกรอกช่องที่เป็นช่องว่างให้ครบ ตอบถูกครบและเร็วได้คะแนนเพิ่ม (5 รอบ)' }, 5, (S) => {
      const T = pick(Object.values(dpTypes))();
      const last = T.steps[T.steps.length - 1], tab = last.tables[0], cells = [];
      tab.cells.forEach((row, r) => row.forEach((c, k) => {
        if (T.row !== undefined && r !== T.row) return;
        if (T.minR !== undefined && r < T.minR) return;
        if (T.minC !== undefined && k < T.minC) return;
        if (T.offDiag && r === k) return;
        if (c.t === '' || c.t === undefined) return;
        if (T.finiteOnly && c.t === '∞') return;
        cells.push([r, k]);
      }));
      const chosen = new Set(shuffle(cells).slice(0, Math.min(T.offDiag ? 3 : 4, cells.length)).map(([r, c]) => r + ',' + c));
      const stripLab = (s) => String(s);
      S.stage.innerHTML = `<div class="ap-card"><div class="ap-eyebrow">${T.title}</div><p class="ap-gin">${T.input}</p><p class="ap-small ap-muted">สูตร: <span class="ap-mono">${T.rec}</span></p>

        <div class="ap-row" style="margin-top:12px"><button class="ap-btn pri" data-check>ตรวจคำตอบ</button><button class="ap-btn" data-hint>💡 ดูสูตรอ้างอิงช่องแรก</button></div><div class="ap-gfb"></div></div>`;
