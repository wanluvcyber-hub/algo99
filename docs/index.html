<style>
/* tokens.css — สี/ฟอนต์กลางของทั้งเว็บ (ทุกโมดูลแมปตัวแปรเดิมมาที่ชุดนี้) */
:root{
  --ap-bg:#f1f4f1; --ap-surface:#ffffff; --ap-surface2:#e6ebe6; --ap-ink:#16201b; --ap-ink2:#4d5a53; --ap-ink3:#7d8983; --ap-line:#d0d8d1;
  --ap-accent:#1d5cab; --ap-accent-soft:#dce7f5; --ap-accent-ink:#ffffff;
  --ap-cand:#b06d05; --ap-cand-soft:#fcefd2; --ap-ok:#18794a; --ap-ok-soft:#d9f0e2; --ap-bad:#bf3629; --ap-bad-soft:#fbe1dd;
  --ap-dp:#1d5cab; --ap-gr:#18794a; --ap-tm:#8a3fb0; --ap-rv:#b06d05;
  --ap-sans:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ap-display:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --ap-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --ap-shadow:0 1px 2px rgba(22,32,27,.06),0 4px 14px rgba(22,32,27,.05);
  --ap-radius:10px; --ap-side:272px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ap-bg:#0f1412; --ap-surface:#161d1a; --ap-surface2:#1f2824; --ap-ink:#e3eae5; --ap-ink2:#a0ada6; --ap-ink3:#76837c; --ap-line:#2b3631;
    --ap-accent:#7eaef0; --ap-accent-soft:#1b2c44; --ap-accent-ink:#0b1422;
    --ap-cand:#f0b13a; --ap-cand-soft:#3a2d10; --ap-ok:#55c98a; --ap-ok-soft:#133222; --ap-bad:#ff8375; --ap-bad-soft:#3d1c18;
    --ap-dp:#7eaef0; --ap-gr:#55c98a; --ap-tm:#c996e8; --ap-rv:#f0b13a;
    --ap-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ap-bg:#0f1412; --ap-surface:#161d1a; --ap-surface2:#1f2824; --ap-ink:#e3eae5; --ap-ink2:#a0ada6; --ap-ink3:#76837c; --ap-line:#2b3631;
  --ap-accent:#7eaef0; --ap-accent-soft:#1b2c44; --ap-accent-ink:#0b1422;
  --ap-cand:#f0b13a; --ap-cand-soft:#3a2d10; --ap-ok:#55c98a; --ap-ok-soft:#133222; --ap-bad:#ff8375; --ap-bad-soft:#3d1c18;
  --ap-dp:#7eaef0; --ap-gr:#55c98a; --ap-tm:#c996e8; --ap-rv:#f0b13a;
  --ap-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}

/* app.css — โครงหน้าเว็บ (shell) ใช้ prefix ap- ทั้งหมด */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ap-bg);color:var(--ap-ink);font:400 16px/1.7 var(--ap-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ap-accent);outline-offset:2px;border-radius:4px}
a{color:var(--ap-accent)}
code,.ap-mono{font-family:var(--ap-mono);font-size:.92em}
kbd{font:600 .78rem var(--ap-mono);border:1px solid var(--ap-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--ap-surface2)}
.ap-skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ap-accent);color:var(--ap-accent-ink);padding:6px 12px;border-radius:6px}
.ap-skip:focus{left:8px}

/* ---------- top bar ---------- */
.ap-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;padding:8px 16px;background:color-mix(in srgb,var(--ap-bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ap-line)}
.ap-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ap-ink);min-width:0}
.ap-brand b{display:block;font:700 1.12rem/1.1 var(--ap-display);letter-spacing:.01em}
.ap-brand small{display:block;font-size:.74rem;color:var(--ap-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-logo{flex:none;display:grid;place-items:center;height:34px;padding:0 8px;border-radius:8px;background:var(--ap-ink);color:var(--ap-bg);font:700 .8rem var(--ap-mono)}
.ap-top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ap-icon{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--ap-line);background:var(--ap-surface);cursor:pointer;font-size:1.05rem}
.ap-topbtn{display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--ap-line);background:var(--ap-surface);color:var(--ap-ink);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.ap-menu{display:none}

/* ---------- layout ---------- */
.ap-shell{display:grid;grid-template-columns:var(--ap-side) minmax(0,1fr);align-items:start}
.ap-side{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px);overflow-y:auto;padding:14px 10px 40px 14px;border-right:1px solid var(--ap-line);font-size:.92rem}
.ap-main{min-width:0;padding-inline:clamp(16px,3.4vw,40px);padding-block:26px 80px;outline:none}
.ap-wrap{max-width:1180px;margin-inline:auto}
.ap-scrim{display:none}
@media (max-width:960px){
  .ap-menu{display:grid;place-items:center}
  .ap-shell{grid-template-columns:minmax(0,1fr)}
  .ap-side{position:fixed;z-index:60;top:0;left:0;bottom:0;height:auto;width:min(86vw,320px);background:var(--ap-bg);transform:translateX(-102%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  body.ap-nav-open .ap-side{transform:none;box-shadow:var(--ap-shadow)}
  body.ap-nav-open .ap-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}
  .ap-topbtn{display:none}
}

/* ---------- sidebar ---------- */
.ap-nav-top{display:grid;gap:2px;margin-bottom:12px}
.ap-part{margin-top:14px}
.ap-part-h{display:flex;align-items:center;gap:8px;font:600 .72rem var(--ap-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ap-ink2);padding:0 8px 6px}
.ap-part-h i{width:9px;height:9px;border-radius:2px;background:var(--pc)}
.ap-link{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ap-ink);line-height:1.35}
.ap-link:hover{background:var(--ap-surface2)}
.ap-link.cur{background:var(--ap-accent-soft);color:var(--ap-ink);font-weight:600}
.ap-link .no{flex:none;min-width:2.6em;font:600 .74rem var(--ap-mono);color:var(--ap-ink3)}
.ap-link .t{flex:1;min-width:0}
.ap-dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ap-line)}
.ap-dot.started{border-color:var(--ap-cand);background:var(--ap-cand-soft)}
.ap-dot.passed{border-color:var(--ap-ok);background:var(--ap-ok)}
.ap-side-prog{margin:16px 8px 0;font-size:.8rem;color:var(--ap-ink2)}

/* ---------- common ---------- */
.ap-eyebrow{font:600 .74rem var(--ap-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ap-ink2)}
.ap-h1{font:700 clamp(1.7rem,4vw,2.5rem)/1.2 var(--ap-display);margin:.2em 0 .25em;text-wrap:balance;letter-spacing:.005em}
.ap-h2{font:600 1.35rem/1.3 var(--ap-display);margin:34px 0 12px;text-wrap:balance}
.ap-h3{font-size:1.05rem;margin:0 0 8px}
.ap-lede{color:var(--ap-ink2);max-width:70ch;margin:0 0 12px;font-size:1.04rem}
.ap-card{background:var(--ap-surface);border:1px solid var(--ap-line);border-radius:var(--ap-radius);padding:16px 18px}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.ap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ap-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--ap-line);background:var(--ap-surface);color:var(--ap-ink);text-decoration:none;font-weight:600;font-size:.94rem;cursor:pointer}
.ap-btn:hover{border-color:var(--ap-accent)}
.ap-btn.pri{background:var(--ap-accent);border-color:var(--ap-accent);color:var(--ap-accent-ink)}
.ap-btn:disabled{opacity:.45;cursor:not-allowed}
.ap-btn.sm{min-height:34px;padding:4px 10px;font-size:.86rem}
.ap-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--ap-line);background:var(--ap-surface);font-size:.8rem;color:var(--ap-ink2);white-space:nowrap}
.ap-chip.ok{border-color:var(--ap-ok);color:var(--ap-ok);background:var(--ap-ok-soft)}
.ap-chip.started{border-color:var(--ap-cand);color:var(--ap-cand);background:var(--ap-cand-soft)}
.ap-muted{color:var(--ap-ink2)}
.ap-small{font-size:.88rem}
.ap-note{border-left:4px solid var(--ap-accent);background:var(--ap-accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.ap-note.warn{border-left-color:var(--ap-cand);background:var(--ap-cand-soft)}
.ap-note.bad{border-left-color:var(--ap-bad);background:var(--ap-bad-soft)}
.ap-note b.h{display:block;margin-bottom:4px}
.ap-note ul,.ap-note ol{margin:4px 0;padding-left:20px}
.ap-bar{height:8px;border-radius:4px;background:var(--ap-surface2);overflow:hidden}
.ap-bar i{display:block;height:100%;background:var(--ap-ok);transition:width .3s}
.ap-tscroll{overflow-x:auto;border:1px solid var(--ap-line);border-radius:var(--ap-radius);background:var(--ap-surface)}
table.ap-t{border-collapse:collapse;width:100%;min-width:620px;font-size:.92rem}
.ap-t th,.ap-t td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--ap-line)}
.ap-t thead th{background:var(--ap-surface2);font-weight:700;white-space:nowrap}
.ap-t tbody th{font-weight:600;white-space:nowrap}
.ap-t tr:last-child>*{border-bottom:0}
.ap-t .ap-mono{white-space:nowrap}
.ap-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ap-ink);color:var(--ap-bg);padding:8px 16px;border-radius:8px;z-index:90;font-size:.9rem}

/* ---------- home ---------- */
.ap-hero{display:grid;gap:10px;max-width:820px;padding-block:6px 10px}
.ap-hero .ap-h1{font-size:clamp(2rem,5vw,3.1rem)}
.ap-hero .ap-h1 em{font-style:normal;color:var(--ap-accent)}
.ap-rec{font:500 .95rem/1.6 var(--ap-mono);background:var(--ap-surface);border:1px dashed var(--ap-line);border-radius:8px;padding:10px 14px;overflow-x:auto;white-space:nowrap;color:var(--ap-ink2)}
.ap-rec b{color:var(--ap-ink)}
.ap-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-top:16px}
.ap-pcard{display:grid;gap:6px;align-content:start;text-decoration:none;color:var(--ap-ink);background:var(--ap-surface);border:1px solid var(--ap-line);border-top:4px solid var(--pc);border-radius:var(--ap-radius);padding:14px 16px;transition:transform .15s,border-color .15s}
.ap-pcard:hover{transform:translateY(-2px);border-color:var(--pc)}
.ap-pcard .k{font:600 .72rem var(--ap-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
.ap-pcard b{font:600 1.2rem/1.3 var(--ap-display)}
.ap-pcard span{color:var(--ap-ink2);font-size:.9rem}
.ap-plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.ap-plan .day{font:700 .8rem var(--ap-mono);color:var(--ap-accent);letter-spacing:.06em}
.ap-plan ul{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.ap-flow{display:grid;gap:8px;max-width:760px}
.ap-flow .q{display:flex;gap:10px;align-items:flex-start}
.ap-flow .q b{flex:none;font:700 .8rem var(--ap-mono);background:var(--ap-ink);color:var(--ap-bg);border-radius:6px;padding:2px 7px;margin-top:3px}

/* ---------- topic page ---------- */
.ap-thead{display:grid;gap:4px;margin-bottom:6px}
.ap-thead .ap-row{margin-top:6px}
.ap-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--ap-line);margin:14px 0 22px;scrollbar-width:thin;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:20;background:var(--ap-bg)}
.ap-tabs a{flex:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--ap-ink2);text-decoration:none;font-weight:600;white-space:nowrap}
.ap-tabs a:hover{color:var(--ap-ink)}
.ap-tabs a[aria-current="page"]{color:var(--ap-accent);border-bottom-color:var(--ap-accent)}
.ap-pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--ap-line);flex-wrap:wrap}
.ap-pn a{text-decoration:none;font-weight:600}
.ap-sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ap-sub a,.ap-sub button{padding:6px 12px;border-radius:999px;border:1px solid var(--ap-line);background:var(--ap-surface);color:var(--ap-ink);text-decoration:none;font-size:.88rem;font-weight:600;cursor:pointer}
.ap-sub a[aria-current="page"],.ap-sub button[aria-pressed="true"]{background:var(--ap-ink);color:var(--ap-bg);border-color:var(--ap-ink)}
.ap-srcnote{font-size:.8rem;color:var(--ap-ink3);margin:0 0 10px}
.ap-related{margin-top:28px}

/* ---------- quiz (กลาง) ---------- */
.ap-qz{max-width:820px}
.ap-qz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font:600 .86rem var(--ap-mono);color:var(--ap-ink2)}
.ap-qz-top .ap-bar{flex:1 1 160px}
.ap-qz-q{font-size:1.08rem;font-weight:600;margin:6px 0 12px}
.ap-qz-q .qart{font:500 .9rem/1.7 var(--ap-mono);background:var(--ap-surface2);border-radius:8px;padding:8px 12px;margin:8px 0;overflow-x:auto}
.ap-qz-src{font:600 .7rem var(--ap-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ap-accent)}
.ap-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.ap-opt{text-align:left;background:var(--ap-surface);border:1.5px solid var(--ap-line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:46px}
.ap-opt:hover:not(:disabled){border-color:var(--ap-accent)}
.ap-opt:disabled{cursor:default}
.ap-opt.right{border-color:var(--ap-ok);background:var(--ap-ok-soft)}
.ap-opt.wrong{border-color:var(--ap-bad);background:var(--ap-bad-soft)}
.ap-fb{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--ap-surface2)}
.ap-fb.ok b:first-child{color:var(--ap-ok)}
.ap-fb.bad b:first-child{color:var(--ap-bad)}
.ap-score{font:700 3rem/1 var(--ap-display)}
.ap-score small{font-size:1.2rem;color:var(--ap-ink2)}
.ap-review{display:grid;gap:8px;margin-top:16px}
.ap-review .ap-card{padding:10px 14px;font-size:.92rem}
.ap-num{display:flex;gap:8px;flex-wrap:wrap}
.ap-num input{flex:1 1 140px;min-height:44px;border:1.5px solid var(--ap-line);border-radius:8px;padding:6px 12px;background:var(--ap-surface);font-family:var(--ap-mono)}

/* ---------- forms ---------- */
.ap-field{display:grid;gap:4px;font-size:.86rem;font-weight:600;color:var(--ap-ink2)}
.ap-field select,.ap-field input{min-height:40px;border:1px solid var(--ap-line);border-radius:8px;padding:6px 10px;background:var(--ap-surface);color:var(--ap-ink);font-weight:400}
.ap-checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.ap-checks label{display:flex;gap:6px;align-items:center;font-size:.9rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:520px){
  .ap-brand small{display:none}
  .ap-main{padding-block:18px 70px}
}

.m-dp8{
  --bg: #fafaf8; --surface: #ffffff; --surface2: #f3f4f2; --ink: #16181d; --muted: #5c6470; --line: #e3e5e8;
  --accent: #2554d8; --accent-soft: #e7eefe; --accent-ink: #ffffff;
  --dep: #a86a06; --dep-soft: #fdf1d6;
  --good: #1a7f47; --good-soft: #e0f4e8;
  --bad: #c0392b; --bad-soft: #fde9e6;
  --code-bg: #f4f5f3; --shadow: 0 1px 2px rgba(20,24,30,.05), 0 4px 14px rgba(20,24,30,.05);
  --radius: 12px; --side-w: 264px;
  --sans: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m-dp8{
    --bg: #0e1014; --surface: #161a20; --surface2: #1c2129; --ink: #e9ebef; --muted: #98a1b0; --line: #2a303a;
    --accent: #7ba3ff; --accent-soft: #1a2846; --accent-ink: #0e1014;
    --dep: #e6b455; --dep-soft: #33290f;
    --good: #52c98d; --good-soft: #11301f;
    --bad: #ff8a7a; --bad-soft: #3a1a17;
    --code-bg: #12161c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark;
  }}
:root[data-theme="dark"] .m-dp8{
  --bg: #0e1014; --surface: #161a20; --surface2: #1c2129; --ink: #e9ebef; --muted: #98a1b0; --line: #2a303a;
  --accent: #7ba3ff; --accent-soft: #1a2846; --accent-ink: #0e1014;
  --dep: #e6b455; --dep-soft: #33290f;
  --good: #52c98d; --good-soft: #11301f;
  --bad: #ff8a7a; --bad-soft: #3a1a17;
  --code-bg: #12161c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark;
}
.m-dp8 *{ box-sizing: border-box; }

.m-dp8{ margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
.m-dp8 a{ color: var(--accent); text-decoration: none; }
.m-dp8 a:hover{ text-decoration: underline; }
.m-dp8 h1,.m-dp8 h2,.m-dp8 h3{ line-height: 1.3; margin: 0; letter-spacing: -.005em; }
.m-dp8 p{ margin: 0 0 .9em; }
.m-dp8 ul,.m-dp8 ol{ margin: 0 0 .9em; padding-left: 1.3em; }
.m-dp8 li{ margin: .2em 0; }
.m-dp8 code,.m-dp8 pre,.m-dp8 kbd,.m-dp8 .mono{ font-family: var(--mono); }
.m-dp8 kbd{ font-size: .8em; background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }
.m-dp8 button,.m-dp8 select,.m-dp8 input{ font: inherit; color: inherit; }
.m-dp8 button{ cursor: pointer; }
.m-dp8 :focus-visible{ outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.m-dp8 .muted{ color: var(--muted); }
.m-dp8 .small{ font-size: .875rem; }

.m-gr table.pt{border-collapse:collapse;width:100%;font:500 .9rem/1.9 var(--mono)}
.m-gr .pt th{text-align:left;font:600 .78rem var(--sans);color:var(--ink2);padding:6px 10px 6px 48px;border-bottom:2px solid var(--rule);white-space:nowrap}
.m-gr .pt th+th{padding-left:10px}
.m-gr .pt td{padding:4px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.m-gr .pt td:first-child{padding-left:48px;white-space:nowrap}
.m-gr .pt tr.cur td{background:color-mix(in srgb,var(--cand-soft) 60%,transparent)}
.m-gr .pc{display:inline-block;margin-right:10px;white-space:nowrap}
.m-gr .pc.b{font-weight:700;color:var(--ok)}
.m-gr .pc.ch{text-decoration:underline dotted var(--cand)}
.m-gr .pc.x{text-decoration:line-through;opacity:.55}
.m-gr .pnote{padding:12px 12px 12px 48px;color:var(--ink2);font-size:.9rem}
.m-gr .paper-line{padding:2px 12px 2px 48px;font:500 .95rem/1.9 var(--mono);border-bottom:1px solid var(--rule)}
.m-gr .coin-stage{display:grid;gap:14px}
.m-gr .denoms,.m-gr .tray{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.m-gr .coin{--h:210;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--mono);color:#fff;background:radial-gradient(circle at 30% 28%,hsl(var(--h) 65% 68%),hsl(var(--h) 62% 44%));border:2px solid hsl(var(--h) 60% 34%);text-shadow:0 1px 1px rgba(0,0,0,.35);position:relative;transition:transform .3s,opacity .3s,box-shadow .3s}
.m-gr .coin.small{width:38px;height:38px;font-size:.88rem}
.m-gr .coin em{position:absolute;right:-8px;top:-9px;font:600 .7rem var(--mono);font-style:normal;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 5px;text-shadow:none}
.m-gr .denoms .coin.dim{opacity:.35}
.m-gr .denoms .coin.act{transform:scale(1.18);box-shadow:0 0 0 4px var(--cand-soft),0 0 0 6px var(--cand)}
.m-gr .remain{font-size:1rem;color:var(--ink2)}
.m-gr .remain b{font:700 2.4rem var(--mono);color:var(--ink);margin-left:8px;font-variant-numeric:tabular-nums}
.m-gr .tray{min-height:60px;padding:12px;border:2px dashed var(--line);border-radius:10px;background:var(--surface2)}
.m-gr .tray .coin.drop{animation:gr-drop .5s ease-out both}
.m-gr .tray-empty{color:var(--ink2);font-size:.9rem}
.m-gr .compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.m-gr .cmp-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.m-gr .cmp-box h4{font-size:.82rem;color:var(--ink2);letter-spacing:.03em}
.m-gr .cmp-box .big{font:700 1.3rem var(--mono)}
.m-gr .cmp-box.opt{border-color:var(--ok)}
.m-gr .hsvg{display:block;width:100%;height:auto}
.m-gr .he{stroke:var(--idle);stroke-width:2;transition:stroke .3s}
.m-gr .he.hl{stroke:var(--ok);stroke-width:4}
.m-gr .hb circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.m-gr .hb text{font:700 11px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.m-gr .hn rect,.m-gr .hn circle{fill:var(--surface);stroke:var(--idle);stroke-width:2.2}
.m-gr .hn.pk rect,.m-gr .hn.pk circle{fill:var(--cand-soft);stroke:var(--cand);stroke-width:3.5}
.m-gr .hn.hl rect,.m-gr .hn.hl circle{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3.5}
.m-gr .hn.nw{animation:gr-pop .5s ease both;transform-box:fill-box;transform-origin:center}
.m-gr .hn .sym{font:700 16px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.m-gr .hn .iw{font:600 11.5px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.m-gr .hn .fw{font:500 11px var(--mono);fill:var(--ink2);text-anchor:middle}
.m-gr .hn .cw{font:700 13px var(--mono);fill:var(--ok);text-anchor:middle}
.m-gr .sym-table{display:grid;gap:6px}
.m-gr .sym-row{display:flex;gap:8px;align-items:center}
.m-gr .sym-row input{min-height:40px}
.m-gr .sym-row input.hs{width:56px;text-align:center;font-family:var(--mono);font-weight:700}
.m-gr .sym-row input.hf{width:100px}
.m-gr .sym-row .btn{min-height:40px;padding:4px 12px}
.m-gr .ct{width:100%;border-collapse:collapse;font:500 .9rem var(--mono)}
.m-gr .ct th{font:600 .76rem var(--sans);color:var(--ink2);text-align:left;padding:4px 8px}
.m-gr .ct td{padding:3px 8px;border-top:1px solid var(--rule)}
.m-gr .ct td.cw{font-weight:700;color:var(--ok)}
.m-gr .stat-line{font:500 .9rem/1.8 var(--mono);overflow-wrap:anywhere}
.m-gr .stat-line b{font-size:1.05em}
.m-gr .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px}
.m-gr .tools .card{display:grid;gap:10px;align-content:start}
.m-gr .tool-in{display:flex;gap:8px;flex-wrap:wrap}
.m-gr .tool-in input{flex:1 1 180px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-family:var(--mono)}
.m-gr .out{font:700 1.15rem var(--mono);overflow-wrap:anywhere;min-height:1.6em}
.m-gr .bits{font:600 1.05rem var(--mono);letter-spacing:.08em;overflow-wrap:anywhere}
.m-gr .bits span{opacity:.4}
.m-gr .bits span.done{opacity:1;color:var(--ok)}
.m-gr .bits span.now{opacity:1;color:var(--cand);text-decoration:underline}
.m-gr .sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.m-gr .sum-grid .card{display:grid;gap:4px}
.m-gr .sum-grid .card b{font-size:1.05rem}
.m-gr .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.m-gr table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
.m-gr .cmp th,.m-gr .cmp td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.m-gr .cmp thead th{background:var(--surface2);font-weight:700}
.m-gr .cmp tbody th{color:var(--ink2);font-weight:600;white-space:nowrap}
.m-gr .cmp tr:last-child>*{border-bottom:0}
.m-gr .pitfalls{display:grid;gap:8px}
.m-gr .pit{background:var(--cand-soft);border-left:5px solid var(--cand);padding:10px 14px;border-radius:6px}
.m-gr h2.sec{font-size:1.4rem;margin-block:28px 12px}
.m-gr h2.sec:first-child{margin-top:0}
.m-gr .score{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.m-gr .score .num{font:700 1.5rem var(--mono)}
.m-gr .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1 1 200px}
.m-gr .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.m-gr .qlist{display:grid;gap:14px;margin-top:14px}
.m-gr .q{display:grid;gap:10px}
.m-gr .q-head{display:flex;gap:10px;align-items:baseline}
.m-gr .q-no{font:700 .9rem var(--mono);color:var(--ink2)}
.m-gr .q-tag{font:600 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:auto;white-space:nowrap}
.m-gr .q-text{font-weight:600}
.m-gr .qsvg{width:min(100%,420px);height:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.m-gr .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.m-gr .opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;min-height:44px}
.m-gr .opt:hover:not(:disabled){border-color:var(--accent)}
.m-gr .opt:disabled{cursor:default}
.m-gr .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.m-gr .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m-gr .q-exp{font-size:.94rem;padding:8px 12px;border-radius:6px;background:var(--surface2)}
.m-gr .foot{margin-top:40px;font-size:.82rem;color:var(--ink2);text-align:center}
@keyframes gr-march{to{stroke-dashoffset:-24}}
@keyframes gr-flash{50%{opacity:.2}}
@keyframes gr-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes gr-drop{from{transform:translateY(-64px);opacity:0}65%{transform:translateY(5px);opacity:1}to{transform:none;opacity:1}}
@keyframes gr-lift{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.m-gr *,.m-gr *::before,.m-gr *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.m-gr.m-gr.m-gr.m-gr{--bg:var(--ap-bg);--surface:var(--ap-surface);--surface2:var(--ap-surface2);--ink:var(--ap-ink);--line:var(--ap-line);--accent:var(--ap-accent);--accent-soft:var(--ap-accent-soft);--accent-ink:var(--ap-accent-ink);--shadow:var(--ap-shadow);--mono:var(--ap-mono);--ink2:var(--ap-ink2);--ok:var(--ap-ok);--ok-soft:var(--ap-ok-soft);--bad:var(--ap-bad);--bad-soft:var(--ap-bad-soft);--cand:var(--ap-cand);--cand-soft:var(--ap-cand-soft);--sans:var(--ap-sans);padding:0;background:transparent}
/* modules.css — สไตล์ของส่วนที่เขียนใหม่ (หน้าเรียนเพิ่มเติม, ควิซกลาง, เกม, Part 3, cheat sheet, พิมพ์) */

/* ---------- ทั่วไป ---------- */
.ap-sec{margin-top:8px}
.ap-n{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;margin-right:.55em;border-radius:7px;background:var(--ap-ink);color:var(--ap-bg);font:700 .78em var(--ap-mono);vertical-align:.08em}
.ap-learn{max-width:980px}
.ap-learn p{margin:.4em 0 .8em}
.ap-learn ul,.ap-learn ol{padding-left:1.3em}
.ap-learn li{margin:.2em 0}
.ap-chip.new{background:var(--ap-accent-soft);border-color:var(--ap-accent);color:var(--ap-accent);font-weight:700}
.ap-note.extra{border-left-color:var(--ap-accent);background:var(--ap-accent-soft)}
.ap-note p:last-child,.ap-note ul:last-child{margin-bottom:0}
.ap-fs{border:1px solid var(--ap-line);border-radius:8px;margin:0 0 10px;padding:8px 12px}
.ap-fs legend{font:700 .8rem var(--ap-mono);padding:0 6px}
.ap-hero-prog{display:flex;align-items:center;gap:12px;max-width:520px;font-size:.88rem;color:var(--ap-ink2)}
.ap-hero-prog .ap-bar{flex:1}
.ap-tool{display:grid;gap:4px;align-content:start;text-decoration:none;color:var(--ap-ink);transition:transform .15s,border-color .15s}
.ap-tool:hover{transform:translateY(-2px);border-color:var(--ap-accent)}
.ap-gt{font:600 1.05rem var(--ap-display)}
.ap-steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin:10px 0}
.ap-steps4>div{background:var(--ap-surface);border:1px solid var(--ap-line);border-radius:var(--ap-radius);padding:10px 12px;font-size:.93rem}
.ap-steps4 b{display:block;font:700 1.3rem var(--ap-display);color:var(--ap-accent)}
.ap-idea{padding-left:1.4em}
.ap-pre,.ap-prob pre,.gp-stmt pre,details.gp-sol pre{font:500 .86rem/1.55 var(--ap-mono);background:var(--ap-surface2);border:1px solid var(--ap-line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:.6em 0}
.ap-prob code,.gp-stmt code{font-family:var(--ap-mono);font-size:.9em;background:var(--ap-surface2);padding:0 .3em;border-radius:4px}
.ap-prob pre code,.gp-stmt pre code,details.gp-sol pre code{background:none;padding:0}
details.gp-sol{border:1px solid var(--ap-line);border-radius:10px;background:var(--ap-surface);padding:2px 14px;margin:14px 0}
details.gp-sol summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--ap-accent)}
details.gp-sol[open] summary{border-bottom:1px solid var(--ap-line);margin-bottom:8px}
.gp-mini{border-collapse:collapse;font-size:.9rem;margin:8px 0}
.gp-mini th,.gp-mini td{border:1px solid var(--ap-line);padding:5px 10px;text-align:left}
.ap-cheatbox dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0}
.ap-cheatbox dt{font-weight:700;color:var(--ap-ink2);font-size:.86rem}
.ap-cheatbox dd{margin:0}
.ap-after{margin-top:20px;display:grid;gap:12px}
.ap-cta{margin-top:30px}
.ap-body{min-height:200px}
.ap-tool.ap-card b{display:block}

/* ---------- ตาราง DP ที่คำนวณสด ---------- */
.ap-dpt{border-collapse:separate;border-spacing:0;font:500 .92rem var(--ap-mono);margin:10px 0}
.ap-dpt th,.ap-dpt td{border:1px solid var(--ap-line);padding:6px 10px;text-align:center;min-width:2.6em;background:var(--ap-surface)}
.ap-dpt thead th,.ap-dpt tbody th{background:var(--ap-surface2);font-weight:700;color:var(--ap-ink2)}
.ap-dpt tbody th{text-align:left;white-space:nowrap}
.ap-dpt td.pick{background:var(--ap-ok-soft);color:var(--ap-ok);font-weight:700}
.ap-dpt td.coin{background:var(--ap-cand-soft)}
.ap-dpt td.coin::after{content:"●";color:var(--ap-cand);font-size:.6em;margin-left:3px;vertical-align:top}
.ap-cheat td.ap-mono,.ap-cheat th{font-size:.86rem}

/* ---------- ควิซกลาง ---------- */
.ap-opt.picked{border-color:var(--ap-accent);background:var(--ap-accent-soft)}
.ap-qz-time{font:700 .95rem var(--ap-mono);color:var(--ap-ink)}
.ap-qz-time.low{color:var(--ap-bad)}
.ap-why{margin-top:6px;font-weight:400;color:var(--ap-ink2)}
.ap-qz-graph{display:block;width:100%;max-width:520px;margin:8px auto;background:var(--ap-surface2);border-radius:8px}
.ap-score.ok{color:var(--ap-ok)}
.ap-score{margin:0}
.ap-qz-src{margin-bottom:4px}

/* ---------- เกม ---------- */
.ap-hud{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 14px;border:1px solid var(--ap-line);border-radius:10px;background:var(--ap-surface);font:600 .92rem var(--ap-mono);margin-bottom:14px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:15}
.ap-hud b{color:var(--ap-accent)}
.ap-gin{margin:6px 0 4px}
.ap-gask{margin:6px 0 10px}
.ap-gtab td.blank{padding:2px}
.ap-gtab td.blank input{width:4.2em;min-height:34px;text-align:center;border:2px dashed var(--ap-accent);border-radius:6px;background:var(--ap-accent-soft);font:600 .95rem var(--ap-mono)}
.ap-gtab td.blank.right input{border:2px solid var(--ap-ok);background:var(--ap-ok-soft)}
.ap-gtab td.blank.wrong input{border:2px solid var(--ap-bad);background:var(--ap-bad-soft)}
.ap-gtab td.blank .ans{display:block;font-size:.72rem;color:var(--ap-ok);font-weight:700}
.ap-mini-grid{display:inline-grid;gap:3px;margin:4px 10px 4px 0;vertical-align:middle}
.ap-mini-grid div{display:flex;gap:3px}
.ap-mini-grid i{width:20px;height:20px;border:1px solid var(--ap-line);border-radius:4px;background:var(--ap-surface2)}
.ap-mini-grid i.c{background:var(--ap-cand-soft);border-color:var(--ap-cand);position:relative}
.ap-mini-grid i.c::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ap-cand)}
.ap-mini-tab{font:500 .9rem/1.7 var(--ap-mono);background:var(--ap-surface2);border-radius:8px;padding:6px 12px;display:inline-block;margin-top:4px}
.ap-gfb{margin-top:12px}
.ap-ag{display:block;width:100%;max-width:640px;margin:6px auto;background:var(--ap-surface2);border-radius:10px;touch-action:manipulation}
.ap-ag .ag-e{cursor:pointer}
.ap-ag .ag-e .ln{stroke:var(--ap-ink3);stroke-width:2.5;fill:none}
.ap-ag .ag-e .hit{stroke:transparent;stroke-width:22}
.ap-ag .ag-e:hover .ln,.ap-ag .ag-e:focus-visible .ln{stroke:var(--ap-accent)}
.ap-ag .ag-e.acc .ln{stroke:var(--ap-ok);stroke-width:5}
.ap-ag .ag-e.off .ln{stroke:var(--ap-bad);stroke-dasharray:5 5;opacity:.55}
.ap-ag .wbg{fill:var(--ap-surface);stroke:var(--ap-line)}
.ap-ag .wt{font:700 12px var(--ap-mono);fill:var(--ap-ink);pointer-events:none}
.ap-ag .ag-n circle{fill:var(--ap-surface);stroke:var(--ap-ink2);stroke-width:2.5}
.ap-ag .ag-n text{font:700 15px var(--ap-mono);fill:var(--ap-ink);pointer-events:none}
.ap-ag .ag-n.in circle{fill:var(--ap-ok-soft);stroke:var(--ap-ok)}
.ap-ag .ag-n.src circle{stroke:var(--ap-accent);stroke-width:4}
.ap-ag .ag-n .dv{font:700 12px var(--ap-mono);fill:var(--ap-accent)}
svg.ap-ag [data-n]{cursor:default}
.ap-match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px 18px}
.ap-match .col{display:grid;gap:8px;align-content:start}
.ap-mc{text-align:left;min-height:44px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--ap-line);background:var(--ap-surface);cursor:pointer;font-size:.92rem;line-height:1.4}
.ap-mc.r{font-family:var(--ap-mono);font-size:.84rem}
.ap-mc:hover:not(:disabled){border-color:var(--ap-accent)}
.ap-mc.sel{border-color:var(--ap-accent);background:var(--ap-accent-soft);box-shadow:0 0 0 2px var(--ap-accent) inset}
.ap-mc.done{border-color:var(--ap-ok);background:var(--ap-ok-soft);opacity:.85}
.ap-mc.shake{animation:ap-shake .35s}
@keyframes ap-shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
@media (max-width:560px){.ap-match{grid-template-columns:1fr}}

/* ---------- Part 3: อนิเมชัน DTM / NTM / TSP ---------- */
.tm-svg{display:block;width:100%;max-width:720px;margin:0 auto;height:auto}
.tm-cnt{text-align:center;font:600 .95rem var(--ap-mono);margin-top:6px;min-height:1.6em}
.tm-e{stroke:var(--ap-line);stroke-width:2}
.tm-e.on{stroke:var(--ap-accent);stroke-width:4}
.tm-n circle{fill:var(--ap-surface);stroke:var(--ap-ink3);stroke-width:2;transition:fill .25s,stroke .25s}
.tm-n.act circle{fill:var(--ap-cand-soft);stroke:var(--ap-cand)}
.tm-n.on circle{fill:var(--ap-accent-soft);stroke:var(--ap-accent)}
.tm-n.dead circle{fill:var(--ap-bad-soft);stroke:var(--ap-bad)}
.tm-n.acc circle{fill:var(--ap-ok-soft);stroke:var(--ap-ok);stroke-width:3.5}
.tm-n text{font:700 13px var(--ap-mono);fill:var(--ap-ink);pointer-events:none}
.tm-n.dead text{fill:var(--ap-bad)}
.tm-n.acc text{fill:var(--ap-ok);font-size:16px}
.tm-n.leaf{cursor:pointer}
.tsp-c circle{fill:var(--ap-surface);stroke:var(--ap-ink2);stroke-width:2.5}
.tsp-c.home circle{fill:var(--ap-accent-soft);stroke:var(--ap-accent)}
.tsp-c text{font:700 13px var(--ap-mono);fill:var(--ap-ink)}
.tsp-cur{fill:none;stroke:var(--ap-cand);stroke-width:3.5;stroke-linejoin:round}
.tsp-best{fill:var(--ap-ok-soft);fill-opacity:.35;stroke:var(--ap-ok);stroke-width:5;stroke-linejoin:round;opacity:.9}
.gr-bars{display:grid;gap:10px;margin:14px 0 6px}
.gr-b{display:grid;grid-template-columns:5.5em 1fr minmax(8em,auto);gap:10px;align-items:center;font:600 .86rem var(--ap-mono)}
.gr-b .trk{height:16px;border-radius:8px;background:var(--ap-surface2);overflow:hidden}
.gr-b .fill{height:100%;border-radius:8px;transition:width .3s}
.gr-b.poly .fill{background:var(--ap-ok)}.gr-b.exp .fill{background:var(--ap-cand)}.gr-b.fact .fill{background:var(--ap-bad)}
.gr-b .v{text-align:right;color:var(--ap-ink2)}
@media (max-width:520px){.gr-b{grid-template-columns:4.5em 1fr}.gr-b .v{grid-column:1/-1;text-align:left}}

/* ---------- อนิเมชันโจทย์ Greedy (ga-*) และเดโมเกณฑ์ ---------- */
.ga{display:block;width:100%;height:auto}
.ga-axis{stroke:var(--ap-ink3);stroke-width:1.5}
.ga-tick{font:500 11px var(--ap-mono);fill:var(--ap-ink3);text-anchor:middle}
.ga-lab{font:600 11.5px var(--ap-sans);fill:var(--ap-ink)}
.ga-big{font:700 20px var(--ap-mono);fill:var(--ap-ink);text-anchor:middle}
.ga-mark{stroke:var(--ap-accent);stroke-width:2;stroke-dasharray:4 3}
.ga-marklab{font:700 11.5px var(--ap-mono);fill:var(--ap-accent)}
.ga-bar,.ga-chip,.ga-slot,.ga-bag{fill:var(--ap-surface2);stroke:var(--ap-ink3);stroke-width:1.2}
.ga-bag{fill:none;stroke-width:2;stroke-dasharray:5 4}
.ga-bar.ok,.ga-chip.ok,.ga-slot.ok{fill:var(--ap-ok-soft);stroke:var(--ap-ok)}
.ga-bar.cand,.ga-chip.cand,.ga-slot.cand{fill:var(--ap-cand-soft);stroke:var(--ap-cand)}
.ga-bar.bad,.ga-chip.bad{fill:var(--ap-bad-soft);stroke:var(--ap-bad);stroke-dasharray:4 3}
.ga-cover{fill:var(--ap-accent-soft);stroke:var(--ap-accent);opacity:.75}
.ga-tower{fill:var(--ap-accent)}
.ga-house{fill:var(--ap-surface2);stroke:var(--ap-ink2);stroke-width:2}
.ga-house.ok{fill:var(--ap-ok);stroke:var(--ap-ok)}.ga-house.cand{fill:var(--ap-cand);stroke:var(--ap-cand)}
.ap-crit{display:block;width:100%;height:auto}
.gp-anim .m-gr,.ap-card .m-gr{margin-top:10px}

<script>
/* base.js — namespace กลาง AP, storage คีย์เดียว, ตัวช่วยเล็ก ๆ */
window.AP = (function () {
  'use strict';
  const KEY = 'algoprep:v1';
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { mem = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ใช้ storage ไม่ได้ก็ทำงานต่อได้ */ } };
  const store = {
    get(k, d) { return mem[k] === undefined ? d : JSON.parse(JSON.stringify(mem[k])); },
    set(k, v) { mem[k] = v; save(); },
    clear() { mem = { theme: mem.theme }; save(); },
    keys() { return Object.keys(mem); },
    // storage แยกชื่อสำหรับแต่ละโมดูล (โค้ดเดิมเรียก get/set แบบเดิมได้)
    ns(p) { return { get: (k, d) => store.get(p + ':' + k, d), set: (k, v) => store.set(p + ':' + k, v) }; },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'ap-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว ✓'); return true; } catch (e) { toast('คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความแล้วกด Ctrl+C'); return false; }
  }
  // ปุ่มยืนยันในหน้า (เว็บนี้ใช้ confirm() ไม่ได้): กดครั้งแรกเปลี่ยนข้อความ กดซ้ำภายใน 4 วิถึงทำจริง
  function confirmBtn(btn, label, fn) {
    if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
    btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 4000);
  }
  // ความคืบหน้าต่อบท {v: เคยเปิด, q: คะแนนควิซดีที่สุด 0..1, n: จำนวนครั้งที่ทำควิซ}
  const prog = {
    all() { return store.get('prog', {}); },
    get(id) { return store.get('prog', {})[id] || null; },
    touch(id) { const a = store.get('prog', {}); if (!a[id]) { a[id] = { v: 1, q: 0, n: 0 }; store.set('prog', a); } },
    quiz(id, ratio) { const a = store.get('prog', {}); const p = a[id] || { v: 1, q: 0, n: 0 }; p.q = Math.max(p.q || 0, ratio); p.n = (p.n || 0) + 1; a[id] = p; store.set('prog', a); },
    status(id) { const p = prog.get(id); return !p ? 'new' : p.q >= 0.6 ? 'passed' : 'started'; },
  };
  return {
    store, esc, shuffle, rnd, toast, copy, confirmBtn, prog,
    hooks: {},               // shell ใส่ callback เช่น onProgress
    progress() { if (this.hooks.onProgress) this.hooks.onProgress(); },
    RM: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
  };
})();

/* engines.js — อัลกอริทึม DP ทุกตัว คืนค่าเป็น "รายการสเต็ป" (ไม่ผูกกับ DOM)
 *
 * step = {
 *   tables: [{name, corner, cols[], rows[], cells[[{t,c}]], kind, colCls[], rowCls[]}],
 *   svg:    {type:'tree'|'graph', ...} | undefined,
 *   note:   HTML อธิบายสเต็ป,
 *   line:   เลขบรรทัด pseudocode ที่กำลังทำงาน (int | int[] | -1),
 *   ask:    {q, answer, hide:[[tableIdx,r,c]], hideNodes:[id], hints:[], hint, choices?, noType?, fmt?}
 * }
 * class ของช่อง: cur (กำลังคำนวณ) · dep (ถูกอ้างอิง) · pick (คำตอบ) · piv (แถว/คอลัมน์หลัก)
 *               hit (ดึงจาก memo) · empty (ยังว่าง) · coin (มีเหรียญ)
 */
(function (root) {
  'use strict';
  const INF = Infinity;
  const r6 = (x) => Math.round(x * 1e6) / 1e6;
  const fmt = (x) => (x === INF ? '∞' : String(r6(x)));
  const LET = 'abcdefghij';

  /* ---------- helpers ---------- */
  class Hl {
    constructor() { this.m = {}; }
    add(r, c, cls) { const k = r + ',' + c; this.m[k] = this.m[k] ? this.m[k] + ' ' + cls : cls; return this; }
    get(r, c) { return this.m[r + ',' + c] || ''; }
  }
  function tbl(name, cols, rows, fn, o) {
    const cells = rows.map((_, r) => cols.map((_, c) => {
      const v = fn(r, c) || {};
      return { t: v.t == null ? '' : String(v.t), c: v.c || '' };
    }));
    return Object.assign({ name, cols, rows, cells, kind: 'row' }, o || {});
  }
  const range = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };
  const M = (a) => a.map((r) => r.slice());
  const ask = (q, answer, hide, hints, hint, extra) => Object.assign({ q, answer, hide, hints: hints || [], hint }, extra || {});
  const list = (a) => a.join(', ');

  /* ---------- pseudocode (ตามสไลด์) ---------- */
  const CODE = {
    fibNaive: ['Fib(n):', '  if n ≤ 1: return n', '  return Fib(n−1) + Fib(n−2)'],
    fibMemo: ['Fib(n):', '  if n ≤ 1: return n', '  if memo[n] มีค่าแล้ว: return memo[n]', '  memo[n] ← Fib(n−1) + Fib(n−2)', '  return memo[n]'],
    fibTable: ['F[0] ← 0;  F[1] ← 1', 'for i ← 2 to n do', '    F[i] ← F[i−1] + F[i−2]', 'return F[n]'],
    coinrow: ['F[0] ← 0;  F[1] ← C[1]', 'for i ← 2 to n do', '    F[i] ← max(C[i] + F[i−2], F[i−1])', 'return F[n]'],
    change: ['F[0] ← 0', 'for i ← 1 to n do', '    temp ← ∞;  j ← 1', '    while j ≤ m and i ≥ D[j] do', '        temp ← min(F[i − D[j]], temp)', '        j ← j + 1', '    F[i] ← temp + 1', 'return F[n]'],
    collect: ['F[1,1] ← C[1,1]', 'for j ← 2 to m do  F[1,j] ← F[1,j−1] + C[1,j]', 'for i ← 2 to n do', '    F[i,1] ← F[i−1,1] + C[i,1]', '    for j ← 2 to m do', '        F[i,j] ← max(F[i−1,j], F[i,j−1]) + C[i,j]', 'return F[n,m]'],
    olympic: ['z[0] ← จริง', 'for i ← 1 to n do', '    z[i] ← มี d ใน D ที่ i ≥ d และ z[i − d] เป็นจริง', 'แสดงทุก i ที่ z[i] เป็นจริง'],
    knap: ['F[0,j] ← 0;  F[i,0] ← 0', 'for i ← 1 to n do', '    for j ← 1 to W do', '        if j < w[i]:  F[i,j] ← F[i−1,j]', '        else:  F[i,j] ← max(F[i−1,j], v[i] + F[i−1,j−w[i]])', 'return F[n,W]'],
    mfk: ['MFKnapsack(i, j):', '  if F[i,j] < 0:                 // ยังไม่เคยคำนวณ', '    if j < w[i]:', '      value ← MFKnapsack(i−1, j)', '    else:', '      value ← max(MFKnapsack(i−1, j), v[i] + MFKnapsack(i−1, j−w[i]))', '    F[i,j] ← value', '  return F[i,j]'],
    obst: ['for i ← 1 to n do', '    C[i,i−1] ← 0;  C[i,i] ← P[i];  R[i,i] ← i', 'C[n+1,n] ← 0', 'for d ← 1 to n−1 do            // ไล่ทีละเส้นทแยง', '    for i ← 1 to n−d do', '        j ← i + d;  minval ← ∞', '        for k ← i to j do', '            if C[i,k−1] + C[k+1,j] < minval:', '                minval ← C[i,k−1] + C[k+1,j];  kmin ← k', '        R[i,j] ← kmin', '        C[i,j] ← minval + (P[i] + … + P[j])', 'return C[1,n], R'],
    warshall: ['R(0) ← A', 'for k ← 1 to n do', '    for i ← 1 to n do', '        for j ← 1 to n do', '            R[i,j] ← R[i,j]  or  (R[i,k]  and  R[k,j])', 'return R(n)'],
    floyd: ['D ← W', 'for k ← 1 to n do', '    for i ← 1 to n do', '        for j ← 1 to n do', '            D[i,j] ← min(D[i,j], D[i,k] + D[k,j])', 'return D'],
  };

  /* ---------- 0. Fibonacci ---------- */
  function fibTable(n) {
    const F = [], steps = [], cols = range(0, n);
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('ตาราง F(n)', cols, ['F'], (r, c) => (F[c] === undefined ? { t: '', c: 'empty ' + hl.get(0, c) } : { t: F[c], c: hl.get(0, c) }), { corner: 'n' })],
      note, line, ask: a,
    });
    snap(new Hl(), `ต้องการ <b>F(${n})</b> — สร้างตารางว่างขนาด ${n + 1} ช่อง แล้วเติมจากซ้ายไปขวา`, -1);
    F[0] = 0; F[1] = 1;
    snap(new Hl().add(0, 0, 'cur').add(0, 1, 'cur'), 'ค่าเริ่มต้น (base case): <b>F(0) = 0</b> และ <b>F(1) = 1</b>', 0);
    for (let i = 2; i <= n; i++) {
      F[i] = F[i - 1] + F[i - 2];
      snap(new Hl().add(0, i, 'cur').add(0, i - 1, 'dep').add(0, i - 2, 'dep'),
        `F(${i}) = F(${i - 1}) + F(${i - 2}) = ${F[i - 1]} + ${F[i - 2]} = <b>${F[i]}</b> · ใช้ค่าที่จดไว้แล้ว ไม่ต้องคำนวณซ้ำ`, [1, 2],
        ask(`F(${i}) = ?`, F[i], [[0, 0, i]], [F[i - 1], F[i - 2], F[i - 1] * 2], `F(${i}) = F(${i - 1}) + F(${i - 2}) — ดูสองช่องสีเหลือง`));
    }
    const h = new Hl(); cols.forEach((c) => h.add(0, c, 'pick'));
    snap(h, `ได้ <b>F(${n}) = ${F[n]}</b> · ใช้การบวกเพียง ${n - 1} ครั้ง (เวลา Θ(n)) เทียบกับการเรียกซ้ำตรง ๆ ที่ต้องเรียก ${naiveCalls(n)} ครั้ง`, 3);
    return { steps, result: { value: F[n] } };
  }
  function naiveCalls(n) { return n < 2 ? 1 : 1 + naiveCalls(n - 1) + naiveCalls(n - 2); }

  function fibTree(n, memo) {
    let id = 0;
    const nodes = [], events = [], memoT = {};
    function rec(k, depth) {
      const nd = { id: id++, k, depth, ch: [], val: null };
      nodes.push(nd);
      if (k < 2) { nd.val = k; events.push({ t: 'leaf', nd }); return nd; }
      if (memo && k in memoT) { nd.val = memoT[k]; events.push({ t: 'hit', nd }); return nd; }
      events.push({ t: 'call', nd });
      nd.ch.push(rec(k - 1, depth + 1));
      nd.ch.push(rec(k - 2, depth + 1));
      nd.val = nd.ch[0].val + nd.ch[1].val;
      if (memo) memoT[k] = nd.val;
      events.push({ t: 'ret', nd });
      return nd;
    }
    const root = rec(n, 0);
    let leaf = 0, maxD = 0;
    (function lay(nd) {
      maxD = Math.max(maxD, nd.depth);
      if (!nd.ch.length) nd.x = leaf++;
      else { nd.ch.forEach(lay); nd.x = (nd.ch[0].x + nd.ch[nd.ch.length - 1].x) / 2; }
    })(root);
    const DX = 56, DY = 66, PAD = 36;
    const W = Math.max(220, (leaf - 1) * DX + PAD * 2), H = maxD * DY + PAD * 2 + 10;
    const edges = [];
    nodes.forEach((nd) => nd.ch.forEach((c) => edges.push([nd.id, c.id])));

    const state = nodes.map(() => 'hidden');
    const seen = {};
    const steps = [];
    const snap = (note, line, a) => {
      const shown = nodes.filter((nd) => state[nd.id] !== 'hidden');
      const cnt = {}; shown.forEach((nd) => { cnt[nd.k] = (cnt[nd.k] || 0) + 1; });
      steps.push({
        tables: [],
        svg: {
          type: 'tree', w: W, h: H,
          nodes: nodes.map((nd) => {
            const s = state[nd.id];
            let cls = s;
            if (!memo && s === 'done' && cnt[nd.k] > 1 && nd.k > 1) cls = 'dupe';
            if (!memo && s !== 'hidden' && s !== 'call' && cnt[nd.k] > 1 && nd.k <= 1) cls = 'dupe';
            return { id: nd.id, x: PAD + nd.x * DX, y: PAD + nd.depth * DY, label: `F(${nd.k})`, sub: s === 'done' || s === 'hit' ? String(nd.val) : (s === 'call' ? '…' : ''), cls };
          }),
          edges: edges.filter(([a, b]) => state[b] !== 'hidden').map(([a, b]) => ({ a, b })),
        },
        note, line, ask: a,
      });
    };
    snap(`ต้องการ <b>F(${n})</b> — ${memo ? 'เรียกแบบเรียกซ้ำ แต่คอยจดผลลัพธ์ (memo) ไว้' : 'เรียกซ้ำตามสูตรตรง ๆ ดูว่าเกิดอะไรขึ้น'}`, 0);
    let calls = 0;
    events.forEach((e) => {
      const nd = e.nd, k = nd.k;
      calls++;
      if (e.t === 'call') { state[nd.id] = 'call'; snap(`เรียก <b>F(${k})</b> → ยังไม่รู้ค่า ต้องเรียก F(${k - 1}) และ F(${k - 2}) ก่อน`, memo ? [2, 3] : 2); }
      else if (e.t === 'leaf') { state[nd.id] = 'done'; snap(`F(${k}) = ${k} (base case คืนค่าทันที)`, 1); }
      else if (e.t === 'hit') { state[nd.id] = 'hit'; snap(`<b>F(${k}) เคยคำนวณไว้แล้ว</b> → ดึงจาก memo = ${nd.val} ทันที ไม่ต้องเรียกลึกต่อ`, [2]); }
      else {
        state[nd.id] = 'done';
        const a = nd.ch[0].val, b = nd.ch[1].val;
        snap(`F(${k}) = F(${k - 1}) + F(${k - 2}) = ${a} + ${b} = <b>${nd.val}</b> แล้วส่งค่ากลับขึ้นไป`, memo ? [3, 4] : 2,
          Object.assign(ask(`F(${k}) = ?`, nd.val, [], [a, b, a * 2], `F(${k}) = F(${k - 1}) + F(${k - 2}) — บวกค่าของสองกิ่งลูกที่อยู่ด้านล่าง`), { hideNodes: [nd.id] }));
      }
    });
    // สรุป
    const cnt = {}; nodes.forEach((nd) => { cnt[nd.k] = (cnt[nd.k] || 0) + 1; });
    const total = nodes.length;
    let summary;
    if (!memo) {
      const rep = Object.keys(cnt).filter((k) => cnt[k] > 1).map((k) => `F(${k}) ถูกคำนวณ ${cnt[k]} ครั้ง`);
      summary = `เรียกทั้งหมด <b>${total} ครั้ง</b> แต่มีค่าต่างกันเพียง ${n + 1} ค่า · ${rep.length ? 'ซ้ำ: ' + rep.join(' · ') : ''}<br>โหนดสีเหลืองคือ<b>ปัญหาย่อยที่ซ้อนทับ</b> — จุดที่ DP เข้ามาช่วย`;
    } else {
      summary = `เรียกทั้งหมด <b>${total} ครั้ง</b> (ถ้าไม่จำค่าต้องเรียก ${naiveCalls(n)} ครั้ง) · โหนดสีเขียวคือครั้งที่ดึงจาก memo แทนการคำนวณใหม่ — เหลือคำนวณจริงเพียง ${n + 1} ค่า`;
    }
    snap(`ได้ <b>F(${n}) = ${root.val}</b><br>${summary}`, -1);
    return { steps, result: { value: root.val, calls: total } };
  }

  /* ---------- 1. Coin-row ---------- */
  function coinRow(C) {
    const n = C.length, F = [], steps = [], cols = range(0, n);
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('ตาราง', cols, ['C (ค่าเหรียญ)', 'F'], (r, c) => {
        const cls = hl.get(r, c);
        if (r === 0) return c === 0 ? { t: '', c: 'empty ' + cls } : { t: C[c - 1], c: cls };
        return F[c] === undefined ? { t: '', c: 'empty ' + cls } : { t: F[c], c: cls };
      }, { corner: 'index' })],
      note, line, ask: a,
    });
    snap(new Hl(), `แถวเหรียญ C = [${list(C)}] · F[i] = "ค่ามากสุดที่หยิบได้จากเหรียญ 1..i โดยไม่หยิบติดกัน"`, -1);
    F[0] = 0; F[1] = C[0];
    snap(new Hl().add(1, 0, 'cur').add(1, 1, 'cur').add(0, 1, 'dep'), `ค่าเริ่มต้น: F[0] = 0 (ไม่มีเหรียญ) และ F[1] = C[1] = ${C[0]} (มีเหรียญเดียว หยิบเลย)`, 0);
    for (let i = 2; i <= n; i++) {
      const take = C[i - 1] + F[i - 2], skip = F[i - 1];
      F[i] = Math.max(take, skip);
      snap(new Hl().add(1, i, 'cur').add(0, i, 'dep').add(1, i - 2, 'dep').add(1, i - 1, 'dep'),
        `F[${i}] = max{ C[${i}] + F[${i - 2}], F[${i - 1}] } = max{ ${C[i - 1]} + ${F[i - 2]}, ${F[i - 1]} } = max{ ${take}, ${skip} } = <b>${F[i]}</b><br>${take >= skip ? `→ <b>หยิบ</b>เหรียญที่ ${i} (ได้ ${take})` : `→ <b>ข้าม</b>เหรียญที่ ${i} (ได้ ${skip} ดีกว่า)`}`, [1, 2],
        ask(`F[${i}] = ?`, F[i], [[0, 1, i]], [take, skip, C[i - 1] + F[i - 1]], `F[${i}] = max{ C[${i}] + F[${i - 2}], F[${i - 1}] } — ตัวเลือก "หยิบ" ต้องข้ามเหรียญ ${i - 1}`));
    }
    const picks = []; const h = new Hl();
    for (let i = n; i >= 1;) {
      if (i === 1 || C[i - 1] + F[i - 2] >= F[i - 1]) { picks.push(i); h.add(0, i, 'pick'); i -= 2; } else i -= 1;
    }
    picks.reverse();
    h.add(1, n, 'pick');
    snap(h, `คำตอบ: <b>F[${n}] = ${F[n]}</b><br>ย้อนรอยจากท้าย: หยิบเหรียญที่ ${list(picks)} (ค่า ${list(picks.map((p) => C[p - 1]))}) รวม ${F[n]}`, 3);
    return { steps, result: { value: F[n], picks } };
  }

  /* ---------- 2. Change-making ---------- */
  function changeMaking(D, n) {
    const F = [], used = [], steps = [], cols = range(0, n);
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('ตาราง', cols, ['F (จำนวนเหรียญ)', 'เหรียญที่ใช้ล่าสุด'], (r, c) => {
        const cls = hl.get(r, c);
        const v = r === 0 ? F[c] : used[c];
        return v === undefined ? { t: '', c: 'empty ' + cls } : { t: v === null ? '–' : fmt(v), c: cls };
      }, { corner: 'ยอดเงิน i' })],
      note, line, ask: a,
    });
    snap(new Hl(), `เหรียญที่มี D = {${list(D)}} · ต้องการยอด n = ${n} · F[i] = "จำนวนเหรียญน้อยสุดที่รวมได้ i"`, -1);
    F[0] = 0; used[0] = null;
    snap(new Hl().add(0, 0, 'cur').add(1, 0, 'cur'), 'F[0] = 0 — ยอด 0 ไม่ต้องใช้เหรียญเลย', 0);
    for (let i = 1; i <= n; i++) {
      const cands = D.filter((d) => d <= i).map((d) => ({ d, v: F[i - d] + 1 }));
      let best = INF, bd = null;
      cands.forEach((c) => { if (c.v < best) { best = c.v; bd = c.d; } });
      F[i] = best; used[i] = bd;
      const hl = new Hl().add(0, i, 'cur').add(1, i, 'cur');
      cands.forEach((c) => hl.add(0, i - c.d, 'dep'));
      const expr = cands.length ? cands.map((c) => `F[${i - c.d}]+1`).join(', ') : '(ไม่มีเหรียญที่ใช้ได้)';
      const vals = cands.length ? cands.map((c) => fmt(c.v)).join(', ') : '∞';
      snap(hl, `F[${i}] = min{ ${expr} } = min{ ${vals} } = <b>${fmt(F[i])}</b>${bd ? `<br>→ ใช้เหรียญ <b>${bd}</b> เป็นเหรียญสุดท้าย` : ''}`, [1, 2, 3, 4, 5, 6],
        ask(`F[${i}] = ?`, F[i], [[0, 0, i], [0, 1, i]], cands.map((c) => c.v).concat(cands.map((c) => F[i - c.d])),
          `ลองเหรียญทีละชนิด: F[${i}] = min ของ F[${i} − d] + 1 (อย่าลืมบวก 1 สำหรับเหรียญที่เพิ่งใช้)`));
    }
    const h = new Hl(); const coins = [];
    if (F[n] < INF) for (let i = n; i > 0; i -= used[i]) { coins.push(used[i]); h.add(0, i, 'pick'); h.add(1, i, 'pick'); }
    h.add(0, 0, 'pick');
    let greedy = null;
    if (F[n] < INF) { let r = n, g = 0; [...D].reverse().forEach((d) => { g += Math.floor(r / d); r %= d; }); if (r === 0) greedy = g; }
    const gnote = greedy !== null && greedy > F[n] ? `<br>เทียบ: Greedy (หยิบเหรียญใหญ่สุดก่อน) ได้ ${greedy} เหรียญ — <b>แย่กว่า DP</b>` : '';
    snap(h, F[n] < INF ? `คำตอบ: <b>F[${n}] = ${F[n]}</b> เหรียญ · ย้อนรอย: ${coins.join(' + ')} = ${n}${gnote}` : `แลก ${n} ด้วยเหรียญชุดนี้<b>ไม่ได้</b> (F[${n}] = ∞) — ต้องมีเหรียญ 1 บาทจึงจะแลกได้ทุกยอด`, 7);
    return { steps, result: { value: F[n], coins, greedy } };
  }

  /* ---------- 3. Coin-collection ---------- */
  function coinCollect(C) {
    const n = C.length, m = C[0].length, F = range(0, n - 1).map(() => new Array(m).fill(null)), steps = [];
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('กระดาน (● = มีเหรียญ, ตัวเลข = F[i,j])', range(1, m), range(1, n), (r, c) => ({
        t: F[r][c] === null ? '' : F[r][c], c: (F[r][c] === null ? 'empty ' : '') + (C[r][c] ? 'coin ' : '') + hl.get(r, c),
      }), { corner: 'i \\ j', kind: 'grid' })],
      note, line, ask: a,
    });
    snap(new Hl(), `หุ่นยนต์เริ่มที่มุมซ้ายบน (1,1) เดินได้แค่ <b>ขวา</b> หรือ <b>ลง</b> ไปมุมขวาล่าง (${n},${m}) · F[i,j] = "เหรียญมากสุดที่เก็บได้เมื่อมาถึงช่อง (i,j)"`, -1);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < m; j++) {
        const c = C[i][j], hl = new Hl().add(i, j, 'cur');
        let note, line, hints, hint;
        if (i === 0 && j === 0) { F[0][0] = c; note = `F[1,1] = C[1,1] = <b>${c}</b> (จุดเริ่มต้น)`; line = 0; }
        else if (i === 0) {
          F[i][j] = F[i][j - 1] + c; hl.add(i, j - 1, 'dep'); line = 1;
          note = `แถวแรก มาได้ทางเดียวคือจาก<b>ซ้าย</b>: F[1,${j + 1}] = F[1,${j}] + C = ${F[i][j - 1]} + ${c} = <b>${F[i][j]}</b>`;
          hints = [F[i][j - 1], F[i][j - 1] + 1]; hint = 'แถวแรกมาจากช่องซ้ายเท่านั้น แล้วบวกเหรียญของช่องนี้ (0 หรือ 1)';
        } else if (j === 0) {
          F[i][j] = F[i - 1][j] + c; hl.add(i - 1, j, 'dep'); line = 3;
          note = `คอลัมน์แรก มาได้ทางเดียวคือจาก<b>บน</b>: F[${i + 1},1] = F[${i},1] + C = ${F[i - 1][j]} + ${c} = <b>${F[i][j]}</b>`;
          hints = [F[i - 1][j], F[i - 1][j] + 1]; hint = 'คอลัมน์แรกมาจากช่องบนเท่านั้น แล้วบวกเหรียญของช่องนี้ (0 หรือ 1)';
        } else {
          const up = F[i - 1][j], left = F[i][j - 1];
          F[i][j] = Math.max(up, left) + c; hl.add(i - 1, j, 'dep').add(i, j - 1, 'dep'); line = [2, 4, 5];
          note = `F[${i + 1},${j + 1}] = max{ บน ${up}, ซ้าย ${left} } + C = ${Math.max(up, left)} + ${c} = <b>${F[i][j]}</b>`;
          hints = [up, left, Math.max(up, left), up + left + c]; hint = 'เลือกทางที่ได้เหรียญสะสมมากกว่า (บน/ซ้าย) แล้วค่อยบวกเหรียญของช่องนี้';
        }
        snap(hl, note, line, i === 0 && j === 0 ? undefined : ask(`F[${i + 1},${j + 1}] = ?`, F[i][j], [[0, i, j]], hints, hint));
      }
    }
    const h = new Hl(); const path = [];
    for (let i = n - 1, j = m - 1; ;) {
      path.push([i, j]); h.add(i, j, 'pick');
      if (i === 0 && j === 0) break;
      if (i === 0) j--; else if (j === 0) i--; else if (F[i - 1][j] >= F[i][j - 1]) i--; else j--;
    }
    path.reverse();
    snap(h, `คำตอบ: <b>F[${n},${m}] = ${F[n - 1][m - 1]}</b> เหรียญ · ช่องสีเขียวคือเส้นทางที่ได้ (ย้อนจากมุมขวาล่าง โดยเลือกช่อง บน/ซ้าย ที่มีค่ามากกว่า)`, 6);
    return { steps, result: { value: F[n - 1][m - 1], path } };
  }

  /* ---------- 4. โจทย์ 6, 9, 20 ---------- */
  function olympic(D, n) {
    const z = [], steps = [], cols = range(0, n), dmin = Math.min(...D);
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('สร้างได้หรือไม่', cols, ['z[i]'], (r, c) => (z[c] === undefined ? { t: '', c: 'empty ' + hl.get(0, c) } : { t: z[c] ? '✓' : '–', c: (z[c] ? 'yes ' : 'no ') + hl.get(0, c) }), { corner: 'i' })],
      note, line, ask: a,
    });
    snap(new Hl(), `ตัวเลขที่ต้องการ: ผลรวมของ {${list(D)}} จำนวนกี่ตัวก็ได้ · z[i] = "สร้างเลข i ได้หรือไม่"`, -1);
    z[0] = true;
    snap(new Hl().add(0, 0, 'cur'), 'z[0] = ✓ (ไม่ใช้ตัวเลขใดเลย ได้ผลรวม 0)', 0);
    for (let i = 1; i <= n; i++) {
      const tests = D.filter((d) => d <= i).map((d) => ({ d, ok: z[i - d] }));
      z[i] = tests.some((t) => t.ok);
      const hl = new Hl().add(0, i, 'cur');
      tests.forEach((t) => hl.add(0, i - t.d, 'dep'));
      const why = tests.length ? tests.map((t) => `${i}−${t.d}=${i - t.d} (${t.ok ? '✓' : '✗'})`).join(', ') : 'เล็กกว่าทุกเลขในชุด';
      snap(hl, `เลข <b>${i}</b>: ${why} → <b>${z[i] ? 'สร้างได้' : 'สร้างไม่ได้'}</b>`, [1, 2],
        i >= dmin ? ask(`เลข ${i} สร้างได้หรือไม่?`, z[i] ? 1 : 0, [[0, 0, i]], [], `ดูว่ามี d ในชุดที่ z[${i} − d] เป็น ✓ หรือไม่ (ช่องสีเหลือง)`, { choices: [{ label: 'สร้างได้', value: 1 }, { label: 'สร้างไม่ได้', value: 0 }], noType: true }) : undefined);
    }
    const ok = cols.filter((i) => i > 0 && z[i]);
    const h = new Hl(); ok.forEach((i) => h.add(0, i, 'pick'));
    snap(h, ok.length ? `ตัวเลขที่สร้างได้ (≤ ${n}): <b>${list(ok)}</b>` : `ไม่มีเลขใด ≤ ${n} ที่สร้างได้`, 3);
    return { steps, result: { list: ok, z } };
  }

  /* ---------- 5. Knapsack ---------- */
  function knapsack(w, v, W) {
    const n = w.length, F = range(0, n).map(() => new Array(W + 1).fill(null)), steps = [];
    const rows = ['i = 0'].concat(range(1, n).map((i) => `i = ${i}  (w=${w[i - 1]}, v=${v[i - 1]})`));
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('F(i, j) — มูลค่ามากสุดเมื่อพิจารณาของ i ชิ้นแรก ความจุ j', range(0, W), rows, (r, c) => ({ t: F[r][c] === null ? '' : F[r][c], c: (F[r][c] === null ? 'empty ' : '') + hl.get(r, c) }), { corner: 'j (ความจุ)', kind: 'grid' })],
      note, line, ask: a,
    });
    snap(new Hl(), `ของ ${n} ชิ้น น้ำหนัก w = [${list(w)}] มูลค่า v = [${list(v)}] · ความจุกระเป๋า W = ${W}`, -1);
    for (let j = 0; j <= W; j++) F[0][j] = 0;
    for (let i = 0; i <= n; i++) F[i][0] = 0;
    snap(new Hl(), 'แถว i = 0 (ยังไม่มีของให้เลือก) และคอลัมน์ j = 0 (ความจุ 0 ใส่อะไรไม่ได้) → เป็น 0 ทั้งหมด', 0);
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= W; j++) {
        const wi = w[i - 1], vi = v[i - 1], hl = new Hl().add(i, j, 'cur').add(i - 1, j, 'dep');
        if (j < wi) {
          F[i][j] = F[i - 1][j];
          snap(hl, `ช่อง (${i},${j}): น้ำหนักชิ้น ${i} = ${wi} > ความจุ ${j} → ใส่ไม่ได้ ใช้ค่าเดิมจากช่องบน = <b>${F[i][j]}</b>`, [1, 2, 3]);
        } else {
          hl.add(i - 1, j - wi, 'dep');
          const skip = F[i - 1][j], take = vi + F[i - 1][j - wi];
          F[i][j] = Math.max(skip, take);
          snap(hl, `F(${i},${j}) = max{ F(${i - 1},${j}), v${i} + F(${i - 1},${j - wi}) } = max{ ${skip}, ${vi} + ${F[i - 1][j - wi]} } = max{ ${skip}, ${take} } = <b>${F[i][j]}</b><br>${take > skip ? `→ <b>ใส่</b>ชิ้นที่ ${i}` : `→ <b>ไม่ใส่</b>ชิ้นที่ ${i}`}`, [1, 2, 4],
            ask(`F(${i},${j}) = ?`, F[i][j], [[0, i, j]], [skip, take, vi + F[i - 1][j]], `ไม่ใส่ชิ้น ${i} → F(${i - 1},${j}) · ใส่ชิ้น ${i} → v${i} + F(${i - 1},${j} − w${i}) แล้วเลือกค่ามากกว่า`));
        }
      }
    }
    const h = new Hl(), items = [];
    for (let i = n, j = W; i > 0; i--) {
      h.add(i, j, 'pick');
      if (F[i][j] !== F[i - 1][j]) { items.push(i); j -= w[i - 1]; }
    }
    items.reverse();
    const tw = items.reduce((s, i) => s + w[i - 1], 0);
    snap(h, `คำตอบ: <b>F(${n},${W}) = ${F[n][W]}</b> · ย้อนรอย: ใส่ชิ้นที่ ${items.length ? list(items) : '(ไม่มี)'} · น้ำหนักรวม ${tw} ≤ ${W}`, 5);
    return { steps, result: { value: F[n][W], items } };
  }

  function knapsackMF(w, v, W) {
    const n = w.length, F = range(0, n).map((i) => new Array(W + 1).fill(-1)), steps = [];
    for (let j = 0; j <= W; j++) F[0][j] = 0;
    for (let i = 0; i <= n; i++) F[i][0] = 0;
    const rows = ['i = 0'].concat(range(1, n).map((i) => `i = ${i}  (w=${w[i - 1]}, v=${v[i - 1]})`));
    const snap = (hl, note, line, a) => steps.push({
      tables: [tbl('F(i, j) — ช่องว่างคือช่องที่ไม่เคยถูกคำนวณ', range(0, W), rows, (r, c) => ({ t: F[r][c] < 0 ? '' : F[r][c], c: (F[r][c] < 0 ? 'empty ' : '') + hl.get(r, c) }), { corner: 'j (ความจุ)', kind: 'grid' })],
      note, line, ask: a,
    });
    snap(new Hl(), `Memory function: เริ่มถามจาก <b>F(${n},${W})</b> (top-down) แล้วเรียกลงไปเฉพาะช่องที่ต้องใช้จริง · ช่องที่คำนวณแล้วจะถูกจำไว้ (แถว/คอลัมน์ 0 ตั้งเป็น 0 ไว้ก่อน)`, 0);
    let computed = 0, hits = 0;
    function mfk(i, j) {
      if (F[i][j] >= 0) {
        if (i > 0 && j > 0) { hits++; snap(new Hl().add(i, j, 'hit'), `เรียก F(${i},${j}) อีกครั้ง — <b>เคยคำนวณไว้แล้ว = ${F[i][j]}</b> ใช้ค่าที่จำไว้ทันที ไม่ต้องคำนวณซ้ำ`, [1, 7]); }
        return F[i][j];
      }
      const wi = w[i - 1], vi = v[i - 1];
      let val;
      const hl = new Hl().add(i, j, 'cur');
      if (j < wi) {
        const a = mfk(i - 1, j);
        val = a; hl.add(i - 1, j, 'dep');
        F[i][j] = val; computed++;
        snap(hl, `F(${i},${j}): j < w${i} (${j} < ${wi}) ใส่ไม่ได้ → F(${i - 1},${j}) = <b>${val}</b>`, [1, 2, 3, 6, 7]);
      } else {
        const a = mfk(i - 1, j), b = mfk(i - 1, j - wi);
        val = Math.max(a, vi + b); hl.add(i - 1, j, 'dep').add(i - 1, j - wi, 'dep');
        F[i][j] = val; computed++;
        snap(hl, `F(${i},${j}) = max{ ${a}, ${vi} + ${b} } = max{ ${a}, ${vi + b} } = <b>${val}</b>`, [1, 4, 5, 6, 7],
          ask(`F(${i},${j}) = ?`, val, [[0, i, j]], [a, vi + b, vi + a], `F(${i},${j}) = max{ F(${i - 1},${j}), v${i} + F(${i - 1},${j} − w${i}) } — ค่าทั้งสองถูกคำนวณไว้แล้วในสเต็ปก่อนหน้า`));
      }
      return val;
    }
    const res = mfk(n, W);
    const total = n * W;
    const h = new Hl(); range(1, n).forEach((i) => range(1, W).forEach((j) => { if (F[i][j] >= 0) h.add(i, j, 'pick'); }));
    snap(h, `ได้ <b>F(${n},${W}) = ${res}</b> · คำนวณจริง <b>${computed}</b> ช่อง จากทั้งหมด ${total} ช่อง (ที่ bottom-up ต้องทำครบ) · ดึงจาก memo ${hits} ครั้ง`, 7);
    return { steps, result: { value: res, computed, total } };
  }

  /* ---------- 6. Optimal BST ---------- */
  function obst(P, labels) {
    const n = P.length, C = range(0, n + 1).map(() => new Array(n + 1).fill(null)), R = range(0, n + 1).map(() => new Array(n + 1).fill(null)), steps = [];
    const rowsL = range(1, n + 1), colsL = range(0, n);
    const tables = (hl, hideR) => [
      tbl('main table  C[i, j]', colsL, rowsL, (r, c) => { const i = r + 1; return { t: C[i][c] === null ? '' : fmt(C[i][c]), c: (C[i][c] === null ? 'empty ' : '') + hl.get(r, c) }; }, { corner: 'i \\ j', kind: 'mat' }),
      tbl('root table  R[i, j]', colsL, rowsL, (r, c) => { const i = r + 1; return { t: R[i][c] === null ? '' : R[i][c], c: (R[i][c] === null ? 'empty ' : '') + (hideR ? '' : '') + hl.get(r, c) }; }, { corner: 'i \\ j', kind: 'mat' }),
    ];
    const snap = (hl, note, line, a, svg) => steps.push({ tables: tables(hl), svg, note, line, ask: a });
    snap(new Hl(), `key: ${labels.map((l, i) => `${l} (p=${fmt(P[i])})`).join(' · ')}<br>C[i,j] = ค่าเฉลี่ยจำนวนครั้งเปรียบเทียบของ BST ที่ดีที่สุดสำหรับ key ที่ i..j · R[i,j] = key ที่เป็นราก`, -1);
    for (let i = 1; i <= n; i++) { C[i][i - 1] = 0; C[i][i] = P[i - 1]; R[i][i] = i; }
    C[n + 1][n] = 0;
    const hb = new Hl(); for (let i = 1; i <= n; i++) { hb.add(i - 1, i, 'cur'); }
    snap(hb, 'ค่าเริ่มต้น: C[i,i−1] = 0 (ต้นไม้ว่าง), C[i,i] = p<sub>i</sub> (ต้นไม้ 1 โหนด, ราก = i)', [0, 1, 2]);
    for (let d = 1; d <= n - 1; d++) {
      for (let i = 1; i <= n - d; i++) {
        const j = i + d;
        let sum = 0; for (let s = i; s <= j; s++) sum += P[s - 1];
        sum = r6(sum);
        const cand = []; let best = INF, kmin = i;
        for (let k = i; k <= j; k++) {
          const l = C[i][k - 1], r = C[k + 1][j], tot = r6(l + r);
          cand.push({ k, l, r, tot });
          if (tot < best) { best = tot; kmin = k; }
        }
        C[i][j] = r6(best + sum); R[i][j] = kmin;
        const hl = new Hl().add(i - 1, j, 'cur');
        cand.forEach((c) => { hl.add(i - 1, c.k - 1, 'dep'); hl.add(c.k, j, 'dep'); });
        const lines = cand.map((c) => `k=${c.k}: C[${i},${c.k - 1}] + C[${c.k + 1},${j}] = ${fmt(c.l)} + ${fmt(c.r)} = ${fmt(c.tot)}${c.k === kmin ? ' ← ต่ำสุด' : ''}`).join('<br>');
        snap(hl, `คำนวณ <b>C[${i},${j}]</b> (key ${labels.slice(i - 1, j).join(',')}) ลองทุกราก k:<br>${lines}<br>Σp = ${fmt(sum)} → C[${i},${j}] = ${fmt(best)} + ${fmt(sum)} = <b>${fmt(C[i][j])}</b>, ราก R = <b>${kmin}</b> (${labels[kmin - 1]})`, [3, 4, 5, 6, 7, 8, 9, 10],
          ask(`C[${i},${j}] = ?`, C[i][j], [[0, i - 1, j], [1, i - 1, j]], cand.map((c) => r6(c.tot + sum)).concat([best, sum]),
            `C[${i},${j}] = min{ C[${i},k−1] + C[k+1,${j}] } + Σp  โดย Σp = ${fmt(sum)} (ช่องสีเหลืองคือค่าที่ต้องใช้ในแต่ละ k)`));
      }
    }
    // ต้นไม้
    const nodes = [], edges = []; let idc = 0, leafx = 0, maxD = 0;
    const hp = new Hl();
    (function build(i, j, depth) {
      if (i > j) return null;
      const k = R[i][j]; hp.add(i - 1, j, 'pick');
      const nd = { id: idc++, k, depth, l: null, r: null };
      nodes.push(nd);
      nd.l = build(i, k - 1, depth + 1); nd.r = build(k + 1, j, depth + 1);
      maxD = Math.max(maxD, depth);
      return nd;
    })(1, n, 0);
    (function inorder(nd) { if (!nd) return; inorder(nd.l); nd.x = leafx++; inorder(nd.r); })(nodes[0]);
    nodes.forEach((nd) => { if (nd.l) edges.push({ a: nd.id, b: nd.l.id }); if (nd.r) edges.push({ a: nd.id, b: nd.r.id }); });
    const DX = 62, DY = 70, PAD = 40;
    const svg = { type: 'tree', w: Math.max(240, (leafx - 1) * DX + PAD * 2), h: maxD * DY + PAD * 2 + 10,
      nodes: nodes.map((nd) => ({ id: nd.id, x: PAD + nd.x * DX, y: PAD + nd.depth * DY, label: labels[nd.k - 1], sub: `p=${fmt(P[nd.k - 1])}`, cls: nd.depth === 0 ? 'root' : 'done' })), edges };
    const order = nodes.slice().sort((a, b) => a.x - b.x).map((nd) => labels[nd.k - 1]);
    snap(hp, `คำตอบ: <b>C[1,${n}] = ${fmt(C[1][n])}</b> = ค่าเฉลี่ยการเปรียบเทียบต่ำสุด · อ่าน R[1,${n}] = ${R[1][n]} → รากคือ <b>${labels[R[1][n] - 1]}</b> แล้วไล่ลงตาม R ของต้นไม้ย่อยซ้าย/ขวา (in-order: ${order.join(' ')})`, 11, undefined, svg);
    return { steps, result: { value: C[1][n], root: R[1][n], C, R } };
  }

  /* ---------- 7/8. กราฟ ---------- */
  function circlePos(n, cx, cy, r) {
    return range(0, n - 1).map((i) => { const a = (-135 + (360 / n) * i) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; });
  }
  function graphSvg(n, nodeCls, edges) {
    const pos = circlePos(n, 160, 125, n <= 3 ? 80 : 92);
    return { type: 'graph', w: 320, h: 250, nodes: pos.map((p, i) => ({ x: p.x, y: p.y, label: LET[i], cls: nodeCls[i] || '' })), edges };
  }

  function warshall(A) {
    const n = A.length, steps = [], labs = range(0, n - 1).map((i) => LET[i]);
    let R = M(A);
    const orig = (i, j) => A[i][j] === 1 && i !== j;
    const edgesOf = (Rm, newSet, showNew) => {
      const e = [];
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (i === j || !Rm[i][j]) continue;
        const isNew = newSet && newSet.has(i + ',' + j);
        e.push({ a: i, b: j, cls: orig(i, j) ? 'base' : (isNew && showNew ? 'new' : 'derived') });
      }
      return e;
    };
    const tab = (name, Rm, hl, o) => tbl(name, labs, labs, (r, c) => ({ t: Rm[r][c], c: hl.get(r, c) }), Object.assign({ corner: '', kind: 'mat' }, o));
    steps.push({ tables: [tab('R<sup>(0)</sup> = A (adjacency matrix)', R, new Hl())], svg: graphSvg(n, [], edgesOf(R)), note: `เมทริกซ์ A: 1 ในแถว i คอลัมน์ j หมายถึงมีเส้นตรงจากโหนด i ไปโหนด j · เป้าหมายคือหา <b>transitive closure</b> — คู่ (i,j) ที่ "เดินทางถึงกันได้" ไม่ว่าจะผ่านกี่เส้น`, line: 0 });
    for (let k = 0; k < n; k++) {
      const hl = new Hl(), colCls = [], rowCls = [];
      for (let t = 0; t < n; t++) { hl.add(k, t, 'piv'); hl.add(t, k, 'piv'); }
      colCls[k] = 'k'; rowCls[k] = 'k';
      const nodeCls = []; nodeCls[k] = 'piv';
      steps.push({ tables: [tab(`R<sup>(${k})</sup> — เลือก ${labs[k]} เป็นจุดพัก`, R, hl, { colCls, rowCls })], svg: graphSvg(n, nodeCls, edgesOf(R)),
        note: `รอบ k = <b>${labs[k]}</b> · ถามว่า "ถ้าอนุญาตให้แวะพักที่ ${labs[k]} มีคู่ใดที่ไปถึงกันได้เพิ่มไหม?"<br>ดู<b>แถว ${labs[k]}</b> (${labs[k]} ไปไหนได้) และ<b>คอลัมน์ ${labs[k]}</b> (ใครมาถึง ${labs[k]} ได้)`, line: [1] });
      const nxt = M(R), added = [], newSet = new Set();
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (!R[i][j] && R[i][k] && R[k][j]) { nxt[i][j] = 1; added.push([i, j]); newSet.add(i + ',' + j); }
      }
      const hl2 = new Hl(), colCls2 = [], rowCls2 = [];
      colCls2[k] = 'k'; rowCls2[k] = 'k';
      added.forEach(([i, j]) => hl2.add(i, j, 'cur'));
      for (let t = 0; t < n; t++) { if (!nxt[k][t] || !added.some(([i, j]) => i === k && j === t)) { hl2.add(k, t, 'piv'); } if (!added.some(([i, j]) => i === t && j === k)) hl2.add(t, k, 'piv'); }
      const why = added.length ? added.map(([i, j]) => `R[${labs[i]},${labs[j]}] : 0 → <b>1</b> (${labs[i]} → ${labs[k]} → ${labs[j]})`).join('<br>') : 'ไม่มีช่องใหม่ที่เปลี่ยนเป็น 1';
      const nodeCls2 = []; nodeCls2[k] = 'piv';
      steps.push({ tables: [tab(`R<sup>(${k + 1})</sup>`, nxt, hl2, { colCls: colCls2, rowCls: rowCls2 })], svg: graphSvg(n, nodeCls2, edgesOf(nxt, newSet, true)),
        note: `ผลรอบ k = ${labs[k]}: ช่องที่เป็น 1 ใหม่ = <b>${added.length}</b> ช่อง (ช่อง i,j จะเป็น 1 เมื่อ R[i,${labs[k]}] = 1 และ R[${labs[k]},j] = 1)<br>${why}`, line: [2, 3, 4],
        ask: ask(`รอบ k = ${labs[k]}: มีช่องที่เปลี่ยนจาก 0 เป็น 1 กี่ช่อง?`, added.length, added.map(([i, j]) => [0, i, j]), [added.length + 1, Math.max(0, added.length - 1), added.length + 2],
          `หาแถว i ที่ R[i,${labs[k]}] = 1 และคอลัมน์ j ที่ R[${labs[k]},j] = 1 แล้วนับคู่ (i,j) ที่ตอนนี้ยังเป็น 0`) });
      R = nxt;
    }
    let total = 0; R.forEach((r) => r.forEach((x) => { total += x; }));
    steps.push({ tables: [tab(`R<sup>(${n})</sup> = T (transitive closure)`, R, new Hl(), {})], svg: graphSvg(n, [], edgesOf(R)), note: `เสร็จ! ได้ transitive closure มี <b>${total}</b> ช่องที่เป็น 1 · เส้นประคือเส้นทางที่ "อนุมาน" ได้จากการแวะพัก`, line: 5 });
    return { steps, result: { matrix: R, ones: total } };
  }

  function floyd(W) {
    const n = W.length, steps = [], labs = range(0, n - 1).map((i) => LET[i]);
    let D = M(W);
    const wEdges = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j && W[i][j] < INF) wEdges.push({ a: i, b: j, label: fmt(W[i][j]), cls: 'base' });
    const gs = (nodeCls, extra) => graphSvg(n, nodeCls, wEdges.concat(extra || []));
    const tab = (name, Dm, hl, o) => tbl(name, labs, labs, (r, c) => ({ t: fmt(Dm[r][c]), c: hl.get(r, c) }), Object.assign({ corner: '', kind: 'mat' }, o));
    steps.push({ tables: [tab('D<sup>(0)</sup> = W (weight matrix)', D, new Hl())], svg: gs([]), note: `เมทริกซ์ W: ระยะทางของเส้นตรง i→j (ไม่มีเส้น = ∞, เส้นทแยง = 0) · เป้าหมาย: <b>ระยะสั้นสุดของทุกคู่</b> i→j`, line: 0 });
    for (let k = 0; k < n; k++) {
      const hl = new Hl(), colCls = [], rowCls = [];
      for (let t = 0; t < n; t++) { hl.add(k, t, 'piv'); hl.add(t, k, 'piv'); }
      colCls[k] = 'k'; rowCls[k] = 'k';
      const nc = []; nc[k] = 'piv';
      steps.push({ tables: [tab(`D<sup>(${k})</sup> — เลือก ${labs[k]} เป็นจุดพัก`, D, hl, { colCls, rowCls })], svg: gs(nc),
        note: `รอบ k = <b>${labs[k]}</b> · ลองแวะที่ ${labs[k]}: ระยะ i→j ผ่าน ${labs[k]} = D[i,${labs[k]}] + D[${labs[k]},j] สั้นกว่าเดิมไหม?`, line: 1 });
      const nxt = M(D), imp = [];
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (i === k || j === k || i === j) continue;
        const via = D[i][k] + D[k][j];
        if (via < D[i][j]) { imp.push({ i, j, old: D[i][j], via }); nxt[i][j] = via; }
      }
      const hl2 = new Hl(), colCls2 = [], rowCls2 = []; colCls2[k] = 'k'; rowCls2[k] = 'k';
      imp.forEach(({ i, j }) => { hl2.add(i, j, 'cur'); hl2.add(i, k, 'dep'); hl2.add(k, j, 'dep'); });
      const why = imp.length ? imp.map((o) => `D[${labs[o.i]},${labs[o.j]}] = min{ ${fmt(o.old)}, D[${labs[o.i]},${labs[k]}] + D[${labs[k]},${labs[o.j]}] } = min{ ${fmt(o.old)}, ${fmt(D[o.i][k])} + ${fmt(D[k][o.j])} } = <b>${fmt(o.via)}</b>`).join('<br>') : 'ไม่มีคู่ใดที่ผ่าน ' + labs[k] + ' แล้วสั้นลง';
      const nc2 = []; nc2[k] = 'piv';
      const shortcuts = imp.map((o) => ({ a: o.i, b: o.j, label: fmt(o.via), cls: 'new', off: 44 }));
      const first = imp[0];
      steps.push({ tables: [tab(`D<sup>(${k + 1})</sup>`, nxt, hl2, { colCls: colCls2, rowCls: rowCls2 })], svg: gs(nc2, shortcuts),
        note: `ผลรอบ k = ${labs[k]}: ปรับให้สั้นลง <b>${imp.length}</b> ช่อง<br>${why}`, line: [2, 3, 4],
        ask: first ? ask(`D[${labs[first.i]},${labs[first.j]}] หลังรอบ k = ${labs[k]} เป็นเท่าไร?`, first.via, imp.map((o) => [0, o.i, o.j]), [first.old, D[first.i][k], D[k][first.j], first.via + 1],
          `เทียบ D[${labs[first.i]},${labs[first.j]}] เดิม = ${fmt(first.old)} กับ D[${labs[first.i]},${labs[k]}] + D[${labs[k]},${labs[first.j]}] = ${fmt(D[first.i][k])} + ${fmt(D[k][first.j])}`) : undefined });
      D = nxt;
    }
    steps.push({ tables: [tab(`D<sup>(${n})</sup> = D (distance matrix)`, D, new Hl())], svg: gs([]), note: 'เสร็จ! D[i,j] คือระยะทางสั้นสุดจาก i ไป j (∞ = ไปไม่ถึง)', line: 5 });
    return { steps, result: { matrix: D } };
  }

  /* ---------- solver แบบไม่สร้างสเต็ป (ใช้สร้างโจทย์สุ่ม/ทดสอบ) ---------- */
  const solve = {
    fib: (n) => { let a = 0, b = 1; for (let i = 0; i < n; i++) [a, b] = [b, a + b]; return a; },
    coinRow: (C) => coinRow(C).result.value,
    change: (D, n) => changeMaking(D, n).result.value,
    collect: (G) => coinCollect(G).result.value,
    olympic: (D, n) => olympic(D, n).result,
    knap: (w, v, W) => knapsack(w, v, W).result.value,
    obst: (P) => obst(P, P.map((_, i) => String.fromCharCode(65 + i))).result.value,
    warshall: (A) => warshall(A).result.ones,
    floyd: (W) => floyd(W).result.matrix,
  };

  const E = { CODE, fmt, INF, LET, fibTable, fibTree, coinRow, changeMaking, coinCollect, olympic, knapsack, knapsackMF, obst, warshall, floyd, solve, naiveCalls };
  if (typeof module !== 'undefined' && module.exports) module.exports = E;
  else root.Engines = E;
})(typeof window !== 'undefined' ? window : globalThis);

/* content.js — เนื้อหา 9 บทของ Week 8 (Dynamic Programming)
 * เขียนคำอธิบายใหม่เอง อิงลำดับหัวข้อและตัวอย่างจากสไลด์ 254383 และ Levitin (3rd ed.) */
(function () {
  'use strict';
  const E = window.Engines, INF = Infinity, CODE = E.CODE;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[rnd(0, arr.length - 1)];

  /* ---------- ตัวช่วย parse ---------- */
  function intList(str, name, o) {
    const parts = String(str).split(/[,\s]+/).filter((s) => s !== '');
    if (parts.length < o.minLen || parts.length > o.maxLen) throw new Error(`${name}: ต้องมี ${o.minLen}–${o.maxLen} ค่า (คั่นด้วยจุลภาค) — ตอนนี้มี ${parts.length} ค่า`);
    return parts.map((p) => {
      const x = Number(p);
      if (!Number.isInteger(x) || x < o.min || x > o.max) throw new Error(`${name}: "${p}" ต้องเป็นจำนวนเต็ม ${o.min}–${o.max}`);
      return x;
    });
  }
  function floatList(str, name, o) {
    const parts = String(str).split(/[,\s]+/).filter((s) => s !== '');

  C.push({
    id: 'warshall', num: '8.4a', title: "Warshall's Algorithm", short: 'Warshall', slides: 'สไลด์ 64–73',

    intro: `<p>กราฟทิศทางมี n โหนด แทนด้วย <b>adjacency matrix A</b> (A[i,j] = 1 ถ้ามีเส้นตรงจาก i ไป j) ต้องการ <b>transitive closure T</b> — T[i,j] = 1 ถ้าเดินจาก i ไป j ได้ <em>ไม่ว่าจะผ่านกี่เส้น</em></p>
      <p>ตัวอย่างสไลด์: กราฟ a→b, b→d, d→a, d→c ได้ closure ที่ a, b, d ไปถึงทุกโหนดได้ (ยกเว้น c ที่ไปไหนไม่ได้เลย)</p>`,
    idea: `<p>ให้ R<sup>(k)</sup>[i,j] = 1 ถ้ามีทางจาก i ไป j ที่ <b>แวะโหนดกลางทางเฉพาะโหนด 1..k</b> เท่านั้น เมื่อเพิ่มโหนด k เข้ามาเป็นตัวเลือกแวะพัก จะมีทางใหม่ก็ต่อเมื่อ i ไปถึง k ได้ <b>และ</b> k ไปถึง j ได้</p>

  /* ---------- ตัวเลือกปลอมสำหรับคำถามแบบเลือกตอบ ---------- */
  function makeChoices(answer, hints, count) {
    count = count || 4;
    const step = Number.isInteger(answer) || answer === INF ? 1 : 0.1;
    const seen = new Map();
    const add = (v) => { if (typeof v !== 'number' || Number.isNaN(v) || v < 0) return; const key = String(r6(v)); if (!seen.has(key)) seen.set(key, r6(v)); };
    add(answer);
    const distract = [];
    const push = (v) => { if (typeof v !== 'number' || Number.isNaN(v) || v < 0 || same(v, answer)) return; if (!distract.some((x) => same(x, v))) distract.push(r6(v)); };
    (hints || []).forEach(push);
    [answer + step, answer - step, answer + 2 * step, answer - 2 * step, answer * 2, answer + 3 * step].forEach((v) => { if (answer !== INF) push(v); });
    if (answer === INF) [1, 2, 3].forEach(push);
    const shuffled = window.shuffle(distract.slice(0, Math.max(3, distract.length)));
    const pickD = [];
    // ให้ความสำคัญกับ hints ก่อน (ซึ่งอยู่ต้น list) แล้วสุ่มส่วนที่เหลือ
    const hintPart = distract.filter((_, i) => i < (hints || []).length).slice(0, count - 1);
    hintPart.forEach((v) => pickD.push(v));
    shuffled.forEach((v) => { if (pickD.length < count - 1 && !pickD.some((x) => same(x, v))) pickD.push(v); });
    return window.shuffle([answer].concat(pickD.slice(0, count - 1)));
  }
  const fmtV = (x) => E.fmt(x);
