      o += `<g class="node ${esc(n.cls)}" transform="translate(${n.x},${n.y})"><rect x="-27" y="-20" width="54" height="40" rx="11"/><text class="lab" y="${n.sub || hid ? -3 : 5}" text-anchor="middle">${esc(n.label)}</text>${n.sub || hid ? `<text class="sub" y="12" text-anchor="middle">${hid ? '?' : esc(n.sub)}</text>` : ''}</g>`;
    });
    return o + '</svg>';
  }

  function graphSVG(sv) {
    const R = 19;
    let o = `<svg class="graph" viewBox="0 0 ${sv.w} ${sv.h}" role="img" aria-label="กราฟ"><defs>`;
    ['base', 'derived', 'new'].forEach((k) => { o += `<marker id="ar-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="mk mk-${k}" d="M0,0 L10,5 L0,10 z"/></marker>`; });
    o += '</defs>';
    const labels = [];
    sv.edges.forEach((e) => {
      const p = sv.nodes[e.a], q = sv.nodes[e.b];
      const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len, off = e.off == null ? 16 : e.off;
      const cx = (p.x + q.x) / 2 + nx * off * 2, cy = (p.y + q.y) / 2 + ny * off * 2;
      const d1 = Math.hypot(cx - p.x, cy - p.y) || 1, d2 = Math.hypot(q.x - cx, q.y - cy) || 1;
      const sx = p.x + ((cx - p.x) / d1) * R, sy = p.y + ((cy - p.y) / d1) * R;
      const ex = q.x - ((q.x - cx) / d2) * (R + 3), ey = q.y - ((q.y - cy) / d2) * (R + 3);
      o += `<path class="ge ge-${e.cls}" d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" marker-end="url(#ar-${e.cls})"/>`;
      if (e.label != null) {
        const mx = 0.25 * sx + 0.5 * cx + 0.25 * ex, my = 0.25 * sy + 0.5 * cy + 0.25 * ey;
        labels.push(`<text class="gl gl-${e.cls}" x="${(mx + nx * 6).toFixed(1)}" y="${(my + ny * 6 + 4).toFixed(1)}" text-anchor="middle">${esc(e.label)}</text>`);
      }
    });
    o += labels.join('');
    sv.nodes.forEach((n) => { o += `<g class="gn ${esc(n.cls)}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})"><circle r="${R}"/><text y="5" text-anchor="middle">${esc(n.label)}</text></g>`; });
    return o + '</svg>';
  }

  /* ---------- ตัวแก้ไขข้อมูลนำเข้าแบบกริด ---------- */
  function gridEditor(def, val, onChange) {
    const wrap = document.createElement('div'); wrap.className = 'gridw';
    const alpha = def.alpha, isW = def.type === 'wmatrix', square = def.square || isW;
    const headL = (i) => (alpha || isW ? 'abcdefghij'[i] : i + 1);
    function draw() {
      let h = '<div class="gridw-size">';
      if (square) h += `<label>จำนวนโหนด <input type="number" data-sz="n" min="${def.min}" max="${def.max}" value="${val.n}"></label>`;
      else h += `<label>แถว <input type="number" data-sz="n" min="${def.min}" max="${def.max}" value="${val.n}"></label><label>คอลัมน์ <input type="number" data-sz="m" min="${def.min}" max="${def.max}" value="${val.m}"></label>`;
      h += '</div><div class="tbl-wrap"><table class="gridtab"><tr><th></th>';
      for (let j = 0; j < val.m; j++) h += `<th>${headL(j)}</th>`;
      h += '</tr>';
      for (let i = 0; i < val.n; i++) {
        h += `<tr><th>${headL(i)}</th>`;
        for (let j = 0; j < val.m; j++) {
          const v = val.cells[i][j];
          if (isW) h += i === j ? '<td class="diag">0</td>' : `<td><input class="wcell" data-i="${i}" data-j="${j}" value="${v === '∞' || v === INF ? '' : v}" placeholder="∞" inputmode="numeric" aria-label="น้ำหนักเส้น ${headL(i)} ไป ${headL(j)}"></td>`;
          else if (def.style === 'bit' && i === j) h += '<td class="diag">–</td>';
          else h += `<td><button type="button" class="gcell ${v ? 'on' : ''}" data-i="${i}" data-j="${j}" aria-pressed="${v ? 'true' : 'false'}" aria-label="ช่อง ${headL(i)},${headL(j)}">${def.style === 'coin' ? (v ? '●' : '') : (v ? '1' : '0')}</button></td>`;
        }
        h += '</tr>';
      }
      wrap.innerHTML = h + '</table></div>';
    }
    function resize(n, m) {
      const cells = Array.from({ length: n }, (_, i) => Array.from({ length: m }, (_, j) => (val.cells[i] && val.cells[i][j] !== undefined ? val.cells[i][j] : (isW && i === j ? 0 : (isW ? '' : 0)))));
      val.n = n; val.m = m; val.cells = cells;
    }
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('.gcell'); if (!b) return;
      const i = +b.dataset.i, j = +b.dataset.j; val.cells[i][j] = val.cells[i][j] ? 0 : 1; draw(); onChange();
    });
    wrap.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.sz) {
        let x = Math.max(def.min, Math.min(def.max, parseInt(t.value, 10) || def.min));
        if (square) resize(x, x); else resize(t.dataset.sz === 'n' ? x : val.n, t.dataset.sz === 'm' ? x : val.m);
        draw(); onChange();
      } else if (t.classList.contains('wcell')) { val.cells[+t.dataset.i][+t.dataset.j] = t.value.trim(); onChange(); }
    });
    draw();
    return wrap;
  }

  /* ============ Playground ============ */
  class Playground {
    constructor(ch, root) {
      this.ch = ch; this.root = root;
      this.modeId = ch.modes[0].id;
      this.raw = clone(ch.defaults);
      this.predict = false; this.idx = 0; this.steps = []; this.answered = new Set(); this.tries = {}; this.qCache = {};
      this.timer = null; this.speed = 1;
      this.stat = store.get('practice:' + ch.id, { asked: 0, correct: 0 });
      this.onKey = this.onKey.bind(this);
      document.addEventListener('keydown', this.onKey);
      AP.hooks.dispose = () => this.destroy();
      this.build();
      this.apply();
    }
    destroy() { this.stop(); document.removeEventListener('keydown', this.onKey); }
    get mode() { return this.ch.modes.find((m) => m.id === this.modeId); }

    build() {
      const ch = this.ch;
      this.root.innerHTML = `
      <div class="pg">
        <div class="pg-top">
          ${ch.modes.length > 1 ? `<div class="seg" role="tablist" aria-label="วิธีคำนวณ">${ch.modes.map((m) => `<button role="tab" data-act="mode" data-mode="${m.id}" aria-selected="${m.id === this.modeId}">${esc(m.label)}</button>`).join('')}</div>` : ''}
          <label class="switch" title="ระบบจะถามค่าของช่องถัดไปก่อนเฉลย"><input type="checkbox" data-act="predict"><span class="track"></span><span>โหมดฝึกทาย</span></label>
          <span class="pg-score" hidden></span>
        </div>
        <div class="pg-inputs"></div>
        <div class="pg-err" role="alert" hidden></div>
        <div class="pg-ctl" role="group" aria-label="ควบคุมการเล่น">
          <button data-act="first" aria-label="เริ่มใหม่ (Home)" title="เริ่มใหม่">⏮</button>
          <button data-act="prev" aria-label="ย้อนกลับ (←)" title="ย้อนกลับ (←)">◀</button>
          <button data-act="next" class="primary" aria-label="ถัดไป (→)" title="ถัดไป (→)">ถัดไป ▶</button>
          <button data-act="play" aria-label="เล่นอัตโนมัติ (เว้นวรรค)" title="เล่นอัตโนมัติ (เว้นวรรค)">⏵ เล่น</button>
          <button data-act="last" aria-label="ไปสเต็ปสุดท้าย" title="ไปสุดท้าย">⏭</button>
          <input type="range" class="pg-range" min="0" max="0" value="0" aria-label="เลือกสเต็ป">
          <span class="pg-count" aria-live="polite"></span>
          <label class="speed">ความเร็ว <select data-act="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
        </div>
        <div class="pg-main">
          <div class="pg-vis" aria-live="off"></div>
          <div class="pg-side">
            <div class="pg-note" aria-live="polite"></div>
            <div class="pg-code" aria-label="Pseudocode"></div>
          </div>
        </div>
      </div>`;
      this.buildInputs();
      this.root.addEventListener('click', (e) => this.onClick(e));
      this.root.addEventListener('change', (e) => this.onChange(e));
      this.root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.q-input')) { e.preventDefault(); this.submitTyped(); } else if (e.key === 'Enter' && e.target.matches('.pg-inputs input')) { this.apply(); } });
      this.root.querySelector('.pg-range').addEventListener('input', (e) => { this.stop(); this.goto(+e.target.value); });
    }

    buildInputs() {
      const box = this.root.querySelector('.pg-inputs'), ch = this.ch;
      box.innerHTML = '';
      const fields = document.createElement('div'); fields.className = 'fields';
      ch.inputs.forEach((d) => {
        if (d.type === 'grid' || d.type === 'wmatrix') {
          const w = document.createElement('details'); w.className = 'field wide'; w.open = !!this.gridOpen;
          w.addEventListener('toggle', () => { this.gridOpen = w.open; });
          w.innerHTML = `<summary>✎ แก้ไขข้อมูล: ${esc(d.label)}</summary>`;
          w.appendChild(gridEditor(d, this.raw[d.id], () => this.apply()));
          fields.appendChild(w);
        } else {
          const l = document.createElement('label'); l.className = 'field';
          l.innerHTML = `<span class="flabel">${esc(d.label)}</span><input data-id="${d.id}" type="${d.type === 'number' ? 'number' : 'text'}" value="${esc(this.raw[d.id])}" ${d.type === 'text' ? `size="${d.size || 20}"` : ''} autocomplete="off" spellcheck="false">${d.help ? `<span class="fhelp">${esc(d.help)}</span>` : ''}`;
          fields.appendChild(l);
        }
      });
      box.appendChild(fields);
      const acts = document.createElement('div'); acts.className = 'iacts';
      acts.innerHTML = `<button data-act="apply" class="primary">เริ่มด้วยข้อมูลนี้</button>
        <label class="preset">ตัวอย่าง <select data-act="preset"><option value="">— เลือก —</option>${this.ch.presets.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}</select></label>
        <button data-act="random">🎲 สุ่มโจทย์</button>`;
      box.appendChild(acts);
    }

    readRaw() { $$('.pg-inputs input[data-id]', this.root).forEach((inp) => { this.raw[inp.dataset.id] = inp.value; }); }
    showErr(msg) { const e = this.root.querySelector('.pg-err'); e.hidden = !msg; e.textContent = msg || ''; }

    apply() {
      this.stop(); this.readRaw();
      try {
        const args = this.ch.parse(this.raw, this.modeId);
        const out = this.mode.run(args);
        this.steps = out.steps; this.result = out.result;
      } catch (err) { this.showErr(err.message); return; }
      this.showErr('');
      this.idx = 0; this.answered = new Set(); this.tries = {}; this.qCache = {};
      this.render();
    }

    /* ----- การนำทาง ----- */
    frontier() { for (let i = 0; i < this.steps.length; i++) if (this.steps[i].ask && !this.answered.has(i)) return i; return this.steps.length - 1; }
    isPending() { const s = this.steps[this.idx]; return this.predict && s && s.ask && !this.answered.has(this.idx); }
    goto(i) {
      i = Math.max(0, Math.min(this.steps.length - 1, i));
      if (this.predict) i = Math.min(i, this.frontier());
      this.idx = i; this.render();
    }
    next() { if (this.isPending()) { const f = this.root.querySelector('.q-input'); if (f) f.focus(); return; } this.goto(this.idx + 1); }
    prev() { this.stop(); this.goto(this.idx - 1); }
    play() {
      if (this.predict) return;
      if (this.timer) { this.stop(); return; }
      if (this.idx >= this.steps.length - 1) this.idx = 0;
      this.setPlaying(true);
      this.timer = setInterval(() => { if (this.idx >= this.steps.length - 1) { this.stop(); return; } this.goto(this.idx + 1); }, 1100 / this.speed);
      this.render();
    }
    stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.setPlaying(false); }
    setPlaying(v) { const b = this.root.querySelector('[data-act=play]'); if (b) b.textContent = v ? '⏸ หยุด' : '⏵ เล่น'; }

    /* ----- ทายค่า ----- */
    choicesFor(i) {
      if (this.qCache[i]) return this.qCache[i];
      const a = this.steps[i].ask;
      const ch = a.choices ? a.choices.slice() : makeChoices(a.answer, a.hints).map((v) => ({ label: fmtV(v), value: v }));
      return (this.qCache[i] = ch);
    }
    record(correctFirst) {
      const tr = this.tries[this.idx] || {};
      if (!tr.counted) { this.stat.asked++; if (correctFirst) this.stat.correct++; tr.counted = true; this.tries[this.idx] = tr; store.set('practice:' + this.ch.id, this.stat); }
    }
    answer(value) {
      const s = this.steps[this.idx], a = s.ask; if (!a) return;
      const tr = (this.tries[this.idx] = this.tries[this.idx] || { wrong: [] });
      tr.wrong = tr.wrong || [];
      if (same(value, a.answer)) { this.record(tr.wrong.length === 0); this.answered.add(this.idx); this.lastFb = 'ok'; this.render(); }
      else { tr.wrong.push(value); tr.hintShown = true; this.qFeedback = { bad: value }; this.render(); }
    }
    submitTyped() {
      const inp = this.root.querySelector('.q-input'); if (!inp) return;
      const v = parseNum(inp.value);
      if (v === null) { this.qFeedback = { msg: 'พิมพ์เป็นตัวเลข (หรือ ∞)' }; this.render(); return; }
      this.answer(v);
    }
    reveal() { this.record(false); this.answered.add(this.idx); this.render(); }

    questionHTML() {
      const s = this.steps[this.idx], a = s.ask, tr = this.tries[this.idx] || { wrong: [] };
      const ch = this.choicesFor(this.idx);
      const btn = ch.map((c, k) => { const dead = tr.wrong.some((w) => same(w, c.value)); return `<button class="choice${dead ? ' dead' : ''}" data-act="choice" data-k="${k}" ${dead ? 'disabled' : ''}>${esc(c.label)}</button>`; }).join('');
      const bad = tr.wrong.length ? `<div class="q-fb bad">ยังไม่ใช่ — ลองอ่านคำใบ้แล้วตอบใหม่</div>` : '';
      const msg = this.qFeedback && this.qFeedback.msg ? `<div class="q-fb bad">${esc(this.qFeedback.msg)}</div>` : '';
      return `<div class="q"><div class="q-tag">ทายก่อนเปิดช่อง</div><div class="q-text">${a.q}</div>
        <div class="q-choices">${btn}</div>
        ${a.noType ? '' : `<div class="q-type"><label>หรือพิมพ์เอง <input class="q-input" inputmode="decimal" autocomplete="off" placeholder="ตัวเลข"></label><button data-act="submit">ตอบ</button></div>`}
        ${bad}${msg}
        ${tr.hintShown ? `<div class="q-hint"><b>คำใบ้:</b> ${a.hint || 'ดูช่องสีเหลือง'}</div>` : ''}
        <button class="linkbtn" data-act="reveal">ไม่แน่ใจ — ดูเฉลย</button></div>`;
    }

    /* ----- แสดงผล ----- */
    render() {
      const s = this.steps[this.idx]; if (!s) return;
      const pending = this.isPending();
      const hide = pending ? s.ask.hide : null, hideNodes = pending ? s.ask.hideNodes : null;
      let vis = '';
      if (s.svg) vis += `<div class="svgbox">${s.svg.type === 'tree' ? treeSVG(s.svg, hideNodes) : graphSVG(s.svg)}${s.svg.type === 'graph' ? graphLegend() : ''}${s.svg.type === 'tree' ? treeLegend(this.modeId) : ''}</div>`;
      s.tables.forEach((t, ti) => { vis += tableHTML(t, ti, hide); });
      this.root.querySelector('.pg-vis').innerHTML = vis;
      const note = this.root.querySelector('.pg-note');
      note.innerHTML = pending ? this.questionHTML() : `<div class="note-body">${s.note}</div>${this.predict && s.ask && this.tries[this.idx] ? '<div class="q-fb ok">✓ ถูกต้อง</div>' : ''}`;
      const code = this.mode.code, act = Array.isArray(s.line) ? s.line : [s.line];
      this.root.querySelector('.pg-code').innerHTML = `<div class="code-title">Pseudocode</div><pre>${code.map((l, i) => `<span class="ln${act.includes(i) ? ' on' : ''}">${esc(l)}</span>`).join('')}</pre>${this.mode.hint ? `<div class="mode-hint">${esc(this.mode.hint)}</div>` : ''}`;
      const n = this.steps.length, rng = this.root.querySelector('.pg-range');
      rng.max = n - 1; rng.value = this.idx;
      rng.disabled = this.predict && false;
      this.root.querySelector('.pg-count').textContent = `สเต็ป ${this.idx + 1} / ${n}`;
      this.root.querySelector('[data-act=prev]').disabled = this.idx === 0;
      const nx = this.root.querySelector('[data-act=next]'); nx.disabled = this.idx >= n - 1 || pending;
      this.root.querySelector('[data-act=play]').disabled = this.predict;
      this.root.querySelector('[data-act=first]').disabled = this.idx === 0;
      this.root.querySelector('[data-act=last]').disabled = this.predict && this.frontier() > this.idx;
      const sc = this.root.querySelector('.pg-score'); sc.hidden = !this.predict;
      sc.textContent = `ตอบถูกในครั้งแรก ${this.stat.correct}/${this.stat.asked}`;
      this.qFeedback = null;
      if (pending) { const f = this.root.querySelector('.q-input'); if (f && this._focusQ) f.focus(); }
    }

    /* ----- อีเวนต์ ----- */
    onClick(e) {
      const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
      const act = b.dataset.act;
      if (act === 'next') { this._focusQ = true; this.next(); }
      else if (act === 'prev') this.prev();
      else if (act === 'first') { this.stop(); this.goto(0); }
      else if (act === 'last') { this.stop(); this.goto(this.steps.length - 1); }
      else if (act === 'play') this.play();
      else if (act === 'apply') this.apply();
      else if (act === 'random') { this.raw = clone(this.ch.random()); this.buildInputs(); this.apply(); }
      else if (act === 'mode') { this.modeId = b.dataset.mode; $$('[data-act=mode]', this.root).forEach((x) => x.setAttribute('aria-selected', x.dataset.mode === this.modeId)); this.apply(); }
      else if (act === 'choice') { const c = this.choicesFor(this.idx)[+b.dataset.k]; this.answer(c.value); }
      else if (act === 'submit') this.submitTyped();
      else if (act === 'reveal') this.reveal();
    }
    onChange(e) {
      const t = e.target;
      if (t.matches('[data-act=predict]')) { this.predict = t.checked; this.stop(); this.idx = 0; this.answered = new Set(); this.tries = {}; this.qCache = {}; this._focusQ = false; this.render(); if (this.predict) this.goto(1); }
      else if (t.matches('[data-act=speed]')) { this.speed = +t.value; if (this.timer) { this.stop(); this.play(); } }
      else if (t.matches('[data-act=preset]')) { if (t.value === '') return; this.raw = clone(this.ch.presets[+t.value].raw); this.buildInputs(); this.apply(); }
    }
    onKey(e) {
      if (!this.root.isConnected) { this.destroy(); return; }
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); this._focusQ = true; this.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
      else if (e.key === ' ' && !e.target.closest('button, a')) { e.preventDefault(); this.play(); }
      else if (e.key === 'Home') { this.stop(); this.goto(0); }
    }
  }
  const graphLegend = () => '<div class="legend"><span><i class="lg lg-base"></i>เส้นเดิม</span><span><i class="lg lg-derived"></i>เส้นทางที่อนุมานได้</span><span><i class="lg lg-new"></i>เพิ่มในรอบนี้</span></div>';
  const treeLegend = (m) => (m === 'tree' ? '<div class="legend"><span><i class="lg lg-call"></i>กำลังเรียก</span><span><i class="lg lg-dupe"></i>คำนวณซ้ำ</span></div>' : m === 'memo' ? '<div class="legend"><span><i class="lg lg-call"></i>กำลังเรียก</span><span><i class="lg lg-hit"></i>ดึงจาก memo</span></div>' : '');

  /* ============ Quiz ============ */
  function mountQuiz(ch, el) {
    let qs = [], i = 0, score = 0, locked = false;
    function build() {
      qs = ch.quiz.map((q) => {
        if (q.gen) {
          const g = q.gen();
          const opts = makeChoices(g.answer, g.hints, 4).map((v) => ({ label: fmtV(v), ok: same(v, g.answer) }));
          return { q: g.q, opts, why: g.why, gen: true };
        }
        return { q: q.q, opts: window.shuffle(q.opts.map((t, k) => ({ label: t, ok: k === q.ans }))), why: q.why };
      });
      i = 0; score = 0; locked = false; draw();
    }
    function draw() {
      if (i >= qs.length) return done();
      const q = qs[i];
      el.innerHTML = `<div class="quiz"><div class="qz-top"><span>ข้อ ${i + 1} / ${qs.length}</span><span class="dots">${qs.map((_, k) => `<i class="${k < i ? 'd' : k === i ? 'c' : ''}"></i>`).join('')}</span></div>
        <div class="qz-q">${q.q}</div><div class="qz-opts">${q.opts.map((o, k) => `<button class="choice" data-k="${k}">${esc(o.label)}</button>`).join('')}</div><div class="qz-fb" aria-live="polite"></div></div>`;
      locked = false;
    }
    function done() {
      const ratio = score / qs.length, passed = ratio >= 0.6;
      const p = progress[ch.id] = Object.assign({ visited: true }, progress[ch.id]);
      p.best = Math.max(p.best || 0, ratio); if (passed) p.passed = true; saveProgress(); AP.progress();
      el.innerHTML = `<div class="quiz done"><div class="score ${passed ? 'ok' : ''}">${score}<span>/${qs.length}</span></div>
        <p>${passed ? '🎉 ผ่านแล้ว! บทนี้ถูกทำเครื่องหมายว่าเรียนจบ' : 'ยังไม่ถึงเกณฑ์ผ่าน (60%) — ลองอ่านแนวคิดอีกรอบแล้วทำใหม่ได้เลย'}</p>
        <div class="row"><button data-act="retry" class="primary">ทำใหม่ (สุ่มข้อใหม่)</button>${AP.hooks.nextAfterQuiz ? AP.hooks.nextAfterQuiz() : ''}</div></div>`;
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'retry') { build(); return; }
      if (b.dataset.act === 'nextq') { i++; draw(); return; }
      if (b.classList.contains('choice') && !locked) {
        locked = true;
        const q = qs[i], k = +b.dataset.k, ok = q.opts[k].ok;
        if (ok) score++;
        $$('.choice', el).forEach((x, kk) => { x.disabled = true; if (q.opts[kk].ok) x.classList.add('right'); else if (kk === k) x.classList.add('wrong'); });
        $('.qz-fb', el).innerHTML = `<div class="q-fb ${ok ? 'ok' : 'bad'}">${ok ? '✓ ถูกต้อง' : '✗ ยังไม่ถูก'}</div><div class="why">${q.why}</div><button data-act="nextq" class="primary">${i + 1 >= qs.length ? 'ดูผลคะแนน' : 'ข้อต่อไป →'}</button>`;
        const nb = $('[data-act=nextq]', el); if (nb) nb.focus();
      }
    });
    build();
  }

  /* ============ ส่วนที่ AlgoPrep ใช้ ============ */
  const fmScan = (root) => {
    root.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-k]'); if (!t) return; const box = t.closest('.formula-box'); if (!box) return; $$(`[data-k="${t.dataset.k}"]`, box).forEach((x) => x.classList.add('hl')); });

function changeSteps(D, n, r, pre) {
  const F = Array(n + 1).fill(INF); F[0] = 0;
  const pn = (cur, src, coin, ok) => [
    tbl('เหรียญที่มี D', [D], { cl: range(1, D.length + 1), cur: coin != null ? [0, D.indexOf(coin)] : null }),
    tbl('F[i] = จำนวนเหรียญน้อยสุดที่ทอนเงิน i บาท', [F], { rl: ['F'], cl: range(0, n + 1), cur: cur != null ? [0, cur] : null, src: src || [], ok: ok || [] }),
  ];

  for (let i = 1; i <= n; i++) for (const c of D) if (i >= c) {
    const cand = F[i - c] + 1, old = F[i]; F[i] = Math.min(F[i], cand);
    r.add('upd', `i=${i}, เหรียญ ${c}: F[${i - c}] + 1 = ${inf(F[i - c])} + 1 = ${cand} · เทียบกับค่าเดิม ${inf(old)} → F[${i}] = <b>${F[i]}</b>`, pn(i, [[0, i - c]], c));
  }
  const used = []; let x = n; while (x > 0) { const c = D.find(c => x >= c && F[x - c] + 1 === F[x]); used.push(c); x -= c; }
  r.add('ret', `คำตอบ F[${n}] = <b>${F[n]}</b> เหรียญ (ใช้เหรียญ ${used.join(' + ')})`, pn(n, [], null, [[0, n]]));
  return F;
}

  q: `อธิบายความหมายของ Recurrence <code>F(i,j) = max{F(i−1,j), F(i,j−1)} + c<sub>ij</sub></code> ในแง่ของการตัดสินใจในอดีต (Optimal Substructure)`,
  rec: `F(i,j) = max{ F(i−1,j) , F(i,j−1) } + c<sub>ij</sub><br><small>แถวแรก/คอลัมน์แรกมีทางมาทางเดียว จึงสะสมต่อเนื่อง</small>`,
  idea: ['F(i,j) = เหรียญมากสุดที่เก็บได้เมื่อมาถึงช่อง (i,j)', 'หุ่นยนต์มาถึง (i,j) ได้จาก “ข้างบน” หรือ “ข้างซ้าย” เท่านั้น', 'ดังนั้นเลือกทางที่เคยสะสมได้มากกว่า แล้วบวกเหรียญในช่องนี้'],
  cx: 'เวลา O(n·m) · พื้นที่ O(n·m)',
  code: `
def robot_coin_collection(matrix):
    n, m = len(matrix), len(matrix[0])          #@size
    F = [[0]*m for _ in range(n)]               #@init
    F[0][0] = matrix[0][0]                      #@start
    for j in range(1, m): F[0][j] = F[0][j-1] + matrix[0][j]   #@row0
    for i in range(1, n): F[i][0] = F[i-1][0] + matrix[i][0]   #@col0

    for i in range(1, n):                       #@loopi
        for j in range(1, m):                   #@loopj
            F[i][j] = max(F[i-1][j], F[i][j-1]) + matrix[i][j]   #@upd
    return F[n-1][m-1]                          #@ret

grid = [[0, 1, 0], [1, 0, 1], [0, 1, 0]]
print("Max Coins:", robot_coin_collection(grid))`,
  ex: {
    size: 'n = จำนวนแถว, m = จำนวนคอลัมน์',
    init: 'ตาราง F ขนาดเท่ากริด เก็บ “เหรียญสะสมสูงสุดเมื่อถึงช่องนั้น”',

    upd: 'เลือกทางที่สะสมได้มากกว่าระหว่าง <b>ข้างบน F[i-1][j]</b> กับ <b>ข้างซ้าย F[i][j-1]</b> แล้วบวกเหรียญของช่องนี้',
    ret: 'คำตอบอยู่ที่มุมล่างขวา F[n-1][m-1]',
  },
  out: 'Max Coins: 2   (⚠ PDF เขียนว่า 3 ซึ่งไม่ถูกต้อง)',
  pdfFix: 'PDF ระบุผลลัพธ์ <code>3</code> แต่เมื่อรันโค้ดจริงกับ grid นี้ได้ <b>2</b> — ช่องที่มีเหรียญคือ (0,1),(1,0),(1,2),(2,1) ซึ่งไม่มีเส้นทาง “ขวา/ลง” ใดผ่านได้เกิน 2 ช่อง',
  run() {
    const M = [[0, 1, 0], [1, 0, 1], [0, 1, 0]], n = 3, m = 3, F = Array.from({ length: n }, () => Array(m).fill(null)), r = Rec();
    const pn = (cur, src, ok) => [tbl('grid (1 = มีเหรียญ)', M, { cur, cl: range(0, m), rl: range(0, n) }), tbl('F — เหรียญสะสมสูงสุดที่ถึงช่องนี้', F, { cur, src: src || [], ok: ok || [], cl: range(0, m), rl: range(0, n) })];
    F[0][0] = M[0][0]; r.add('start', 'F[0][0] = matrix[0][0] = 0', pn([0, 0]));
    for (let j = 1; j < m; j++) { F[0][j] = F[0][j - 1] + M[0][j]; r.add('row0', `แถวแรก: F[0][${j}] = F[0][${j - 1}] + ${M[0][j]} = ${F[0][j]}`, pn([0, j], [[0, j - 1]])); }
    for (let i = 1; i < n; i++) { F[i][0] = F[i - 1][0] + M[i][0]; r.add('col0', `คอลัมน์แรก: F[${i}][0] = F[${i - 1}][0] + ${M[i][0]} = ${F[i][0]}`, pn([i, 0], [[i - 1, 0]])); }
    for (let i = 1; i < n; i++) for (let j = 1; j < m; j++) {
      const u = F[i - 1][j], l = F[i][j - 1]; F[i][j] = Math.max(u, l) + M[i][j];
      r.add('upd', `F[${i}][${j}] = max(ข้างบน ${u}, ข้างซ้าย ${l}) + ${M[i][j]} = <b>${F[i][j]}</b>`, pn([i, j], [[i - 1, j], [i, j - 1]]));
    }
    const path = []; let i = n - 1, j = m - 1; path.push([i, j]);
    while (i > 0 || j > 0) { if (i === 0) j--; else if (j === 0) i--; else if (F[i - 1][j] >= F[i][j - 1]) i--; else j--; path.push([i, j]); }
    r.add('ret', `คำตอบ F[2][2] = <b>${F[2][2]}</b> (ย้อนรอยเส้นทางที่สะสมได้: ${path.reverse().map(p => `(${p})`).join(' → ')})`, pn(null, [], path));

/* ---------- ข้อ 5 Fibonacci with Memoization ---------- */
function fibTrace(N, memoOn) {
  const nodes = [], st = [], val = [], r = Rec(), memo = {}, seen = {}; let calls = 0;
  const pn = cur => {
    const p = [treeP(memoOn ? 'ต้นไม้การเรียก (เขียว = memo ช่วยตัดการคำนวณ)' : 'ต้นไม้การเรียก Recursive ธรรมดา (แดง = คำนวณซ้ำโดยเปล่าประโยชน์)', nodes, st, val)];
    if (memoOn) p.push(tbl('memo[k] (ตารางช่วยจำ)', [range(0, N + 1).map(k => k in memo ? memo[k] : null)], { cl: range(0, N + 1), rl: ['memo'], cur: cur != null ? [0, cur] : null }));
    p.push(textP('จำนวนการเรียกฟังก์ชัน', `<b>${calls}</b> ครั้ง`));
    return p;
  };
  function fib(n, parent) {
    const id = nodes.length; nodes.push({ id, label: `fib(${n})`, parent }); st.push(1); val.push(null); calls++;
    const dup = !memoOn && seen[n]; seen[n] = true;
    r.add(memoOn ? 'def' : null, `เรียก fib(${n})`, pn(n));
    if (memoOn && n in memo) { st[id] = 3; val[id] = memo[n]; r.add('hit', `fib(${n}) มีใน memo แล้ว = ${memo[n]} → คืนค่าทันที ไม่ต้องคำนวณซ้ำ`, pn(n)); return memo[n]; }
    if (n <= 1) { st[id] = dup ? 4 : 2; val[id] = n; r.add(memoOn ? 'base' : null, `fib(${n}) = ${n} (base case)`, pn(n)); return n; }
    const v = fib(n - 1, id) + fib(n - 2, id);
    if (memoOn) memo[n] = v;
    st[id] = dup ? 4 : 2; val[id] = v;
    r.add(memoOn ? 'store' : null, dup ? `fib(${n}) = ${v} — <b>คำนวณซ้ำ</b> (เคยคำนวณไปแล้ว)` : `fib(${n}) = ${v}` + (memoOn ? ` → เก็บลง memo[${n}]` : ''), pn(n));
    return v;
  }
  fib(N, -1); return r.steps;
}

  q: `วาดตารางขนาด 5×6 (Rows = ของชิ้นที่ 0-4, Cols = น้ำหนัก 0-5) และระบุว่าช่องที่ได้มูลค่า 37 มาจากการตัดสินใจเลือกของชิ้นใดบ้าง`,
  rec: `F[i][j] = max( F[i−1][j] , v<sub>i</sub> + F[i−1][j − w<sub>i</sub>] ) &nbsp; ถ้า j ≥ w<sub>i</sub><br>F[i][j] = F[i−1][j] &nbsp; ถ้า j &lt; w<sub>i</sub> · F[0][j] = F[i][0] = 0`,
  idea: ['F[i][j] = มูลค่าสูงสุดเมื่อเลือกจาก i ชิ้นแรก ในถุงจุ j', 'ชิ้นที่ i มีสองทาง: <b>ไม่ใส่</b> (F[i−1][j]) หรือ <b>ใส่</b> (v + F[i−1][j−w])', 'เติมตารางทีละแถว แล้วย้อนรอยจาก F[n][W] เพื่อรู้ว่าเลือกชิ้นไหน'],
  cx: 'เวลา O(n·W) · พื้นที่ O(n·W)',
  code: `
def knapsack_bottom_up(weights, values, capacity):
    n = len(weights)                                  #@n
    F = [[0] * (capacity + 1) for _ in range(n + 1)]  #@init
    for i in range(1, n + 1):                         #@loopi
        for j in range(1, capacity + 1):              #@loopj
            if j - weights[i-1] >= 0:                 #@chk
                F[i][j] = max(F[i-1][j], values[i-1] + F[i-1][j - weights[i-1]])   #@upd
            else:
                F[i][j] = F[i-1][j]                   #@else
    return F[n][capacity]                             #@ret

print("Max Knapsack Value:", knapsack_bottom_up([2,1,3,2], [12,10,20,15], 5))`,

    const rl = ['0 (ไม่มีของ)', ...KW.map((w, k) => `ชิ้น ${k + 1} (w=${w}, v=${KV[k]})`)];
    const pn = (cur, src, ok, item) => [
      tbl('ของ (น้ำหนัก w / มูลค่า v)', [KW, KV], { cl: range(1, n + 1), rl: ['w', 'v'], cur: item ? [0, item - 1] : null, cur2: item ? [1, item - 1] : null }),
      tbl('F[i][j] — มูลค่าสูงสุดเมื่อใช้ i ชิ้นแรก ถุงจุ j', F, { cl: range(0, W + 1), rl, cur, src: src || [], ok: ok || [] }),
    ];
    r.add('init', 'สร้างตาราง: แถว 0 และคอลัมน์ 0 เป็น 0', pn());
    for (let i = 1; i <= n; i++) for (let j = 1; j <= W; j++) {
      const w = KW[i - 1], v = KV[i - 1];
      if (j - w >= 0) {
        const a = F[i - 1][j], b = v + F[i - 1][j - w]; F[i][j] = Math.max(a, b);
        r.add('upd', `F[${i}][${j}]: <b>ไม่ใส่</b> = F[${i - 1}][${j}] = ${a} · <b>ใส่</b> ชิ้น ${i} = ${v} + F[${i - 1}][${j - w}] = ${b} → <b>${F[i][j]}</b>`, pn([i, j], [[i - 1, j], [i - 1, j - w]], [], i));
      } else {
        F[i][j] = F[i - 1][j];
        r.add('else', `F[${i}][${j}]: ชิ้น ${i} หนัก ${w} > ${j} ใส่ไม่ได้ → คัดลอกจากแถวบน = ${F[i][j]}`, pn([i, j], [[i - 1, j]], [], i));
      }
    }
    const path = [[n, W]], chosen = []; let j = W;
    for (let i = n; i >= 1; i--) { if (F[i][j] !== F[i - 1][j]) { chosen.push(i); j -= KW[i - 1]; } path.push([i - 1, j]); }
    r.add('ret', `คำตอบ F[4][5] = <b>${F[n][W]}</b> · ย้อนรอย: ช่องไหนต่างจากแถวบน = เลือกชิ้นนั้น → เลือกชิ้น <b>${chosen.reverse().join(', ')}</b> (น้ำหนัก ${chosen.reduce((s, k) => s + KW[k - 1], 0)}, มูลค่า ${chosen.reduce((s, k) => s + KV[k - 1], 0)})`, pn(null, [], path));
    return V1(r.steps);
  },

  story: `เปลี่ยนเงื่อนไขจาก 0/1 Knapsack เป็น “หยิบของชิ้นเดิมซ้ำได้ไม่จำกัด” น้ำหนัก <code>W = [2, 3]</code> มูลค่า <code>V = [10, 20]</code> ถุงจุ <code>Capacity = 6</code>`,
  q: `Recurrence ของ Unbounded Knapsack แตกต่างจาก 0/1 Knapsack ตรงจุดใด? ทำไมเราจึงไม่ต้องพึ่งข้อมูลจากแถว i−1 อีกต่อไป?`,
  rec: `F[j] = max<sub>i : w<sub>i</sub> ≤ j</sub> ( F[j − w<sub>i</sub>] + v<sub>i</sub> ) &nbsp; โดย F[0] = 0`,
  idea: ['F[j] = มูลค่าสูงสุดเมื่อถุงจุ j (เลือกของชนิดไหนก็ได้ กี่ชิ้นก็ได้)', 'ลองหยิบของชนิด i หนึ่งชิ้น แล้วที่เหลือ j−w เลือกได้อีกเต็มที่ เพราะหยิบชนิดเดิมซ้ำได้', 'จึงลดจาก 2 มิติ เหลือ 1 มิติ'],
  cx: 'เวลา O(n·W) · พื้นที่ O(W)',
  code: `
def unbounded_knapsack(weights, values, capacity):
    F = [0] * (capacity + 1)                          #@init
    for j in range(1, capacity + 1):                  #@loopj
        for i in range(len(weights)):                 #@loopi
            if weights[i] <= j:                       #@chk
                F[j] = max(F[j], F[j - weights[i]] + values[i])   #@upd
    return F[capacity]                                #@ret

print("Unbounded Value:", unbounded_knapsack([2, 3], [10, 20], 6))`,
  ex: {
    init: 'F[j] เก็บมูลค่าสูงสุดของถุงจุ j — ตารางเป็น 1 มิติ เริ่มต้นเป็น 0',
    loopj: 'เติมตารางทีละความจุ j = 1..W',
    loopi: 'ลองของทุกชนิด (ไม่มีการจำกัดจำนวนชิ้นของแต่ละชนิด)',
    chk: 'ของชนิด i ใส่ได้ ถ้าน้ำหนัก ≤ ความจุ j',
    upd: 'หยิบชนิด i อีก 1 ชิ้น เหลือที่ <code>j - w</code> ซึ่งเลือกต่อได้อีก “รวมทั้งชนิด i ซ้ำ” เพราะ F[j-w] ก็คำนวณจากของทุกชนิดอยู่แล้ว จึงไม่ต้องดูแถวก่อนหน้า (i−1)',
    ret: 'F[6] = 40 (หยิบชิ้นที่ 2 น้ำหนัก 3 สองชิ้น)',
  },
  out: 'Unbounded Value: 40',
  run() {
    const w = [2, 3], v = [10, 20], W = 6, F = Array(W + 1).fill(null), r = Rec(); F[0] = 0;
    const pn = (cur, src, item, ok) => [tbl('ของ (ชนิดละกี่ชิ้นก็ได้)', [w, v], { cl: ['ชนิด 1', 'ชนิด 2'], rl: ['w', 'v'], cur: item != null ? [0, item] : null, cur2: item != null ? [1, item] : null }), tbl('F[j] — มูลค่าสูงสุดของถุงจุ j', [F], { rl: ['F'], cl: range(0, W + 1), cur: cur != null ? [0, cur] : null, src: src || [], ok: ok || [] })];
    r.add('init', 'F[0] = 0 (ถุงจุ 0 ใส่อะไรไม่ได้)', pn(0));
    for (let j = 1; j <= W; j++) {
      F[j] = 0; let any = false;
      for (let i = 0; i < 2; i++) if (w[i] <= j) {
        any = true; const cand = F[j - w[i]] + v[i], old = F[j]; F[j] = Math.max(F[j], cand);
        r.add('upd', `j=${j}, ชนิด ${i + 1} (w=${w[i]}, v=${v[i]}): F[${j - w[i]}] + ${v[i]} = ${cand} · เทียบกับ ${old} → F[${j}] = <b>${F[j]}</b>`, pn(j, [[0, j - w[i]]], i));
      }
      if (!any) r.add('chk', `j=${j}: ไม่มีของชนิดใดใส่ได้ (w ≥ 2) → F[${j}] = 0`, pn(j));
    }
    const path = [[0, W]], pick = []; let j = W; while (j > 0) { const i = [0, 1].find(i => w[i] <= j && F[j - w[i]] + v[i] === F[j]); if (i === undefined) break; pick.push(i + 1); j -= w[i]; path.push([0, j]); }
    r.add('ret', `คำตอบ F[6] = <b>${F[W]}</b> · หยิบชนิด ${pick.join(' + ชนิด ')} (ชนิด 2 สองชิ้น: น้ำหนัก 3+3 = 6 มูลค่า 20+20 = 40)`, pn(W, [], null, path));
    return V1(r.steps);
  },

    { t: 'mc', q: 'สมการ Unbounded ต่างจาก 0/1 อย่างไร?', o: ['ไม่ต้องใช้ index ของชิ้น (i−1) เพราะหยิบซ้ำได้ ตารางจึงเหลือ 1 มิติ', 'ต้องใช้ตารางสามมิติ', 'ใช้ min แทน max', 'ไม่ต่างกัน'], a: 0, why: 'ใน 0/1 “ใส่ชิ้น i” ต้องไปดูแถว i−1 (ชิ้น i ถูกใช้แล้ว) แต่ Unbounded ของชนิดเดิมหยิบได้อีก จึงใช้ F[j−w] ได้เลย' },
    { t: 'num', q: 'ถ้า Capacity = 6 ผลลัพธ์แบบ 0/1 (แต่ละชนิดหยิบได้ชิ้นเดียว) ได้มูลค่าเท่าไร?', a: '30', why: '0/1: ใส่ทั้งสองชิ้น น้ำหนัก 2+3 = 5 ≤ 6 ได้ 10+20 = 30 (ต่ำกว่า Unbounded ที่ได้ 40)' },
  ],

/* ---------- ข้อ 9 Subset Sum ---------- */
function subsetTrace(S, target, r, pre, force) {
  const L = l => force || l;
  const n = S.length, F = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: target + 1 }, (_, j) => j === 0 ? true : (i === 0 ? false : null)));
  const rl = ['0 (ไม่มีตัวเลข)', ...S.map((s, k) => `+${s}`)];
  const pn = (cur, src, ok) => [tbl('F[i][j] = ใช้ i ตัวแรกรวมได้ j หรือไม่ (T/F)', F, { cl: range(0, target + 1), rl, cur, src: src || [], ok: ok || [] })];
  r.add(L('init'), (pre || '') + 'เริ่มต้น: คอลัมน์ 0 = True (ผลรวม 0 ได้ด้วยการไม่เลือกอะไรเลย) · แถว 0 ที่เหลือ = False', pn());
  for (let i = 1; i <= n; i++) for (let j = 1; j <= target; j++) {
    const s = S[i - 1];
    if (j < s) { F[i][j] = F[i - 1][j]; r.add(L('small'), `F[${i}][${j}]: ตัวเลข ${s} > ${j} ใช้ไม่ได้ → คัดลอกจากแถวบน = ${F[i][j] ? 'T' : 'F'}`, pn([i, j], [[i - 1, j]])); }
    else { const a = F[i - 1][j], b = F[i - 1][j - s]; F[i][j] = a || b; r.add(L('upd'), `F[${i}][${j}]: ไม่ใช้ ${s} → F[${i - 1}][${j}] = ${a ? 'T' : 'F'} · ใช้ ${s} → F[${i - 1}][${j - s}] = ${b ? 'T' : 'F'} → ${a ? 'T' : 'F'} or ${b ? 'T' : 'F'} = <b>${F[i][j] ? 'T' : 'F'}</b>`, pn([i, j], [[i - 1, j], [i - 1, j - s]])); }
  }
  const path = [[n, target]], pick = []; let j = target;
  if (F[n][target]) { for (let i = n; i >= 1; i--) { if (!F[i - 1][j]) { pick.push(S[i - 1]); j -= S[i - 1]; } path.push([i - 1, j]); } }
  r.add(L('ret'), F[n][target] ? `F[${n}][${target}] = <b>True</b> · ย้อนรอย: ช่องที่แถวบนเป็น False = ต้องใช้ตัวเลขนั้น → เซตย่อย <b>{${pick.reverse().join(', ')}}</b> ผลรวม ${pick.reduce((a, b) => a + b, 0)}` : `F[${n}][${target}] = False`, pn(null, [], F[n][target] ? path : [[n, target]]));
  return F;
}

/* ---------- ข้อ 12 & 13 Optimal BST ---------- */
function obstTrace(p, withR, r) {
  const n = p.length, C = Array.from({ length: n }, () => Array(n).fill(null)), R = Array.from({ length: n }, () => Array(n).fill(null));
  const lab = range(1, n + 1);
  const get = (i, j) => i > j ? 0 : C[i - 1][j - 1];
  const pn = (cur, src, ok) => {
    const a = [tbl('p[i] — ความน่าจะเป็นที่คีย์ i ถูกค้นหา', [p], { cl: lab, rl: ['p'] }),
      tbl('C[i][j] — ต้นทุนเฉลี่ยต่ำสุดของคีย์ i..j', C, { cl: lab, rl: lab, cur: cur ? [cur[0] - 1, cur[1] - 1] : null, src: (src || []).map(([a, b]) => [a - 1, b - 1]), ok: ok || [] })];
    if (withR) a.push(tbl('R[i][j] — คีย์ที่เป็น Root ของช่วง i..j', R, { cl: lab, rl: lab, cur: cur ? [cur[0] - 1, cur[1] - 1] : null, ok: (ok || []) }));
    return a;
  };
  for (let i = 1; i <= n; i++) { C[i - 1][i - 1] = p[i - 1]; R[i - 1][i - 1] = i; }
  r.add('diag', `ช่วงยาว 1 คีย์: C[i][i] = p[i-1] → ${p.map((x, i) => `C[${i + 1}][${i + 1}] = ${x}`).join(', ')}${withR ? ' · R[i][i] = i' : ''}`, pn());
  for (let d = 1; d < n; d++) for (let i = 1; i <= n - d; i++) {
    const j = i + d, s = rnd(range(i, j + 1).reduce((a, k) => a + p[k - 1], 0)); let best = INF, bk = 0;
    for (let k = i; k <= j; k++) {
      const a = get(i, k - 1), b = get(k + 1, j), val = rnd(a + b + s);
      r.add('val', `C[${i}][${j}], ลอง Root = คีย์ ${k}: C[${i}][${k - 1}] + C[${k + 1}][${j}] + Σp(${i}..${j}) = ${a} + ${b} + ${s} = <b>${val}</b>${val < best ? ' ← ดีที่สุดถึงตอนนี้' : ''}`,
        pn([i, j], [...(k - 1 >= i ? [[i, k - 1]] : []), ...(k + 1 <= j ? [[k + 1, j]] : [])]));
      if (val < best) { best = val; bk = k; }
    }
    C[i - 1][j - 1] = best; R[i - 1][j - 1] = bk;
    r.add('store', `C[${i}][${j}] = <b>${best}</b> ← เลือกคีย์ <b>${bk}</b> เป็น Root${i === 1 && j === n ? ' (นี่คือช่อง C[1,4] ที่โจทย์ถาม)' : ''}`, pn([i, j], [], []));
  }
  return { C, R, n, pn };
}

    n = len(p)

        for i in range(1, n - d + 1):                 #@loopi
            j = i + d                                 #@j
            min_val = float('inf')
            sum_p = sum(p[k-1] for k in range(i, j + 1))   #@sum
            for k in range(i, j + 1):                 #@loopk

                if val < min_val: min_val = val       #@min

  code: `
def matrix_chain_order(p):
    n = len(p) - 1                                    #@n
    m = [[0] * (n + 1) for _ in range(n + 1)]         #@init
    for l in range(2, n + 1):                         #@loopl
        for i in range(1, n - l + 2):                 #@loopi
            j = i + l - 1                             #@j
            m[i][j] = float('inf')                    #@inf
            for k in range(i, j):                     #@loopk
                q = m[i][k] + m[k+1][j] + p[i-1]*p[k]*p[j]   #@q
                if q < m[i][j]: m[i][j] = q           #@upd
    return m[1][n]                                    #@ret

print("Min Multiplications:", matrix_chain_order([10, 20, 30, 40]))`,

      tbl('จุดแบ่ง k ที่ดีที่สุด', s, { cl: [1, 2, 3], rl: [1, 2, 3] })];

  <p><b>ความเหมือนกับ Optimal BST:</b> ทั้งสองเป็นปัญหา “ช่วง” (Interval DP) ที่นิยามตารางด้วยจุดเริ่ม i และจุดจบ j: Optimal BST เลือกคีย์ k เป็น Root แล้วแบ่งเป็นซ้าย (i..k−1) กับขวา (k+1..j) ส่วน Matrix Chain เลือกจุดตัด k แล้วแบ่งเป็น (i..k) กับ (k+1..j) ทั้งคู่ต้อง “ลองทุก k” แล้วเลือกค่าน้อยสุด ตารางถูกเติมจากช่วงสั้นไปช่วงยาว และต้นทุนของช่วงหนึ่ง = ต้นทุนของสองช่วงย่อย + ต้นทุนของการรวม (Σp ใน BST, p[i−1]·p[k]·p[j] ใน Matrix Chain)</p>`,

P({
  n: 15, group: 3, title: 'Longest Common Subsequence (LCS)', th: 'สัญญลักษณ์ย่อยร่วมที่ยาวที่สุด',
  story: `หาความยาวของลำดับย่อยร่วมที่ยาวที่สุด ระหว่าง <code>X = "ABCBDAB"</code> และ <code>Y = "BDCABA"</code>`,
  q: `หากตัวอักษรท้ายสุดของสตริงย่อยทั้งสองตัวมีค่าไม่ตรงกัน (X[i] ≠ Y[j]) เหตุใดในสมการ DP เราจึงต้องเลือกค่าสูงสุดจากทิศทางดึงตัวแปร F[i−1][j] และ F[i][j−1]?`,
  rec: `L[i][j] = L[i−1][j−1] + 1 &nbsp; ถ้า X<sub>i</sub> = Y<sub>j</sub><br>L[i][j] = max( L[i−1][j] , L[i][j−1] ) &nbsp; ถ้า X<sub>i</sub> ≠ Y<sub>j</sub>`,
  idea: ['L[i][j] = ความยาว LCS ของ X ตัวแรก i ตัว กับ Y ตัวแรก j ตัว', 'ถ้าตัวท้ายตรงกัน → ใช้ตัวนี้ เพิ่ม 1 จากเส้นทแยง', 'ถ้าไม่ตรง → ตัวท้ายตัวใดตัวหนึ่งต้องถูกทิ้ง เลือกทางที่ดีกว่า'],
  cx: 'เวลา O(m·n) · พื้นที่ O(m·n)',
  code: `
def lcs(X, Y):
    m, n = len(X), len(Y)                             #@size
    L = [[0] * (n + 1) for _ in range(m + 1)]         #@init
    for i in range(1, m + 1):                         #@loopi
        for j in range(1, n + 1):                     #@loopj
            if X[i-1] == Y[j-1]: L[i][j] = L[i-1][j-1] + 1   #@match
            else: L[i][j] = max(L[i-1][j], L[i][j-1])        #@diff
    return L[m][n]                                    #@ret

print("LCS Length:", lcs("ABCBDAB", "BDCABA"))`,
  ex: {
    size: 'm, n = ความยาวของสตริง X และ Y',
    init: 'ตาราง (m+1)×(n+1) แถว/คอลัมน์ 0 คือสตริงว่าง ซึ่ง LCS = 0',
    loopi: 'ไล่ตัวอักษรของ X',
    loopj: 'ไล่ตัวอักษรของ Y',
    match: 'ตัวอักษรตรงกัน → ต่อท้าย LCS ของ (i−1, j−1) ด้วยตัวนี้ = +1 จากเส้นทแยง',
    diff: '<b>ไม่ตรงกัน:</b> ตัวท้ายของ X หรือของ Y ต้องถูกทิ้ง อย่างใดอย่างหนึ่ง (หรือทั้งคู่) → เลือกทางที่ LCS ยาวกว่า: ทิ้งตัวท้าย X (L[i−1][j]) หรือทิ้งตัวท้าย Y (L[i][j−1])',
    ret: 'ความยาว LCS = 4 (เช่น BCBA, BDAB)',
  },
  out: 'LCS Length: 4',
  run() {
    const X = 'ABCBDAB', Y = 'BDCABA', m = 7, n = 6, L = Array.from({ length: m + 1 }, (_, i) => Array.from({ length: n + 1 }, (_, j) => (i === 0 || j === 0) ? 0 : null)), r = Rec();
    const pn = (cur, src, ok, txt) => [tbl('L[i][j] — ความยาว LCS ของ X[1..i] กับ Y[1..j]', L, { cl: ['-', ...Y], rl: ['-', ...X], cur, src: src || [], ok: ok || [] }), textP('X / Y', `X = ${X}<br>Y = ${Y}${txt ? '<br>' + txt : ''}`)];
    r.add('init', 'แถว 0 และคอลัมน์ 0 = 0 (สตริงว่างไม่มีอะไรร่วมกัน)', pn());
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      if (X[i - 1] === Y[j - 1]) { L[i][j] = L[i - 1][j - 1] + 1; r.add('match', `X[${i}]='${X[i - 1]}' = Y[${j}]='${Y[j - 1]}' ตรงกัน → L[${i - 1}][${j - 1}] + 1 = <b>${L[i][j]}</b>`, pn([i, j], [[i - 1, j - 1]])); }
      else { const a = L[i - 1][j], b = L[i][j - 1]; L[i][j] = Math.max(a, b); r.add('diff', `X[${i}]='${X[i - 1]}' ≠ Y[${j}]='${Y[j - 1]}' → max(บน ${a}, ซ้าย ${b}) = <b>${L[i][j]}</b>`, pn([i, j], [[i - 1, j], [i, j - 1]])); }
    }
    const path = [[m, n]]; let i = m, j = n, s = '';
    while (i > 0 && j > 0) { if (X[i - 1] === Y[j - 1]) { s = X[i - 1] + s; i--; j--; } else if (L[i - 1][j] >= L[i][j - 1]) i--; else j--; path.push([i, j]); }
    r.add('ret', `ความยาว LCS = <b>${L[m][n]}</b> · ย้อนรอยจากมุมล่างขวา (ตรงกัน = ถอยเฉียง, ไม่ตรง = ไปทางที่มากกว่า) ได้สตริง “<b>${s}</b>”`, pn(null, [], path, `LCS = ${s}`));
    return V1(r.steps);
  },

/* ================= กลุ่มที่ 4: Warshall's & Floyd's Algorithms (ข้อ 16-20) ================= */
const GP4 = [[70, 50], [250, 50], [250, 190], [70, 190]];
const GP3 = [[160, 40], [280, 190], [40, 190]];
const uniqEdges = list => { const m = new Map(); list.forEach(e => { if (e[0] !== e[1]) m.set(e[0] + '>' + e[1], e); }); return [...m.values()]; };
const origEdges = (W, weighted) => { const e = []; W.forEach((row, i) => row.forEach((v, j) => { if (i !== j && v !== INF && (weighted || v)) e.push([i, j, weighted ? String(v) : '', 'orig']); })); return e; };

/* Floyd core with trace; returns final D,P */
function floydTrace(W, r, o = {}) {
  const n = W.length, D = cl(W), P = Array.from({ length: n }, () => Array(n).fill(-1)), pos = o.pos || GP4, orig = origEdges(W, true);
  const pn = (cur, src, k, extra, ok) => {
    const a = [graphP('กราฟถ่วงน้ำหนัก (ทึบ = เส้นเดิม · ประ = ทางอ้อมที่ผ่าน k)', { pos, n, edges: uniqEdges([...orig, ...(extra || [])]) }, { nodes: k != null ? { [k]: 'mid' } : {} }),
      tbl('D[i][j] — ระยะทางสั้นสุดที่รู้ตอนนี้', D, { cl: range(0, n), rl: range(0, n), cur, src: src || [], rowK: k, colK: k, ok: ok || [] })];
    if (o.withP) a.push(tbl('P[i][j] — ปมกลางทาง (−1 = ตรงถึงกัน)', P, { cl: range(0, n), rl: range(0, n), cur, rowK: null, colK: null, ok: [] }));
    return a;
  };
  r.add(o.initLine || 'copy', 'D เริ่มต้นเท่ากับ Matrix น้ำหนักตรงๆ (∞ = ไม่มีเส้นเชื่อมตรง)' + (o.withP ? ' · P เริ่มที่ −1' : ''), pn());
  const changes = [];
  for (let k = 0; k < n; k++) {
    r.add(o.kLine || 'loopk', `<b>k = ${k}</b>: ลองให้ปม ${k} เป็นจุดผ่านกลาง — ตรวจทุกคู่ (i, j) ว่า i→${k}→j สั้นกว่าเดิมไหม`, pn(null, [], k));
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const via = D[i][k] + D[k][j];
      if (via < D[i][j]) {
        const old = D[i][j]; D[i][j] = via; if (o.withP) P[i][j] = k; changes.push({ k, i, j, old, via });
        r.add(o.updLine || 'upd', `k=${k}: D[${i}][${k}] + D[${k}][${j}] = ${inf(D[i][k])} + ${inf(D[k][j])} = <b>${via}</b> &lt; D[${i}][${j}] = ${inf(old)} → <b>อัปเดต D[${i}][${j}] = ${via}</b>${o.withP ? ` (P[${i}][${j}] = ${k})` : ''}`,
          pn([i, j], [[i, k], [k, j]], k, [[i, k, String(D[i][k]), 'hl'], [k, j, String(D[k][j]), 'hl'], [i, j, String(via), 'new']]));
      }
    }
  }
  return { D, P, changes, pn };
}
const fmtCells = (ch, W = null) => ch.map(c => `D[${c.i}][${c.j}] (${inf(c.old)} → ${c.via})`).join(', ');
const W17 = [[0, 3, INF, 7], [8, 0, 2, INF], [5, INF, 0, 1], [2, INF, INF, 0]];
const F17 = (() => { const r = Rec(); return floydTrace(W17, r, { withP: true }); })();
const at = (arr, k) => arr.filter(c => c.k === k);

def floyd_with_path(graph):
    n = len(graph)

    for k in range(n):                                #@loopk
        for i in range(n):
            for j in range(n):
                if D[i][k] + D[k][j] < D[i][j]:       #@cmp
                    D[i][j] = D[i][k] + D[k][j]
                    P[i][j] = k                       #@pset
    return D, P                                       #@ret

_, path_table = floyd_with_path(weight_matrix)

    k = P[i][j]                                       #@gk
    if k == -1: return [i, j]                         #@direct

    const gp = (i, j, depth, out) => {
      const k = f.P[i][j], pad = '&nbsp;&nbsp;'.repeat(depth);

}
function graphHtml(pn) {
  const { pos, n, edges } = pn.g, R = 18, uid = 'g' + Math.floor(Math.random() * 1e6);
  const mk = c => `<marker id="${uid}-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-${c}" d="M0 0L10 5L0 10z"/></marker>`;
  const es = edges.map(([u, v, lab, cls]) => {
    const [x1, y1] = pos[u], [x2, y2] = pos[v], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const a = [x1 + ux * R, y1 + uy * R], b = [x2 - ux * (R + 4), y2 - uy * (R + 4)], off = 22, cx = (x1 + x2) / 2 - uy * off, cy = (y1 + y2) / 2 + ux * off;

  }).join('');

function layoutTree(nodes) {
  const kids = nodes.map(() => []); nodes.forEach(nd => { if (nd.parent >= 0) kids[nd.parent].push(nd.id); });

  if (nodes.length === 0) return { pos, w: 0, h: 0 };
  if (bst) { (function go(id, d) { const L = kids[id].find(c => nodes[c].side === 'L'), Rr = kids[id].find(c => nodes[c].side === 'R'); if (L !== undefined) go(L, d + 1); pos[id] = { x: x++, d }; maxD = Math.max(maxD, d); if (Rr !== undefined) go(Rr, d + 1); })(0, 0); }

  const P = id => ({ x: 10 + pos[id].x * sw + sw / 2 - 7, y: 6 + pos[id].d * sh + nh / 2 });

    fringe().forEach(i=>edges[i]='e-fringe');
    ET.forEach(i=>edges[i]='e-tree');
    if(minE>=0)edges[minE]='e-cand';
    return {nodes,edges,text,hl,
      meta:`<span>VT = {${[...inT].join(', ')}}</span><span>ET = {${ET.map(enm).join(', ')||'∅'}}</span><span>น้ำหนักรวม = <b>${total}</b></span>`,
      chipsTitle:'เส้นที่ข้ามจากต้นไม้ไปยังโหนดที่เหลือ (fringe edges)',
      chips:fringe().map(i=>({t:`${enm(i)} ${g.edges[i].w}`,cls:i===minE?'hot':''})),
      rows:rows.slice()};
  };
  const ch0=relax(s);
  rows.push(mkRow(s,ch0));
  steps.push(snap({hl:[1,2],changed:ch0,text:`<b>เริ่มต้น:</b> ใส่โหนด <b>${s}</b> เข้า VT (โหนดไหนก็ได้เป็นจุดเริ่ม) และให้ ET ว่าง. จากนั้นทุกโหนดที่เหลือเก็บค่า <code>v(parent, weight)</code> คือ "เส้นที่เบาที่สุดที่ต่อเข้าต้นไม้ได้ตอนนี้". โหนดที่ยังไม่ติดกับต้นไม้ยังเป็น (−, ∞)`}));
  for(let i=1;i<n;i++){
    const m=pick();
    if(m===null)break;
    const e=parE[m],fr=fringe();
    const ties=remaining().filter(v=>key[v]===key[m]).length>1;
    steps.push(snap({hl:[3,4,5],minV:m,minE:e,text:`<b>รอบที่ ${i}:</b> เส้นที่ข้ามจากต้นไม้ไปยังโหนดที่เหลือมี ${fr.map(j=>`<b>${enm(j)}</b> (${g.edges[j].w})`).join(', ')}. เส้นที่น้ำหนัก<b>น้อยที่สุด</b>คือ <b>${enm(e)} (${g.edges[e].w})</b> จึงเลือกโหนด <b>${m}</b>${ties?' (มีหลายเส้นน้ำหนักเท่ากัน เลือกตามลำดับโหนด)':''}.<br>เหตุผล: เส้นที่เบาที่สุดที่ออกจากต้นไม้ปลอดภัยที่จะเลือกเสมอ เพราะโหนดนี้ต้องต่อเข้ามาอยู่แล้ว และการต่อด้วยเส้นเบาสุดไม่มีทางทำให้น้ำหนักรวมแย่ลง จึงตัดสินใจได้เลยโดยไม่ต้องย้อนกลับมาแก้`}));
    inT.add(m);ET.push(e);total+=g.edges[e].w;order.push(m);
    const ch=relax(m);
    rows.push(mkRow(m,ch));
    const chs=Object.keys(ch).map(v=>`${v}: ${fmtD(ch[v].k)} → ${key[v]} (ผ่าน ${m})`);
    steps.push(snap({hl:[6,7],changed:ch,text:`เพิ่ม <b>${m}</b> เข้า VT และเส้น <b>${enm(e)}</b> เข้า ET. จากนั้นอัปเดต <code>(parent, weight)</code> ของโหนดที่ติดกับ ${m}: ${chs.length?chs.join(', ')+' (เปลี่ยนเมื่อเส้นใหม่<b>เบากว่า</b>ค่าเดิมเท่านั้น ค่าเดิมจะถูกขีดฆ่า)':'ไม่มีค่าใดเปลี่ยน'}.`}));
  }
  const fin=snap({hl:[8],text:`<b>เสร็จ:</b> ET มี ${ET.length} เส้น = |V| − 1 = ${n-1} เส้น คือ {${ET.map(enm).join(', ')}} น้ำหนักรวม = <b>${total}</b> ลำดับโหนดที่ถูกเลือก: ${order.join(', ')}`});
  steps.push(fin);
  steps.result={order,total,edges:ET.map(enm)};
  return steps;
}

/* ---------- Kruskal ---------- */
const PAL=[210,150,32,280,340,58,190,100];
function kruskalSteps(g){
  const V=g.nodes.map(n=>n.id),n=V.length;
  const sorted=g.edges.map((e,i)=>({i,w:e.w,name:edgeName(e),u:e.u,v:e.v})).sort((a,b)=>a.w-b.w||a.i-b.i);
  const par={};V.forEach(v=>par[v]=v);
  const find=x=>{while(par[x]!==x)x=par[x];return x};
  const status=sorted.map(()=> '');
  const ET=[],rows=[],steps=[];let ec=0,total=0;
  const comps=()=>{const m={};V.forEach(v=>{const r=find(v);(m[r]||(m[r]=[])).push(v)});return Object.values(m)};
  const compOf=v=>V.filter(x=>find(x)===find(v));
  const setStr=a=>'{'+a.join(', ')+'}';
  const hue=c=>PAL[V.indexOf(c[0])%PAL.length];
  const pathBetween=(a,b)=>{const adj={};V.forEach(v=>adj[v]=[]);ET.forEach(i=>{const e=g.edges[i];adj[e.u].push(e.v);adj[e.v].push(e.u)});const prev={[a]:null},q=[a];while(q.length){const x=q.shift();if(x===b)break;adj[x].forEach(y=>{if(!(y in prev)){prev[y]=x;q.push(y)}})}const p=[];let c=b;while(c!==null&&c!==undefined){p.unshift(c);c=prev[c]}return p};
  const snap=({text,hl,ptr=-1,cur=-1,rejE=-1,cycle=null,final=false})=>{
    const nodes={},edges={};
    comps().forEach(c=>{if(c.length>1){const col=`hsl(${hue(c)} 70% 50%)`;c.forEach(v=>nodes[v]={color:col})}});
    if(cycle)cycle.forEach(v=>nodes[v]={...(nodes[v]||{}),cls:'n-rej'});
    ET.forEach(i=>edges[i]='e-tree');
    if(cur>=0)edges[sorted[cur].i]='e-cand';
    if(rejE>=0)edges[sorted[rejE].i]='e-rej flash';
    const chips=sorted.map((s,p)=>({t:`${s.name} ${s.w}`,cls:(status[p]==='ok'?'ok':status[p]==='rej'?'bad':(final&&!status[p]?'skip':''))+(p===ptr?' ptr':'')}));
    const cs=comps().map(c=>`<i class="grp" style="--c:${c.length>1?`hsl(${hue(c)} 70% 50%)`:'var(--idle)'}">${setStr(c)}</i>`).join(' ');
    return {nodes,edges,text,hl,chips,chipsTitle:'Sorted list of edges (น้ำหนักน้อย → มาก)',
      meta:`<span>ecounter = <b>${ec}</b> / ${n-1}</span><span>กลุ่ม (Union-Find): ${cs}</span><span>น้ำหนักรวม = <b>${total}</b></span>`,
      rows:rows.slice()};
  };
  steps.push(snap({hl:[1,2,3],text:`<b>เริ่มต้น:</b> เรียงเส้นทั้งหมดจากน้ำหนักน้อยไปมาก (ถ้าเท่ากันคงลำดับตามข้อมูลเดิม) ให้ ET ว่าง และ ecounter = 0. ตอนแรกทุกโหนดเป็นกลุ่มของตัวเอง (ยังไม่มีเส้นใดในต้นไม้) เป้าหมายคือรับให้ครบ ${n-1} เส้น`}));
  for(let k=0;k<sorted.length&&ec<n-1;k++){
    const s=sorted[k],cu=compOf(s.u),cv=compOf(s.v),same=find(s.u)===find(s.v);
    steps.push(snap({hl:[4,5,6],ptr:k,cur:k,text:`<b>เส้นที่ ${k+1}:</b> <b>${s.name}</b> (น้ำหนัก ${s.w}) เป็นเส้นที่เบาที่สุดในบรรดาเส้นที่ยังไม่ได้พิจารณา. ตรวจว่าเกิดวงจรไหม: ${s.u} อยู่ในกลุ่ม ${setStr(cu)} และ ${s.v} อยู่ในกลุ่ม ${setStr(cv)} → ${same?'<b>กลุ่มเดียวกัน</b> มีทางเชื่อมกันอยู่แล้ว ถ้าเพิ่มเส้นนี้จะเกิดวงจร':'<b>คนละกลุ่ม</b> เชื่อมกันแล้วไม่เกิดวงจร'}`}));
    if(!same){
      par[find(s.u)]=find(s.v);ET.push(s.i);ec++;total+=s.w;status[k]='ok';
      rows.push({tree:`${s.name} ${s.w}`,list:sorted.map((x,p)=>({t:`${x.name} ${x.w}`,cls:p===k?'b':status[p]==='rej'?'x':''}))});
      steps.push(snap({hl:[6,7],ptr:k,text:`✅ <b>รับเส้น ${s.name}</b> เข้า ET และรวมสองกลุ่มเป็น ${setStr(compOf(s.u))} (สีของกลุ่มกลืนกัน). ecounter = ${ec} / ${n-1}.<br>เหตุผล: เส้นนี้เบาที่สุดในบรรดาเส้นที่เหลือ และไม่ทำให้เกิดวงจร จึงปลอดภัยที่จะเลือกโดยไม่ต้องกลับมาแก้`}));
    }else{
      const p=pathBetween(s.u,s.v);status[k]='rej';
      steps.push(snap({hl:[6],ptr:k,rejE:k,cycle:p,text:`❌ <b>ปฏิเสธเส้น ${s.name}</b> เพราะเกิดวงจร: <b>${p.concat(p[0]).join('–')}</b>.<br>เหตุผล: ${s.u} กับ ${s.v} ถูกเชื่อมกันด้วยเส้นที่เบากว่า (หรือเท่ากัน) ที่รับไปแล้ว การเพิ่มเส้นนี้ไม่ช่วยให้ต่อโหนดเพิ่ม มีแต่ทำให้น้ำหนักรวมมากขึ้น`}));
    }
  }
  steps.push(snap({hl:[8],final:true,text:`<b>เสร็จ:</b> ecounter = ${ec} = |V| − 1 จึงหยุด${sorted.some((s,p)=>!status[p])?' (เส้นที่เหลือไม่ต้องพิจารณาอีก)':''}. ET = {${ET.map(i=>edgeName(g.edges[i])).join(', ')}} น้ำหนักรวม = <b>${total}</b>`}));
  steps.result={total,edges:ET.map(i=>edgeName(g.edges[i])),sorted:sorted.map(s=>s.name+s.w)};
  return steps;
}

/* ---------- Dijkstra ---------- */
function dijkstraSteps(g,s){
  const V=g.nodes.map(n=>n.id),n=V.length,idx=edgeMap(g);
  const d={},p={},pE={},VT=new Set();
  V.forEach(v=>{d[v]=INF;p[v]=null;pE[v]=-1});d[s]=0;
  const rows=[],steps=[];let upd={},cur=null;
  const cmp=(a,b)=>(d[a]<d[b]?-1:d[a]>d[b]?1:0)||V.indexOf(a)-V.indexOf(b);
  const PQ=()=>V.filter(v=>!VT.has(v)).sort(cmp);
  const refresh=()=>{if(!rows.length)return;const q=PQ(),m=q.length&&d[q[0]]<INF?q[0]:null;
    rows[rows.length-1].rem=V.filter(v=>!VT.has(v)).map(v=>({v,p:p[v],txt:(upd[v]!==undefined&&d[cur]!==0)?`${d[cur]}+${upd[v]}`:fmtD(d[v]),bold:v===m,ch:upd[v]!==undefined}))};
  const pathTo=v=>{const a=[];let c=v;while(c!==null){a.unshift(c);c=p[c]}return a};
  const snap=o=>{
    refresh();
    const nodes={},edges={};
    V.forEach(v=>{
      let cls=VT.has(v)?'n-tree':d[v]<INF?'n-fr':'';
      if(o.tv===v)cls='n-cand';
      let sub=`d=${fmtD(d[v])}`;
      if(o.tween&&o.tween[v])sub={tween:o.tween[v],prefix:'d='};
      nodes[v]={cls,sub};
    });
    V.forEach(v=>{if(v!==s&&pE[v]>=0)edges[pE[v]]=VT.has(v)?'e-tree':'e-fringe'});
    if(o.relaxE>=0)edges[o.relaxE]=o.relaxCls;
    const q=o.pq||PQ();
    return {nodes,edges,text:o.text,hl:o.hl,
      chipsTitle:'Priority Queue Q (โหนดที่ยังไม่อยู่ใน VT เรียง d จากน้อยไปมาก)',
      chips:q.map(v=>({t:`${v}: ${fmtD(d[v])}`,cls:o.hot===v?'hot lv':''})),
      meta:`<span>VT = {${[...VT].join(', ')}}</span>`,
      rows:rows.map(r=>({tree:r.tree,rem:r.rem.map(x=>({...x}))})),
      final:o.final?{p:{...p},pE:{...pE},d:{...d}}:null};
  };
  steps.push(snap({hl:[1,2,3,4,5,6],hot:s,text:`<b>เริ่มต้น:</b> ทุกโหนดตั้ง <code>d = ∞</code>, <code>p = null</code> แล้วใส่เข้า priority queue. ตั้ง <b>d(${s}) = 0</b> เพราะระยะจากต้นทางถึงตัวเองคือ 0 ${s} จึงอยู่หน้าสุดของคิว`}));
  for(let i=0;i<n;i++){
    const q0=PQ(),u=q0[0];
    if(u===undefined||d[u]===INF)break;
    VT.add(u);cur=u;upd={};
    rows.push({tree:`${u}(${p[u]??'−'}, ${d[u]})`,rem:[]});
    steps.push(snap({pq:q0,hot:u,hl:[7,8,9],text:`<b>รอบที่ ${i+1}:</b> DeleteMin(Q) ได้ <b>${u}</b> ที่ d = <b>${d[u]}</b> ซึ่งน้อยที่สุดในคิว จึงย้ายเข้า VT (ค่านี้ถือว่าสุดท้ายแล้ว)${p[u]?` และเส้น ${p[u]}–${u} เข้าต้นไม้เส้นทางสั้นสุด`:''}.<br>เหตุผล: เส้นทางอื่นไปโหนดนี้ต้องผ่านโหนดที่ยังอยู่ในคิวซึ่ง d ไม่น้อยกว่านี้ แล้วยังต้องบวกน้ำหนักที่ไม่ติดลบอีก จึงสั้นกว่านี้ไม่ได้`}));
    V.forEach(v=>{
      if(VT.has(v))return;
      const ei=idx[u+'|'+v];if(ei===undefined)return;
      const w=g.edges[ei].w,cand=d[u]+w,old=d[v],better=cand<old;
      const eq=`d(${u}) + w(${u},${v}) = ${d[u]} + ${w} = ${cand}  ${better?'<':'≮'}  d(${v}) = ${fmtD(old)}`;
      if(better){d[v]=cand;p[v]=u;pE[v]=ei;upd[v]=w}
      steps.push(snap({hl:better?[10,11,12,13]:[10,11],tv:better?v:null,relaxE:better?ei:ei,relaxCls:better?'e-cand':'e-rej',tween:better?{[v]:[old,cand]}:null,
        text:`ขยายจาก <b>${u}</b> ไปยัง <b>${v}</b> (เส้น ${u}–${v} น้ำหนัก ${w}):<span class="eq ${better?'yes':'no'}">${eq}</span>${better?`✓ ทางผ่าน ${u} <b>สั้นกว่า</b> จึงอัปเดต d(${v}) = ${cand}, p(${v}) = ${u} และ Decrease ในคิว`:`✗ ไม่ได้ทางที่สั้นกว่า จึงคงค่าเดิม d(${v}) = ${fmtD(old)}`}`}));
    });
  }
  const lines=V.filter(v=>v!==s&&d[v]<INF).map(v=>`<span>${s} → ${v}: <b>${d[v]}</b> (${pathTo(v).join('–')})</span>`).join('');
  steps.push(snap({final:true,hl:[],text:`<b>เสร็จ:</b> โหนดทุกตัวอยู่ใน VT แล้ว ได้ระยะสั้นที่สุดจาก ${s} ไปทุกโหนด:<div class="pathlist">${lines}</div><br><span class="muted">คลิกที่โหนดบนกราฟเพื่อไฮไลต์เส้นทางนั้น</span>`}));
  steps.result={d:{...d},p:{...p}};
  return steps;
}

/* ---------- Coin ---------- */
function coinDP(coins,amount){
  const dp=[0],from=[-1];
  for(let a=1;a<=amount;a++){dp[a]=INF;from[a]=-1;for(const c of coins){if(c<=a&&dp[a-c]+1<dp[a]){dp[a]=dp[a-c]+1;from[a]=c}}}
  if(dp[amount]===INF)return null;
  const list=[];let a=amount;while(a>0){list.push(from[a]);a-=from[a]}
  return {count:dp[amount],list:list.sort((x,y)=>y-x)};
}
function coinSteps(coins,amount){
  const cs=[...new Set(coins)].sort((a,b)=>b-a);
  const steps=[],lines=[],taken=[];let r=amount;
  const snap=(o)=>({coins:cs,active:o.active??null,r,taken:taken.slice(),lines:lines.slice(),text:o.text,hl:o.hl,newCoin:!!o.newCoin,final:!!o.final});
  steps.push(snap({hl:[1],text:`<b>เริ่มต้น:</b> ต้องทอน <b>${amount}</b> บาท ด้วยเหรียญ {${cs.slice().reverse().join(', ')}}. เรียงเหรียญจากค่ามากไปน้อย แล้วใช้เหรียญใหญ่ที่สุดที่ยังไม่เกินยอดคงเหลือเสมอ เพื่อให้ยอดที่เหลือน้อยที่สุดในทุกก้าว (ไม่ย้อนกลับมาแก้)`}));
  for(const c of cs){
    if(r===0)break;
    const k=Math.floor(r/c);
    steps.push(snap({active:c,hl:[2,3],text:k>0?`พิจารณาเหรียญ <b>${c}</b>: ยอดคงเหลือ ${r} ≥ ${c} จึงใช้ได้ ${k} เหรียญ (${r} ÷ ${c} ปัดลง = ${k})`:`พิจารณาเหรียญ <b>${c}</b>: ${c} มากกว่ายอดคงเหลือ ${r} ใช้ไม่ได้ จึงข้ามไปเหรียญที่เล็กกว่า`}));
    const before=r;
    for(let j=1;j<=k;j++){
      r-=c;taken.push(c);
      if(j===k)lines.push(`${before} − (${c}×${k}) = ${r}`);
      steps.push(snap({active:c,hl:[3,4],newCoin:true,text:`หยิบเหรียญ <b>${c}</b> ใส่ถาด (เหรียญที่ ${taken.length}) ยอดคงเหลือ ${r+c} − ${c} = <b>${r}</b>${j===k&&r>0?`. ใช้เหรียญ ${c} ต่อไม่ได้แล้ว (${r} < ${c})`:''}`}));
    }
  }
  steps.push(snap({final:true,hl:[5],text:r===0?`<b>เสร็จ:</b> ยอดคงเหลือ 0 ใช้ทั้งหมด <b>${taken.length} เหรียญ</b>: ${taken.join(' + ')} = ${amount}`:`<b>ทอนไม่ได้:</b> ยอดคงเหลือ ${r} แต่ไม่มีเหรียญที่เล็กพอ (Greedy ไม่ย้อนกลับไปเปลี่ยนเหรียญที่หยิบไปแล้ว)`}));
  steps.result={taken:taken.slice(),left:r};
  return steps;
}

/* ---------- Huffman ---------- */
const hfmt=w=>String(+(w/10000).toFixed(4));
function huffSteps(items){
  let seq=0;
  const leaves=items.map(it=>({id:'n'+seq,seq:seq++,sym:it.sym,w:it.w,l:null,r:null}));
  const sortQ=q=>q.slice().sort((a,b)=>a.w-b.w||a.seq-b.seq);
  const syms=nd=>nd.sym!==null&&nd.sym!==undefined?nd.sym:syms(nd.l)+syms(nd.r);
  const lab=nd=>nd.l?`${hfmt(nd.w)}`:`${nd.sym} ${hfmt(nd.w)}`;
  let Q=sortQ(leaves);
  const rows=[Q.map(lab)],steps=[];
  const codes={};
  const base=o=>({q:Q.slice(),picked:o.picked||[],newId:o.newId||null,bits:!!o.bits,path:o.path||null,codes:{...(o.codes||{})},text:o.text,hl:o.hl,rows:rows.map(r=>r.slice()),chips:Q.map(x=>({t:lab(x),sub:x.l?syms(x):'',cls:(o.picked||[]).includes(x.id)?'hot':(x.id===o.newId?'ok':'')})),chipsTitle:'คิวของก้อนความถี่ (น้อย → มาก)',roots:Q.slice(),final:!!o.final});
  steps.push(base({hl:[1],text:`<b>เริ่มต้น:</b> ตัวอักษรแต่ละตัวเป็นต้นไม้ 1 โหนด น้ำหนัก = ความถี่ เรียงคิวจากน้อยไปมาก: ${Q.map(lab).join(' · ')}`}));
  let k=0;
  while(Q.length>1){
    k++;
    const a=Q[0],b=Q[1];
    steps.push(base({picked:[a.id,b.id],hl:[2,3],text:`<b>รอบที่ ${k}:</b> หยิบสองก้อนที่น้อยที่สุดจากหน้าคิว: <b>${lab(a)}</b> และ <b>${lab(b)}</b>.<br>เหตุผล: ตัวที่ความถี่ต่ำที่สุดควรได้รหัสยาวที่สุด จึงรวมมันไว้ก่อนเพื่อให้อยู่ลึกที่สุดในต้นไม้ ส่วนตัวที่ถี่มากจะถูกรวมทีหลังและอยู่ตื้น (รหัสสั้น)`}));
    const nd={id:'n'+seq,seq:seq++,sym:null,w:a.w+b.w,l:a,r:b};
    Q=sortQ([...Q.slice(2),nd]);
    rows.push(Q.map(lab));
    steps.push(base({newId:nd.id,hl:[4,5,6],text:`รวมเป็นโหนดใหม่ น้ำหนัก ${hfmt(a.w)} + ${hfmt(b.w)} = <b>${hfmt(nd.w)}</b> โดยก้อนที่เล็กกว่าอยู่ซ้าย (${syms(a)}) และอีกก้อนอยู่ขวา (${syms(b)}). แล้วแทรกกลับเข้าคิวตามตำแหน่งที่เรียงถูกต้อง (ถ้าค่าเท่ากัน ก้อนที่เข้าคิวก่อนอยู่ก่อน)`}));
  }
  const root=Q[0];
  const walk=(nd,c)=>{if(!nd.l){codes[nd.sym]=c||'0';return}walk(nd.l,c+'0');walk(nd.r,c+'1')};
  walk(root,'');
  steps.push(base({bits:true,hl:[7],text:`เหลือต้นไม้เดียว (รากมีน้ำหนัก ${hfmt(root.w)}). ติดเลข <b>0</b> ที่กิ่งซ้าย และ <b>1</b> ที่กิ่งขวาทุกกิ่ง`}));
  const pathTo=(nd,sym,acc)=>{if(!nd.l)return nd.sym===sym?[...acc,nd.id]:null;return pathTo(nd.l,sym,[...acc,nd.id])||pathTo(nd.r,sym,[...acc,nd.id])};
  const shown={};
  items.forEach(it=>{
    shown[it.sym]=codes[it.sym];
    steps.push(base({bits:true,path:new Set(pathTo(root,it.sym,[])),codes:shown,hl:[8],text:`ไล่จากรากไปถึงใบ <b>${it.sym}</b> ตามกิ่ง ${codes[it.sym].split('').join(' → ')} ได้ codeword = <b>${codes[it.sym]}</b> (ยาว ${codes[it.sym].length} บิต)`}));
  });
  const tot=items.reduce((s,x)=>s+x.w,0);
  const avg=items.reduce((s,x)=>s+codes[x.sym].length*x.w,0)/tot;
  const fixed=Math.max(1,Math.ceil(Math.log2(items.length)));
  const ratio=(fixed-avg)/fixed*100;
  steps.push(base({bits:true,codes,final:true,hl:[],text:`<b>เสร็จ:</b> ได้รหัส ${items.map(x=>`${x.sym}=${codes[x.sym]}`).join(', ')}. ไม่มี codeword ใดเป็น prefix ของอีกตัว (เพราะทุกตัวอยู่ที่ใบ) จึงถอดรหัสได้ไม่กำกวม. จำนวนบิตเฉลี่ย ${+avg.toFixed(4)} เทียบกับรหัสความยาวคงที่ ${fixed} บิต ลดได้ ${+ratio.toFixed(2)}%`}));
  steps.result={codes,avg,fixed,ratio,root,tot};
  return steps;
}
const huffEncode=(codes,text)=>{let o='';for(const ch of text){if(!(ch in codes))return {err:`ไม่มีตัวอักษร "${ch}" ในตาราง`};o+=codes[ch]}return {bits:o}};
function huffDecodeSteps(root,bits){
  const steps=[];let node=root,path=[root.id],out='',buf='';
  steps.push({path:new Set(path),out,i:-1,text:'เริ่มที่ราก ยังไม่ได้อ่านบิต'});
  for(let i=0;i<bits.length;i++){
    const b=bits[i];node=b==='0'?node.l:node.r;path.push(node.id);buf+=b;
    if(!node.l){out+=node.sym;steps.push({path:new Set(path),out,i,text:`อ่านบิต ${b} ถึงใบ <b>${node.sym}</b> (รหัส ${buf}) จึงถอดได้ ${node.sym} แล้วกลับไปเริ่มที่ราก`});node=root;path=[root.id];buf=''}
    else steps.push({path:new Set(path),out,i,text:`อ่านบิต ${b} เดินไปทาง${b==='0'?'ซ้าย (0)':'ขวา (1)'} ยังไม่ถึงใบ`});
  }
  if(buf)steps.push({path:new Set(path),out,i:bits.length-1,text:`<span class="warn">บิตหมดก่อนถึงใบ: "${buf}" ยังไม่ครบ codeword</span>`});
  return steps;
}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const svgEl=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function tweenNum(el,from,to,fmt=x=>x){
  if(el._tw){cancelAnimationFrame(el._tw);el._tw=0}
  if(RM||from===null||from===to||from===undefined){el.textContent=fmt(to);return}
  const t0=performance.now(),D=450;
  const f=now=>{const k=Math.min(1,(now-t0)/D);el.textContent=fmt(Math.round(from+(to-from)*k));el._tw=k<1?requestAnimationFrame(f):0};
  el._tw=requestAnimationFrame(f);
}

/* ================= StepPlayer ================= */
class StepPlayer{
  constructor(host,onStep){
    this.host=host;this.onStep=onStep;this.steps=[];this.i=0;this.playing=false;this.speed=1;this.timer=null;
    host.classList.add('player');
    const uid='pl'+Math.random().toString(36).slice(2,7);
    host.innerHTML=`<div class="pl-row">
      <button class="btn" type="button" data-a="reset" aria-label="รีเซ็ต">⏮ รีเซ็ต</button>
      <button class="btn" type="button" data-a="prev" aria-label="ย้อนกลับ">◀ ย้อนกลับ</button>
      <button class="btn primary" type="button" data-a="next" aria-label="ถัดไป">ถัดไป ▶</button>
      <button class="btn" type="button" data-a="play" aria-label="เล่นอัตโนมัติ">⏯ เล่นอัตโนมัติ</button></div>
      <div class="pl-row2">
        <label class="pl-prog" for="${uid}-p"><span class="pl-count">ขั้นที่ 1 / 1</span><input id="${uid}-p" type="range" min="0" max="0" value="0" aria-label="ไปยังขั้นที่"></label>
        <label class="pl-speed" for="${uid}-s">ความเร็ว <input id="${uid}-s" type="range" min="0.5" max="3" step="0.5" value="1"><output>1x</output></label>
      </div>
      <p class="hint">คีย์บอร์ด: <span class="kbd">←</span> <span class="kbd">→</span> เปลี่ยนขั้น · <span class="kbd">Space</span> เล่น/หยุด · <span class="kbd">R</span> รีเซ็ต</p>`;
    this.count=$('.pl-count',host);this.prog=$('.pl-prog input',host);this.spd=$('.pl-speed input',host);this.out=$('.pl-speed output',host);this.playBtn=$('[data-a=play]',host);
    host.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='reset')this.reset();else if(a==='prev')this.prev();else if(a==='next')this.next();else this.toggle()});
    this.prog.addEventListener('input',()=>{this.pause();this.go(+this.prog.value)});
    this.spd.addEventListener('input',()=>{this.speed=+this.spd.value;this.out.textContent=this.speed+'x'});
  }
  setSteps(steps,i=0){this.pause();this.steps=steps;this.prog.max=Math.max(0,steps.length-1);this.i=-1;this.go(Math.min(i,steps.length-1),0)}
  go(i,dirOverride){
    i=Math.max(0,Math.min(this.steps.length-1,i));
    const dir=dirOverride!==undefined?dirOverride:(i===this.i+1?1:i<this.i?-1:0);
    this.i=i;this.prog.value=i;
    const n=this.steps.length;
    this.count.textContent=`ขั้นที่ ${i+1} / ${n}`;
    this.prog.style.setProperty('--p',(n>1?i/(n-1)*100:100)+'%');
    this.onStep(this.steps[i],i,dir);
  }
  next(){this.pause();this.go(this.i+1)}
  prev(){this.pause();this.go(this.i-1)}
  reset(){this.pause();this.go(0,0)}
  toggle(){this.playing?this.pause():this.play()}
  play(){
    if(this.i>=this.steps.length-1)this.go(0,0);
    this.playing=true;this.playBtn.textContent='⏸ หยุด';this.tick();
  }
  tick(){
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{
      if(!this.playing)return;
      if(this.i<this.steps.length-1){this.go(this.i+1);this.tick()}else this.pause();
    },1500/this.speed);
  }
  pause(){this.playing=false;clearTimeout(this.timer);this.playBtn.textContent='⏯ เล่นอัตโนมัติ'}
}

/* ================= GraphView ================= */
class GraphView{
  constructor(svg,g,{r=20,vb=[520,340],onEdge=null,onNode=null}={}){
    this.svg=svg;this.g=g;
    svg.setAttribute('viewBox',`0 0 ${vb[0]} ${vb[1]}`);svg.innerHTML='';
    const pos={};g.nodes.forEach(n=>pos[n.id]=n);
    const gE=svgEl('g'),gT=svgEl('g'),gN=svgEl('g');svg.append(gE,gT,gN);
    this.eL=[];this.eT=[];this.nG={};this.nC={};this.nS={};
    g.edges.forEach((e,i)=>{
      const a=pos[e.u],b=pos[e.v],t=e.t??.5;
      const ln=svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'});
      const tx=a.x+(b.x-a.x)*t,ty=a.y+(b.y-a.y)*t;
      const tt=svgEl('text',{x:tx,y:ty+5,class:'ew','text-anchor':'middle'});
      tt.textContent=e.w;
      if(onEdge){tt.setAttribute('tabindex','0');tt.setAttribute('role','button');tt.setAttribute('aria-label',`แก้น้ำหนักเส้น ${edgeName(e)} (ตอนนี้ ${e.w})`);
        tt.addEventListener('click',()=>onEdge(i,tx,ty));
        tt.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();onEdge(i,tx,ty)}})}
      gE.append(ln);gT.append(tt);this.eL.push(ln);this.eT.push(tt);
    });
    g.nodes.forEach(n=>{
      const gg=svgEl('g',{class:'node'});
      const c=svgEl('circle',{cx:n.x,cy:n.y,r});
      const id=svgEl('text',{x:n.x,y:n.y,class:'id'});id.textContent=n.id;
      const sub=svgEl('text',{x:n.x,y:n.y+r+15,class:'sub'});
      gg.append(c,id,sub);gN.append(gg);
      this.nG[n.id]=gg;this.nC[n.id]=c;this.nS[n.id]=sub;
      if(onNode)gg.addEventListener('click',()=>onNode(n.id));
    });
  }
  setSub(id,sub,animate){
    const t=this.nS[id];if(t._tw){cancelAnimationFrame(t._tw);t._tw=0}
    if(sub&&typeof sub==='object'){
      if(sub.tween){const [a,b]=sub.tween;
        if(!animate||RM||a===INF||b===INF||a===b){t.textContent=sub.prefix+fmtD(b);return}
        const t0=performance.now();
        const f=now=>{const k=Math.min(1,(now-t0)/450);t.textContent=sub.prefix+Math.round(a+(b-a)*k);t._tw=k<1?requestAnimationFrame(f):0};
        t._tw=requestAnimationFrame(f);return}
      t.innerHTML=`<tspan class="strike">${sub.old}</tspan> ${sub.now}`;return;
    }
    t.textContent=sub??'';
  }
  update(st,animate=true){
    this.g.nodes.forEach(n=>{
      const s=(st.nodes&&st.nodes[n.id])||{};
      this.nG[n.id].setAttribute('class','node '+(s.cls||'')+(this.pickable?' pick':''));
      const c=this.nC[n.id];c.style.fill=s.color?`color-mix(in srgb, ${s.color} 32%, var(--surface))`:'';c.style.stroke=s.color||'';
      this.setSub(n.id,s.sub,animate);
    });
    this.g.edges.forEach((e,i)=>{
      const cls=(st.edges&&st.edges[i])||'';
      this.eL[i].setAttribute('class','edge '+cls);
      this.eT[i].setAttribute('class','ew '+cls);
    });
  }
}

    pseudo:['ALGORITHM Prim(G)','  VT ← {v0}','  ET ← ∅','  for i ← 1 to |V| − 1 do','      find a minimum-weight edge e* = (v*, u*) among all the edges (v, u)','          such that v is in VT and u is in V − VT','      VT ← VT ∪ {u*}','      ET ← ET ∪ {e*}','  return ET'],
    cx:'ความซับซ้อน: (|V| − 1 + |E|) O(log |V|) = O(|E| log |V|) เมื่อใช้ min-heap',

  });

    title:'Kruskal’s Algorithm',
    intro:'สร้าง MST โดยเรียงเส้นทั้งกราฟตามน้ำหนัก แล้วไล่รับทีละเส้น ถ้าเส้นไหนทำให้เกิดวงจรจะปฏิเสธ จนได้ครบ |V| − 1 เส้น',

    pseudo:['ALGORITHM Kruskal(G)','  sort E in nondecreasing order of the edge weights','  ET ← ∅; ecounter ← 0','  k ← 0','  while ecounter < |V| − 1 do','      k ← k + 1','      if ET ∪ {e_ik} is acyclic','          ET ← ET ∪ {e_ik}; ecounter ← ecounter + 1','  return ET'],
    cx:'ความซับซ้อน: O(|E| log |E|) จากการเรียงเส้น (Union-Find ใช้เวลาน้อยกว่า)',

  LABS.dijkstra=new Lab('dijkstra',{

    pseudo:['ALGORITHM Dijkstra(G, s)','  Initialize(Q)','  for every vertex v in V','      dv ← ∞; pv ← null','      Insert(Q, v, dv)','  ds ← 0; Decrease(Q, s, ds)','  VT ← ∅','  for i ← 0 to |V| − 1 do','      u* ← DeleteMin(Q)','      VT ← VT ∪ {u*}','      for every vertex u in V − VT that is adjacent to u* do','          if du* + w(u*, u) < du','              du ← du* + w(u*, u); pu ← u*','              Decrease(Q, u, du)'],
    cx:'ความซับซ้อน: Θ(|V|²) เมื่อใช้ weight matrix + unordered array, O(|E| log |V|) เมื่อใช้ adjacency list + min-heap',
    onNode:(lab,id)=>{const st=lab.steps[lab.player.i];if(!st||!st.final){lab.say('คลิกโหนดเพื่อดูเส้นทางได้เมื่อถึงขั้นสุดท้าย');return}lab.say('');lab.selNode=id;lab.showPath(st)},
    after:(lab,st)=>{if(st.final&&lab.selNode)lab.showPath(st)},

  });
  LABS.dijkstra.showPath=function(st){
    const f=st.final,edges={...st.edges};let c=this.selNode;

  };
}

/* ================= Huffman ================= */
function layoutForest(roots){
  const pos={};let slot=0,maxD=0;
  const walk=(n,d)=>{maxD=Math.max(maxD,d);if(!n.l){pos[n.id]={x:slot++,d};return pos[n.id].x}const a=walk(n.l,d+1),b=walk(n.r,d+1);pos[n.id]={x:(a+b)/2,d};return pos[n.id].x};
  roots.forEach(r=>walk(r,0));
  return {pos,slots:slot,maxD};
}
function drawHuff(svg,roots,o={}){
  const SX=62,SY=78,{pos,slots,maxD}=layoutForest(roots);
  const W=Math.max(360,slots*SX+24),H=30+maxD*SY+64,ox=(W-slots*SX)/2;
  const X=id=>ox+(pos[id].x+.5)*SX,Y=id=>30+pos[id].d*SY;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let edges='',bits='',nodes='';
  const hlN=o.path||new Set();
  const visit=nd=>{
    if(!nd.l)return;
    [[nd.l,'0'],[nd.r,'1']].forEach(([c,b])=>{
      const hl=hlN.has(nd.id)&&hlN.has(c.id);
      edges+=`<line class="he ${hl?'hl':''}" x1="${X(nd.id)}" y1="${Y(nd.id)}" x2="${X(c.id)}" y2="${Y(c.id)}"/>`;
      if(o.bits){const bx=X(nd.id)+(X(c.id)-X(nd.id))*.45,by=Y(nd.id)+(Y(c.id)-Y(nd.id))*.45;bits+=`<g class="hb"><circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by}">${b}</text></g>`}
      visit(c);
    });
  };
  roots.forEach(visit);
  const draw=nd=>{
    const x=X(nd.id),y=Y(nd.id);
    const cls=(o.picked&&o.picked.includes(nd.id)?'pk ':'')+(o.newId===nd.id?'nw ':'')+(hlN.has(nd.id)?'hl':'');
    if(!nd.l){
      const code=o.codes&&o.codes[nd.sym];
      nodes+=`<g transform="translate(${x} ${y})"><g class="hn ${cls}"><rect x="-20" y="-15" width="40" height="30" rx="6"/><text class="sym" y="1">${esc(nd.sym)}</text><text class="fw" y="30">${hfmt(nd.w)}</text>${code?`<text class="cw" y="46">${code}</text>`:''}</g></g>`;
    }else{
      nodes+=`<g transform="translate(${x} ${y})"><g class="hn ${cls}"><circle r="19"/><text class="iw" y="1">${hfmt(nd.w)}</text></g></g>`;
      draw(nd.l);draw(nd.r);
    }
  };
  roots.forEach(draw);
  svg.innerHTML=edges+bits+nodes;
}

  say(t){this.msg.hidden=!t;this.msg.textContent=t||''}
  drawRows(){
    $('#hf-rows').innerHTML=this.rows.map((r,i)=>`<div class="sym-row"><input class="hs" id="hs-${i}" maxlength="1" value="${esc(r[0])}" aria-label="ตัวอักษรที่ ${i+1}"><input class="hf" id="hf-${i}" type="number" step="any" min="0" value="${r[1]}" aria-label="ความถี่ของตัวอักษรที่ ${i+1}"><button class="btn x" type="button" data-i="${i}" aria-label="ลบตัวอักษรที่ ${i+1}">✕</button></div>`).join('');
  }
  readRows(soft){
    const rs=$$('#hf-rows .sym-row').map(r=>[$('.hs',r).value,Number($('.hf',r).value)]);
    if(soft){this.rows=rs;return true}
    return rs;
  }
  apply(){
    const rs=this.readRows();
    if(rs.length<2){this.say('ต้องมีอย่างน้อย 2 ตัวอักษร');return}
    if(rs.some(r=>r[0].length!==1)){this.say('ช่องตัวอักษรต้องใส่ 1 ตัวอักษร (ใช้ _ แทนช่องว่างได้)');return}
    if(new Set(rs.map(r=>r[0])).size!==rs.length){this.say('มีตัวอักษรซ้ำกัน กรุณาใช้ตัวอักษรที่ไม่ซ้ำ');return}
    if(rs.some(r=>!(r[1]>0)||!isFinite(r[1]))){this.say('ความถี่ต้องเป็นตัวเลขมากกว่า 0');return}
    this.say('');this.rows=rs;
    const sum=rs.reduce((s,r)=>s+r[1],0);
    $('#hf-sum').textContent=Math.abs(sum-1)<.0005?`ผลรวมความถี่ = 1`:`ผลรวมความถี่ = ${+sum.toFixed(4)} (ไม่ใช่ 1) การคำนวณจำนวนบิตเฉลี่ยจะถ่วงน้ำหนักตามสัดส่วน หรือกดปุ่ม “ทำให้ผลรวม = 1”`;
    $('#hf-norm').hidden=Math.abs(sum-1)<.0005;
    this.items=rs.map(r=>({sym:r[0],w:Math.max(1,Math.round(r[1]*10000))}));
    this.steps=huffSteps(this.items);this.res=this.steps.result;
    this.player.setSteps(this.steps,0);
    this.encode();this.decode(true);
  }
  random(){
    const n=4+Math.floor(Math.random()*3),r=Array.from({length:n},()=>1+Math.floor(Math.random()*20)),s=r.reduce((a,b)=>a+b,0);
    const q=r.map(x=>Math.max(1,Math.floor(x/s*100)));
    q[q.indexOf(Math.max(...q))]+=100-q.reduce((a,b)=>a+b,0);
    this.rows=q.map((x,i)=>['ABCDEFGH'[i],x/100]);this.drawRows();this.apply();
  }
  render(st,i,dir){
    drawHuff(this.svg,st.roots,{picked:st.picked,newId:dir>0?st.newId:null,bits:st.bits,path:st.path,codes:st.codes});
    this.why.innerHTML=st.text;
    this.lns.forEach((l,k)=>l.classList.toggle('on',(st.hl||[]).includes(k)));
    this.chipsTitle.textContent=st.chipsTitle;
    this.chips.innerHTML=st.chips.map(c=>`<span class="chip ${c.cls}">${c.t}${c.sub?` <small>(${esc(c.sub)})</small>`:''}</span>`).join('');
    let h=`<table class="pt"><thead><tr><th>คิวหลังแต่ละรอบ (น้อย → มาก)</th></tr></thead><tbody>${st.rows.map((r,k)=>`<tr class="${k===st.rows.length-1?'cur':''}"><td>${r.map(x=>`<span class="pc">${esc(x)}</span>`).join('')}</td></tr>`).join('')}</tbody></table>`;
    const cs=Object.keys(st.codes);
    if(cs.length){
      h+=`<table class="ct" style="margin-top:8px"><thead><tr><th>symbol</th><th>frequency</th><th>codeword</th></tr></thead><tbody>${this.items.filter(x=>x.sym in st.codes).map(x=>`<tr><td>${esc(x.sym)}</td><td>${hfmt(x.w)}</td><td class="cw">${st.codes[x.sym]}</td></tr>`).join('')}</tbody></table>`;
    }
    this.paper.innerHTML=h;
    const r=this.res,tot=r.tot;
    $('#hf-stats').innerHTML=st.final?`จำนวนบิตเฉลี่ย = Σ(ความยาว × ความถี่)<br>= ${this.items.map(x=>`${r.codes[x.sym].length}·${hfmt(x.w)}`).join(' + ')}${Math.abs(tot-10000)<5?'':` (หารด้วยผลรวม ${hfmt(tot)})`}<br>= <b>${+r.avg.toFixed(4)}</b> บิต/ตัวอักษร<br>รหัสความยาวคงที่ = ⌈log₂ ${this.items.length}⌉ = <b>${r.fixed}</b> บิต<br>Compression ratio = (${r.fixed} − ${+r.avg.toFixed(4)}) / ${r.fixed} × 100% = <b>${+r.ratio.toFixed(2)}%</b>`:'<span class="muted">ไปให้ถึงขั้นสุดท้ายเพื่อดูการคำนวณ</span>';
  }
  encode(){
    const t=$('#hf-enc').value,o=$('#hf-enc-out');
    if(!t){o.textContent='';return}
    const r=huffEncode(this.res.codes,t);
    o.innerHTML=r.err?`<span class="warn">${esc(r.err)}</span>`:`${t.split('').map(c=>`<span class="mono muted" style="font-size:.8em">${esc(c)}=</span>${this.res.codes[c]}`).join(' · ')}<br>→ ${r.bits}`;
  }
  decode(quiet){
    const bits=$('#hf-dec').value.trim(),out=$('#hf-dec-out');
    if(!/^[01]*$/.test(bits)){out.innerHTML='<span class="warn">ใส่ได้เฉพาะเลข 0 และ 1</span>';return}
    this.dbits=bits;
    this.dsteps=huffDecodeSteps(this.res.root,bits);
    this.dplayer.setSteps(this.dsteps,0);
  }
  renderDec(st,i){
    drawHuff($('#hf-dsvg'),[this.res.root],{bits:true,path:st.path,codes:this.res.codes});
    $('#hf-bits').innerHTML=this.dbits.split('').map((b,k)=>`<span class="${k<st.i?'done':k===st.i?'now':''}">${b}</span>`).join('')||'<span>(ว่าง)</span>';
    $('#hf-dec-out').textContent=st.out?'→ '+st.out:'';
    $('#hf-dtext').innerHTML=st.text;
  }
}

function numOpts(c){
  const set=new Set([c]);
  for(const d of shuf([-3,-2,-1,1,2,3,4])){if(set.size>=4)break;if(c+d>0)set.add(c+d)}
  return shuf([...set]);
}
function randomQs(){

  g=randomGraph(randN());

   const path=[];let c=t;while(c){path.unshift(c);c=r.p[c]}
   const opts=numOpts(r.d[t]).map(String);
   out.push({tag:'สุ่ม · Dijkstra',q:`Dijkstra จากต้นทาง a ได้ d(${t}) เท่าไร`,graph:g,o:opts,a:opts.indexOf(String(r.d[t])),e:`เส้นทางสั้นที่สุดคือ ${path.join('–')} ระยะ ${r.d[t]}`,shuffled:true})}
